[package]
name = "truswap"
version = "1.1.0"
edition = "2021"
authors = ["PowGrid Neural Mesh"]
license = "MIT"
description = "P2P Cross-Chain Atomic Swap Runner & Web Engine (TRU ↔ Base)"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"


[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
prost = "0.13"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
sha3 = "0.10"
libc = "0.2"
bip39 = "3.0.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
bip32 = { version = "0.6.0", features = ["alloc"] }
rqrr = { version = "0.11.0", default-features = false }
jpeg-encoder = "0.7.1"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
jni = "0.22"




[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[package.metadata.android]
package = "com.powgrid.truswap"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "TRUSWAP"
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
debuggable = true
uses_cleartext_traffic = true


[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera.autofocus"
required = false

[package.metadata.android.signing.release]
path = "/home/user/.android/debug.keystore"
keystore_password = "android"


