  \n\n   2. Installation & Compilation\n\n    Option A: Running a Precompiled Binary\n\n     On Linux & macOS:\n   bash\n  Make binary executable\nchmod +x truswap\n\n  Run on Base Mainnet (default)\n./truswap\n\n  Or run on Base Sepolia testnet\n./truswap   testnet\n   \n\n     On Windows (PowerShell or Command Prompt):\n   powershell\n  Run on Base Mainnet (default)\n.\\truswap.exe\n\n  Or run on Base Sepolia testnet\n.\\truswap.exe   testnet\n   \n\n   \n\n    Option B: Building from Source\n\nEnsure Rust toolchain is installed ( rustc  = 1.75 ):\n\n     1. Clone the repository\n   bash\ngit clone https://github.com/powgrid/truswap.git\ncd truswap\n   \n\n     2. Build release binary\n\n    On Linux / macOS / Windows WSL2  :\n     bash\n  cargo build   release\n    Executable generated at: ./target/release/truswap\n     \n\n    On Windows Native (PowerShell / Command Prompt)  :\n  Requires Microsoft C++ Build Tools (Visual Studio 2022 C++ build tools):\n     powershell\n  cargo build   release\n    Executable generated at: .\\target\\release\\truswap.exe\n     \n\n    Cross compiling for Windows from Linux  :\n  You can cross compile a native standalone Windows  .exe  directly from Linux without a Windows machine:\n     bash\n  cargo zigbuild   target x86 64 pc windows gnu   release\n    Executable generated at: ./target/x86 64 pc windows gnu/release/truswap.exe\n     \n\n   \n\n   3. Configuration & Environment Variables\n\nTRUSWAP runs with working defaults out of the box. To customize ports, network seeds, or RPC endpoints, you can place a  .env  file in the working directory or pass command line arguments:\n\n   ini\n  Network Mode (0 = Mainnet [default], 1 = Testnet)\nTRUSWAP TESTNET=0\n\n  Local Web Interface Bind Address (default: 127.0.0.1:8899)\n  Use TRUSWAP DEV=1 to bind to 0.0.0.0:8899 for local network access\nBIND ADDR=127.0.0.1:8899\n\n  Base RPC Endpoints\nBASE RPC URL=https://mainnet.base.org\nBASE WSS URL=wss://mainnet.base.org\n\n  Smart Contracts (Base Mainnet Defaults)\nBASE HTLC CONTRACT=0x812b611208297eb7A2b153BECA8b2AF47C7614DF\nBASE USDC CONTRACT=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\n\n  TRU P2P Seed Nodes (IP:Port)\nTRU SEEDS=137.184.68.43:21833,193.181.216.10:21833\n\n  Storage Directory\nDATA DIR=./data\n   \n\n   \n\n   4. Starting the Daemon\n\nRun the executable from your terminal:\n\n   bash\n./target/release/truswap\n   \n\nThe daemon initializes the encrypted vault, connects to peer nodes, and launches the local web server:\n\n   text\n[INFO] TRUSWAP starting up...\n[INFO] Vault initialized at ./data/vault.dat\n[INFO] Connecting to TRU P2P network (21833)...\n[INFO] Connecting to Base RPC (https://mainnet.base.org)...\n[INFO] Web UI listening on http://127.0.0.1:8899\n   \n\nOpen your browser and navigate to:\n   \nhttp://127.0.0.1:8899\n   \n\n   \n\n   5. User Interface Tour (What You See on Screen)\n\nWhen you open  http://127.0.0.1:8899 , TRUSWAP presents a single unified terminal interface organized into distinct operational areas:\n\n<div class=\"cyber diagram box ui tour diagram\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" LAYOUT BLUEPRINT</span \n    <span class=\"diagram heading\" TRUSWAP Terminal Cockpit Organization</span \n  </div \n\n  <div class=\"ui mockup frame\" \n    <div class=\"ui mockup top\" \n      <span TRUSWAP v1.0.0 \u2022 Atomic P2P Market</span \n      <span \u25cf Online (3 peers) &nbsp; &nbsp; \ud83d\udd0d TRU  46,936 &nbsp; &nbsp; Mempool: 1</span \n    </div \n\n    <div class=\"ui mockup vaults\" \n      <div class=\"mockup card tru card\" \n        <div class=\"card title\" \ud83d\udfe1 TRU VAULT</div \n        <div class=\"card detail\" Balance: <strong 37.59838566 TRU</strong  \u2022 Address: TRJQ...94Gm1</div \n        <div class=\"card pills\" \n          <span class=\"pill\" [Export]</span \n          <span class=\"pill\" [Copy]</span \n          <span class=\"pill\" [Deposit]</span \n          <span class=\"pill\" [Withdraw]</span \n          <span class=\"pill\" \ud83d\udd12 Local Encrypted</span \n        </div \n      </div \n\n      <div class=\"mockup card base card\" \n        <div class=\"card title\" \ud83d\udd35 BASE VAULT</div \n        <div class=\"card detail\" Balance: <strong 0.00 USDC</strong  \u2022 \u26fd Gas: 0.0098 ETH \u2022 0xfb...cA83</div \n        <div class=\"card pills\" \n          <span class=\"pill\" [Export]</span \n          <span class=\"pill\" [Copy]</span \n          <span class=\"pill\" [Deposit]</span \n          <span class=\"pill\" [Withdraw]</span \n          <span class=\"pill\" Base Explorer \u2197</span \n        </div \n      </div \n    </div \n\n    <div class=\"ui mockup section\" \n      <div class=\"section title\" \u26a1 SPOT LIMIT ORDER</div \n      <div class=\"mockup form row\" \n        <span [Buy TRU] [Sell TRU]</span \n        <span \u2022 Available: 0.00 USDC</span \n        <span \u2022 Price: [1.0000] USDC</span \n        <span \u2022 Amount: [0.0000] TRU (25%   50%   75%   100%)</span \n        <span \u2022 Button: [Enter Amount & Price]</span \n      </div \n    </div \n\n    <div class=\"ui mockup section\" \n      <div class=\"section title\" \ud83d\udcca TRU / USDC SPOT (Orderbook)</div \n      <div class=\"mockup table preview\" \n        <div class=\"mockup row\" \n          <span PRICE: $1.0000</span \n          <span AMOUNT: 29.0000 TRU</span \n          <span TOTAL: $29.00 USDC</span \n          <span class=\"action btn\" [Swap]</span \n        </div \n      </div \n    </div \n  </div \n</div \n\n    Top Navigation & Status Bar\n    Network Status Badge  : Shows  \u25cf Online  with current count of connected TRU P2P daemon peers.\n    Blockchain Tip Badge  : Displays current TRU block height (e.g.  \ud83d\udd0d TRU  46,936 ). Clicking this badge opens the built in   TRU Block Explorer   ( /explorer ).\n    Mempool Counter  : Shows unconfirmed transactions currently in the local mempool. Clicking opens the mempool view in the explorer.\n\n    Dual Vault Cards\nPositioned at the top of the interface for immediate balance awareness:\n1.   TRU Vault Card (Gold)  :\n     Displays your confirmed native TRU balance and unconfirmed balance.\n     Shows your local TRU receiving address (starts with  T ).\n     Action buttons:\n         Export  : Opens the key reveal modal showing your 24 word BIP 39 mnemonic and WIF private key.\n         Copy  : Copies your TRU address to clipboard.\n         Deposit  : Opens the deposit modal displaying a QR code and address for receiving TRU.\n         Withdraw  : Opens the TRU transfer modal to send coins to an external address.\n         UTXO Ledger  : Opens the unspent transaction output inspector.\n2.   Base Vault Card (Blue)  :\n     Displays your available Base USDC balance and native ETH gas balance.\n     Shows your local Base EVM address (starts with  0x ).\n     Action buttons:\n         Export  : Opens the export modal with reveal buttons for your EVM private key and 12 word seed.\n         Copy  : Copies your Base  0x  address to clipboard.\n         Deposit  : Opens the Base deposit modal with QR code and address.\n         Withdraw  : Opens the Base withdrawal modal for USDC or ETH.\n         Base Explorer \u2197  : Opens your address directly on BaseScan.\n\n    Exchange Trading Cockpit\nPositioned in a clean stacked layout directly below the vault cards:\n    Spot Limit Order (Top Card)  :\n      Direction Switcher  : Toggle between   Buy TRU   (spending USDC) and   Sell TRU   (spending TRU).\n      Available Balance Readout  : Dynamically displays available funds in the corresponding vault.\n      3 Responsive Inputs  :\n        Price per 1 TRU  : Set your limit price in USDC, with a one click   Best Price   helper.\n        Amount  : Specify quantity of TRU, with an interactive percentage slider (25%, 50%, 75%, 100%) visible when selling.\n        Total  : Calculated total in USDC, with an interactive percentage slider visible when buying.\n      Action Button  : Displays  Enter Amount & Price  when inputs are empty, updating dynamically to  Buy TRU  or  Sell TRU .\n    TRU / USDC Spot (Bottom Orderbook Terminal)  :\n    Sub navigation filter tabs:\n        \ud83d\udcca Book  : Combined overview of open bids and asks.\n        \ud83d\udd34 Asks  : Open sell offers from peers (where you can buy TRU immediately).\n        \ud83d\udfe2 Bids  : Open buy offers from peers (where you can sell TRU immediately).\n        \ud83d\udd04 In Progress  : Active atomic swaps currently executing, with live status tags and access to the   Automation Audit Modal  .\n        \ud83d\udcdc History  : Historical completed trades and on chain HTLC transactions.\n\n    Footer\nContains copyright information and the official documentation link:   \ud83d\udcd6 The TRUSWAP Book   ( /docs ).\n\n   \n\n   6. Setting Up and Backing Up Your Vault\n\nWhen TRUSWAP starts for the first time, it automatically creates  data/vault.dat  encrypted with a 256 bit key ( data/.vault.key ) restricted to  0o600  permissions.\n\n    Backing Up Your Recovery Phrases:\n1. On the   TRU Vault Card  , click the   Export   button.\n     The modal displays your   24 word BIP 39 seed phrase   and your   WIF Private Key  .\n     Write these down on paper in exact order.\n2. On the   Base Vault Card  , click the   Export   button.\n     Click   \ud83d\udc41 Show   next to the private key and 12 word seed phrase.\n     Write down your   12 word Base seed phrase   on paper.\n3. Keep both paper backups in a safe, offline place.\n\n  [!CAUTION]\n  TRUSWAP is strictly non custodial. If your computer crashes and you do not have these backup phrases, your funds cannot be recovered by anyone.\n\n   \n\n   7. Funding Your Vault (Deposits & Gas)\n\nBefore trading, you must deposit funds into your local vault:\n\n    1. Depositing TRU (to Sell TRU):\n  Click   Deposit   on the TRU Vault Card.\n  Copy your  T...  address or scan the displayed QR code.\n  Send TRU from your mining pool or external wallet. Once the transaction confirms in a block, your balance updates automatically.\n\n    2. Depositing Base USDC & ETH (to Buy TRU):\n  Click   Deposit   on the Base Vault Card.\n  Copy your  0x...  address or scan the QR code.\n  Send   Circle USDC on the Base network   to this address.\n    Essential Gas Requirement  : Send a small amount of   native ETH on Base   ($1.00 to $2.00 worth). Every interaction with the Base blockchain (approving USDC, locking deposits, or claiming funds) requires a fraction of a cent in ETH gas. Without ETH in your Base vault, transactions cannot be signed.\n\n   \n\n   8. Step by Step Trading Walkthrough\n\n    Scenario A: Buying TRU with USDC (Taker)\n1. In the   TRU / USDC Spot   orderbook below, click the   \ud83d\udd34 Asks   tab to view open sell offers.\n2. Find an offer that suits you and click the   [Swap]   button in that row.\n3. The   Take Order Modal   appears, showing:\n       YOU SEND  : Exact amount of USDC required on Base.\n       YOU RECEIVE  : Exact amount of TRU you will receive.\n       Maker Beneficiary  : The seller's Base address.\n       Your Receiving Vault  : Your local TRU address.\n       Cryptographic Hashlock  : The 20 byte HASH160 digest securing the swap.\n       Estimated Rate  : Exchange rate (e.g.,  1 TRU = 1.0000 USDC ).\n4. Click   Confirm Swap  .\n5. TRUSWAP executes the swap automatically:\n     Approves USDC spending on the  BaseHTLC  contract if needed.\n     Calls  createSwap  on Base to lock your USDC in escrow.\n     Switches the order to the   \ud83d\udd04 In Progress   tab.\n     Monitors the TRU blockchain until the seller locks the TRU and 6 confirmations pass.\n     When the seller claims the USDC on Base, TRUSWAP extracts the secret preimage from the on chain event and automatically claims your TRU on the PoW network.\n\n    Scenario B: Selling TRU for USDC (Maker)\n1. In the   Spot Limit Order   card above, ensure the   Sell TRU   tab is selected.\n2. Enter your desired   Price (USDC)   and the   Amount (TRU)   you want to sell (or drag the percentage slider).\n3. The button changes from  Enter Amount & Price  to   Sell TRU  . Click   Sell TRU  .\n4. TRUSWAP cryptographically signs the order with your local vault key and broadcasts it to the P2P relay mesh. The order appears in the orderbook for other traders.\n5. When a buyer accepts your order:\n     The swap appears under   \ud83d\udd04 In Progress  .\n     TRUSWAP broadcasts a 103 byte HTLC script locking your TRU on chain.\n     Once the buyer deposits their USDC in  BaseHTLC , TRUSWAP calls  claimSwap  on Base using your secret preimage, receiving your USDC.\n     Publishing the secret allows the buyer to claim their TRU simultaneously.\n\n    The Automation Audit Modal\nAt any time during an active swap, you can click on the swap in the   \ud83d\udd04 In Progress   tab to open the   Automation Audit Modal  . This modal displays real time telemetry from the autonomous swap engine, including step progress indicators, cryptographic hashlocks, block confirmation counters, and raw on chain transaction hashes.\n\n   \n\n   9. Withdrawing Funds to External Wallets\n\nWhen you want to transfer funds out of TRUSWAP to cold storage or an external wallet:\n\n    Withdrawing Native TRU:\n1. Click   Withdraw   on the   TRU Vault Card  .\n2. Enter the destination TRU address ( T... ), or click the   Camera Icon   to scan a QR code if using a webcam.\n3. Click   Max   to withdraw your entire available balance, or enter a specific amount.\n4. The modal shows the exact network mining fee (e.g.  0.00000498 TRU ) and the net amount you will receive.\n5. Click   Broadcast Withdrawal  . The transaction is signed locally and sent to the TRU P2P network.\n\n    Withdrawing Base Assets (USDC or ETH):\n1. Click   Withdraw   on the   Base Vault Card  .\n2. Select the asset to withdraw:   USDC   or   ETH  .\n3. Enter the destination Ethereum address ( 0x... ).\n4. Enter the amount or click   Available: Max  .\n5. The form calculates the required gas fee. Click   Submit Withdrawal  . The transaction is signed and broadcast via JSON RPC.\n"}, {"id": "03_quickstart_android", "num": "03", "file": "03_quickstart_android.md", "title": "3. Android Mobile Setup", "icon": "\ud83d\udcf1", "words": 1083, "read_time": "5 min read", "html": "<h1 id=\"chapter-3-android-mobile-quick-start-guide\" class=\"doc-heading doc-h1\">Chapter 3: Android Mobile Quick Start Guide<a class=\"anchor-link\" href=\"#chapter-3-android-mobile-quick-start-guide\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how to install, configure, and use TRUSWAP on an Android smartphone, followed by technical specifications for mobile developers.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-what-is-the-truswap-android-app\" class=\"doc-heading doc-h2\">1. What is the TRUSWAP Android App?<a class=\"anchor-link\" href=\"#1-what-is-the-truswap-android-app\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Most mobile crypto wallets rely on external centralized servers to check balances and send transactions. TRUSWAP on Android is different:</p>\n<ul class=\"doc-list\">\n<li><strong>Self-Contained</strong>: The full cryptographic engine, blockchain sync, and swap protocols run directly on your phone.</li>\n<li><strong>No Third-Party Extensions</strong>: You do not need MetaMask, Trust Wallet, or any browser extensions.</li>\n<li><strong>Direct Peer-to-Peer</strong>: Connects directly to TRU network nodes and public Base RPCs.</li>\n<li><strong>Native Performance</strong>: Written in native Rust using the Android Native Development Kit (NDK). It does not run on bloated Java frameworks, so it launches instantly and uses minimal battery.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-step-by-step-user-guide-for-beginners\" class=\"doc-heading doc-h2\">2. Step-by-Step User Guide (For Beginners)<a class=\"anchor-link\" href=\"#2-step-by-step-user-guide-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"step-1-install-the-apk\" class=\"doc-heading doc-h3\">Step 1: Install the APK<a class=\"anchor-link\" href=\"#step-1-install-the-apk\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Download <code>truswap.apk</code> to your phone (via browser, USB cable, or file transfer).</li>\n<li>Open your phone&#x27;s <strong>Files</strong> or <strong>Downloads</strong> app and tap <code>truswap.apk</code>.</li>\n<li>If Android prompts <em>&quot;Install unknown apps&quot;</em>, tap <strong>Settings</strong> and turn on the toggle for your file manager.</li>\n<li>Tap <strong>Install</strong>, then tap <strong>Open</strong>.</li>\n</ol>\n<h3 id=\"step-2-back-up-your-vault-crucial-first-step\" class=\"doc-heading doc-h3\">Step 2: Back Up Your Vault (Crucial First Step!)<a class=\"anchor-link\" href=\"#step-2-back-up-your-vault-crucial-first-step\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Open the app on your phone.</li>\n<li>At the top of the screen, you will see your two vault cards:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>On the <strong>TRU Vault Card</strong>, tap <strong>Export</strong> to display your <strong>24-word BIP-39 mnemonic</strong> and WIF key.</li>\n<li>On the <strong>Base Vault Card</strong>, tap <strong>Export</strong>, then tap <strong>\ud83d\udc41 Show</strong> to reveal your <strong>12-word seed phrase</strong> and EVM private key.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Write both sets of words down on physical paper</strong> in exact order and store them in a secure place.</li>\n</ol>\n<div class=\"doc-alert doc-alert-caution\"><div class=\"alert-title\">CAUTION</div><div class=\"alert-body\">TRUSWAP is fully non-custodial. If you lose your phone or delete the app without your backup words, your funds are permanently lost. Nobody can reset your password or recover your coins.</div></div>\n<h3 id=\"step-3-fund-your-mobile-wallet\" class=\"doc-heading doc-h3\">Step 3: Fund Your Mobile Wallet<a class=\"anchor-link\" href=\"#step-3-fund-your-mobile-wallet\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Before you can trade, you need funds in your wallet:</p>\n<ul class=\"doc-list\">\n<li><strong>To Sell TRU for USDC</strong>:</li>\n<li>On the <strong>TRU Vault Card</strong>, tap <strong>Deposit</strong> to display your receiving address and QR code (or tap <strong>Copy</strong>).</li>\n<li>Send TRU coins from your mining pool or external wallet to this address.</li>\n<li>You also need a tiny fraction of ETH on Base (about $1\u2013$2) to pay network fees when claiming your USDC.</li>\n<li><strong>To Buy TRU with USDC</strong>:</li>\n<li>On the <strong>Base Vault Card</strong>, tap <strong>Deposit</strong> to view your <code>0x...</code> address and QR code.</li>\n<li>Send Circle <strong>USDC</strong> on the Base network to this address.</li>\n<li>Send a small amount of <strong>ETH on Base</strong> ($1\u2013$2) to cover transaction fees (&quot;gas&quot;).</li>\n</ul>\n<h3 id=\"step-4-making-a-swap\" class=\"doc-heading doc-h3\">Step 4: Making a Swap<a class=\"anchor-link\" href=\"#step-4-making-a-swap\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Scroll down to the <strong>Exchange Trading Cockpit</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>To buy TRU immediately: In the <strong>TRU / USDC Spot</strong> orderbook, tap the <strong>\ud83d\udd34 Asks</strong> tab, find a suitable sell offer, and tap <strong>[Swap]</strong>.</li>\n<li>To set your own price: In the <strong>Spot Limit Order</strong> card, choose <strong>Buy TRU</strong> or <strong>Sell TRU</strong>, enter your Price and Amount (or drag the interactive percentage slider), and tap the action button (<strong>Buy TRU</strong> or <strong>Sell TRU</strong>).</li>\n</ul>\n<ol class=\"doc-list\">\n<li>When taking an existing offer, the <strong>Take Order Modal</strong> appears showing:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>What you send and receive.</li>\n<li>Counterparty addresses and cryptographic hashlock.</li>\n<li>Tap <strong>Confirm Swap</strong>.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Monitor Active Swaps</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>The swap switches to the <strong>\ud83d\udd04 In-Progress</strong> tab in the orderbook.</li>\n<li>Tap the active swap at any time to open the <strong>Automation Audit Modal</strong> and watch the live state machine (escrow locks, TRU block confirmation counter, and automatic claims).</li>\n<li>Keep the app open while the atomic swap is finalizing.</li>\n</ul>\n<h3 id=\"step-5-using-the-native-qr-scanner\" class=\"doc-heading doc-h3\">Step 5: Using the Native QR Scanner<a class=\"anchor-link\" href=\"#step-5-using-the-native-qr-scanner\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Whenever you need to input an external address (for example, in the <strong>Withdraw</strong> modal), tap the <strong>Camera Icon</strong> button next to the address input field.</li>\n<li>When Android prompts <em>&quot;Allow TRUSWAP to take pictures and record video?&quot;</em>, select <strong>&quot;While using the app&quot;</strong>.</li>\n<li>Point your camera at any TRU or Base QR code.</li>\n<li>The native NDK camera engine captures the frame, decodes the address in milliseconds, plays an acoustic tone, and populates the input field automatically. The camera turns off immediately to conserve battery.</li>\n</ol>\n<h3 id=\"step-6-withdrawing-funds\" class=\"doc-heading doc-h3\">Step 6: Withdrawing Funds<a class=\"anchor-link\" href=\"#step-6-withdrawing-funds\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>To withdraw native TRU: Tap <strong>Withdraw</strong> on the <strong>TRU Vault Card</strong>, paste or scan the recipient <code>T...</code> address, specify the amount (or tap <strong>Max</strong>), and tap <strong>Broadcast Withdrawal</strong>.</li>\n<li>To withdraw Base assets: Tap <strong>Withdraw</strong> on the <strong>Base Vault Card</strong>, choose <strong>USDC</strong> or <strong>ETH</strong>, enter the destination <code>0x...</code> address, and tap <strong>Submit Withdrawal</strong>.</li>\n</ol>\n<hr class=\"doc-divider\">\n<h2 id=\"3-developer-technical-specifications\" class=\"doc-heading doc-h2\">3. Developer &amp; Technical Specifications<a class=\"anchor-link\" href=\"#3-developer-technical-specifications\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">For developers building, auditing, or deploying the Android client:</p>\n<h3 id=\"system-architecture-requirements\" class=\"doc-heading doc-h3\">System &amp; Architecture Requirements<a class=\"anchor-link\" href=\"#system-architecture-requirements\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>OS Version</strong>: Android 8.0 (API Level 26, Oreo) or higher.</li>\n<li><strong>CPU Target</strong>: <code>arm64-v8a</code> (<code>aarch64-linux-android</code>).</li>\n<li><strong>Required Android Permissions</strong> (<code>AndroidManifest.xml</code>):</li>\n<li><code>android.permission.INTERNET</code>: Required for P2P network traffic and JSON-RPC queries.</li>\n<li><code>android.permission.CAMERA</code>: Required for the native NDK Camera2 QR scanner.</li>\n</ul>\n<h3 id=\"automated-build-pipeline\" class=\"doc-heading doc-h3\">Automated Build Pipeline<a class=\"anchor-link\" href=\"#automated-build-pipeline\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">The repository provides <a href=\"file:///home/user/git_test/projects/tru/repos/truswap/build_apk.sh\" target=\"_blank\" rel=\"noopener\"><code>build_apk.sh</code></a> to compile native Rust and assemble the signed package:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\"># Add the ARM64 Android cross-compilation target\nrustup target add aarch64-linux-android\n\n# Set up Android NDK environment variables\nexport ANDROID_NDK_HOME=/path/to/android-ndk\nexport PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH\n\n# Build the aligned, signed APK\n./build_apk.sh</code></pre></div>\n<p class=\"doc-para\">The script performs the following tasks:</p>\n<ol class=\"doc-list\">\n<li>Compiles the native Rust binary using <code>cargo build --target aarch64-linux-android --release</code>.</li>\n<li>Packages web assets (<code>src/ui/</code>) and assets into an unaligned APK archive.</li>\n<li>Runs <code>zipalign -v 4</code> to align 4-byte boundaries.</li>\n<li>Signs the final package using <code>apksigner</code> with a local PKCS#12 keystore.</li>\n<li>Emits the final installable binary: <code>truswap.apk</code>.</li>\n</ol>\n<h3 id=\"installing-via-adb-android-debug-bridge\" class=\"doc-heading doc-h3\">Installing via ADB (Android Debug Bridge)<a class=\"anchor-link\" href=\"#installing-via-adb-android-debug-bridge\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Developers can install and debug directly from their workstation:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\"># Install or update existing installation\nadb install -r truswap.apk\n\n# Launch the main activity\nadb shell am start -n com.truswap.app/.MainActivity\n\n# Stream logcat output filtered by TRUSWAP tag\nadb logcat -s TRUSWAP:V</code></pre></div>\n<h3 id=\"native-ndk-camera2-architecture-src-ndk-camera-rs\" class=\"doc-heading doc-h3\">Native NDK Camera2 Architecture (<code>src/ndk_camera.rs</code>)<a class=\"anchor-link\" href=\"#native-ndk-camera2-architecture-src-ndk-camera-rs\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Rather than pulling in Google Play Services ML Kit or Java CameraX libraries, TRUSWAP binds directly to the native Android C NDK:</p>\n<ul class=\"doc-list\">\n<li><strong>Sensor APIs</strong>: Uses <code>&lt;camera/NdkCameraManager.h&gt;</code>, <code>&lt;camera/NdkCameraDevice.h&gt;</code>, and <code>&lt;camera/NdkCaptureRequest.h&gt;</code>.</li>\n<li><strong>Image Pipeline</strong>: An <code>AImageReader</code> is configured for format <code>AIMAGE_FORMAT_YUV_420_888</code> at 640x480 resolution.</li>\n<li><strong>Zero-Copy Luminance Processing</strong>: Only Plane 0 (Y/luma buffer) is accessed, avoiding expensive RGB conversions.</li>\n<li><strong>Pure Rust QR Engine</strong>: Scanned using the pure-Rust <code>rqrr</code> crate, evaluating both 0\u00b0 and 90\u00b0 rotated orientations to handle portrait camera sensor mounts.</li>\n<li><strong>Resource Cleanup</strong>: When a QR code is matched, <code>ACaptureSession_stopRepeating</code> and <code>ACameraDevice_close</code> are invoked immediately, releasing hardware sensors.</li>\n</ul>", "raw_text": "  Chapter 3: Android Mobile Quick Start Guide\n\nThis chapter explains how to install, configure, and use TRUSWAP on an Android smartphone, followed by technical specifications for mobile developers.\n\n   \n\n   1. What is the TRUSWAP Android App?\n\nMost mobile crypto wallets rely on external centralized servers to check balances and send transactions. TRUSWAP on Android is different:\n\n    Self Contained  : The full cryptographic engine, blockchain sync, and swap protocols run directly on your phone.\n    No Third Party Extensions  : You do not need MetaMask, Trust Wallet, or any browser extensions.\n    Direct Peer to Peer  : Connects directly to TRU network nodes and public Base RPCs.\n    Native Performance  : Written in native Rust using the Android Native Development Kit (NDK). It does not run on bloated Java frameworks, so it launches instantly and uses minimal battery.\n\n   \n\n   2. Step by Step User Guide (For Beginners)\n\n    Step 1: Install the APK\n1. Download  truswap.apk  to your phone (via browser, USB cable, or file transfer).\n2. Open your phone's   Files   or   Downloads   app and tap  truswap.apk .\n3. If Android prompts  \"Install unknown apps\" , tap   Settings   and turn on the toggle for your file manager.\n4. Tap   Install  , then tap   Open  .\n\n    Step 2: Back Up Your Vault (Crucial First Step!)\n1. Open the app on your phone.\n2. At the top of the screen, you will see your two vault cards:\n     On the   TRU Vault Card  , tap   Export   to display your   24 word BIP 39 mnemonic   and WIF key.\n     On the   Base Vault Card  , tap   Export  , then tap   \ud83d\udc41 Show   to reveal your   12 word seed phrase   and EVM private key.\n3.   Write both sets of words down on physical paper   in exact order and store them in a secure place.\n     [!CAUTION]\n     TRUSWAP is fully non custodial. If you lose your phone or delete the app without your backup words, your funds are permanently lost. Nobody can reset your password or recover your coins.\n\n    Step 3: Fund Your Mobile Wallet\nBefore you can trade, you need funds in your wallet:\n    To Sell TRU for USDC  :\n    On the   TRU Vault Card  , tap   Deposit   to display your receiving address and QR code (or tap   Copy  ).\n    Send TRU coins from your mining pool or external wallet to this address.\n    You also need a tiny fraction of ETH on Base (about $1\u2013$2) to pay network fees when claiming your USDC.\n    To Buy TRU with USDC  :\n    On the   Base Vault Card  , tap   Deposit   to view your  0x...  address and QR code.\n    Send Circle   USDC   on the Base network to this address.\n    Send a small amount of   ETH on Base   ($1\u2013$2) to cover transaction fees (\"gas\").\n\n    Step 4: Making a Swap\n1. Scroll down to the   Exchange Trading Cockpit  :\n     To buy TRU immediately: In the   TRU / USDC Spot   orderbook, tap the   \ud83d\udd34 Asks   tab, find a suitable sell offer, and tap   [Swap]  .\n     To set your own price: In the   Spot Limit Order   card, choose   Buy TRU   or   Sell TRU  , enter your Price and Amount (or drag the interactive percentage slider), and tap the action button (  Buy TRU   or   Sell TRU  ).\n2. When taking an existing offer, the   Take Order Modal   appears showing:\n     What you send and receive.\n     Counterparty addresses and cryptographic hashlock.\n     Tap   Confirm Swap  .\n3.   Monitor Active Swaps  :\n     The swap switches to the   \ud83d\udd04 In Progress   tab in the orderbook.\n     Tap the active swap at any time to open the   Automation Audit Modal   and watch the live state machine (escrow locks, TRU block confirmation counter, and automatic claims).\n     Keep the app open while the atomic swap is finalizing.\n\n    Step 5: Using the Native QR Scanner\n1. Whenever you need to input an external address (for example, in the   Withdraw   modal), tap the   Camera Icon   button next to the address input field.\n2. When Android prompts  \"Allow TRUSWAP to take pictures and record video?\" , select   \"While using the app\"  .\n3. Point your camera at any TRU or Base QR code.\n4. The native NDK camera engine captures the frame, decodes the address in milliseconds, plays an acoustic tone, and populates the input field automatically. The camera turns off immediately to conserve battery.\n\n    Step 6: Withdrawing Funds\n1. To withdraw native TRU: Tap   Withdraw   on the   TRU Vault Card  , paste or scan the recipient  T...  address, specify the amount (or tap   Max  ), and tap   Broadcast Withdrawal  .\n2. To withdraw Base assets: Tap   Withdraw   on the   Base Vault Card  , choose   USDC   or   ETH  , enter the destination  0x...  address, and tap   Submit Withdrawal  .\n\n   \n\n   3. Developer & Technical Specifications\n\nFor developers building, auditing, or deploying the Android client:\n\n    System & Architecture Requirements\n    OS Version  : Android 8.0 (API Level 26, Oreo) or higher.\n    CPU Target  :  arm64 v8a  ( aarch64 linux android ).\n    Required Android Permissions   ( AndroidManifest.xml ):\n     android.permission.INTERNET : Required for P2P network traffic and JSON RPC queries.\n     android.permission.CAMERA : Required for the native NDK Camera2 QR scanner.\n\n    Automated Build Pipeline\nThe repository provides [ build apk.sh ](file:///home/user/git test/projects/tru/repos/truswap/build apk.sh) to compile native Rust and assemble the signed package:\n\n   bash\n  Add the ARM64 Android cross compilation target\nrustup target add aarch64 linux android\n\n  Set up Android NDK environment variables\nexport ANDROID NDK HOME=/path/to/android ndk\nexport PATH=$ANDROID NDK HOME/toolchains/llvm/prebuilt/linux x86 64/bin:$PATH\n\n  Build the aligned, signed APK\n./build apk.sh\n   \n\nThe script performs the following tasks:\n1. Compiles the native Rust binary using  cargo build   target aarch64 linux android   release .\n2. Packages web assets ( src/ui/ ) and assets into an unaligned APK archive.\n3. Runs  zipalign  v 4  to align 4 byte boundaries.\n4. Signs the final package using  apksigner  with a local PKCS 12 keystore.\n5. Emits the final installable binary:  truswap.apk .\n\n    Installing via ADB (Android Debug Bridge)\nDevelopers can install and debug directly from their workstation:\n\n   bash\n  Install or update existing installation\nadb install  r truswap.apk\n\n  Launch the main activity\nadb shell am start  n com.truswap.app/.MainActivity\n\n  Stream logcat output filtered by TRUSWAP tag\nadb logcat  s TRUSWAP:V\n   \n\n    Native NDK Camera2 Architecture ( src/ndk camera.rs )\nRather than pulling in Google Play Services ML Kit or Java CameraX libraries, TRUSWAP binds directly to the native Android C NDK:\n    Sensor APIs  : Uses  <camera/NdkCameraManager.h  ,  <camera/NdkCameraDevice.h  , and  <camera/NdkCaptureRequest.h  .\n    Image Pipeline  : An  AImageReader  is configured for format  AIMAGE FORMAT YUV 420 888  at 640x480 resolution.\n    Zero Copy Luminance Processing  : Only Plane 0 (Y/luma buffer) is accessed, avoiding expensive RGB conversions.\n    Pure Rust QR Engine  : Scanned using the pure Rust  rqrr  crate, evaluating both 0\u00b0 and 90\u00b0 rotated orientations to handle portrait camera sensor mounts.\n    Resource Cleanup  : When a QR code is matched,  ACaptureSession stopRepeating  and  ACameraDevice close  are invoked immediately, releasing hardware sensors.\n"}, {"id": "04_vault_and_security", "num": "04", "file": "04_vault_and_security.md", "title": "4. Vault & Key Security", "icon": "\ud83d\udd10", "words": 1153, "read_time": "6 min read", "html": "<h1 id=\"chapter-4-native-vault-key-management\" class=\"doc-heading doc-h1\">Chapter 4: Native Vault &amp; Key Management<a class=\"anchor-link\" href=\"#chapter-4-native-vault-key-management\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how your private keys are generated, stored, and protected in TRUSWAP, written for both first-time users and security auditors.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-vault-overview-for-beginners\" class=\"doc-heading doc-h2\">1. Vault Overview (For Beginners)<a class=\"anchor-link\" href=\"#1-vault-overview-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"what-is-the-dual-vault\" class=\"doc-heading doc-h3\">What is the Dual-Vault?<a class=\"anchor-link\" href=\"#what-is-the-dual-vault\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">TRUSWAP uses a <strong>Dual-Vault</strong> system. Think of it as a wallet with two separate pockets:</p>\n<ol class=\"doc-list\">\n<li><strong>The TRU Pocket</strong>: Holds your native Tokenized Real Utility ($TRU) coins on the Proof-of-Work blockchain. Addresses start with <code>T</code>.</li>\n<li><strong>The Base Pocket</strong>: Holds your Ethereum Layer-2 assets (ETH for network fees and USDC stablecoins). Addresses start with <code>0x</code>.</li>\n</ol>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">CRYPTOGRAPHY</span>\n    <span class=\"diagram-heading\">Dual-Vault Key Derivation & Account Architecture</span>\n  </div>\n  <div class=\"diagram-grid-2\">\n    <div class=\"diagram-node node-tru\">\n      <div class=\"node-badge\">\ud83d\udfe1 TRU ACCOUNT (POW CHAIN)</div>\n      <div class=\"node-title\">Native Bitcoin-like Script</div>\n      <ul class=\"node-list\">\n        <li><strong>Entropy:</strong> 32-Byte SECP256k1 (256-bit)</li>\n        <li><strong>Backup:</strong> 24-Word Mnemonic or WIF private key</li>\n        <li><strong>Public Key:</strong> 33-Byte Compressed Pubkey</li>\n        <li><strong>Hashing:</strong> HASH160 (SHA256 + RIPEMD160)</li>\n        <li><strong>Address:</strong> Base58Check (starts with <code>T...</code>)</li>\n      </ul>\n    </div>\n    <div class=\"diagram-node node-base\">\n      <div class=\"node-badge\">\ud83d\udd35 BASE ACCOUNT (EVM LAYER-2)</div>\n      <div class=\"node-title\">Ethereum-Compatible Account</div>\n      <ul class=\"node-list\">\n        <li><strong>Entropy:</strong> 12-Word BIP-39 (128-bit)</li>\n        <li><strong>Derivation:</strong> Standard path <code>m/44'/60'/0'/0/0</code></li>\n        <li><strong>Backup:</strong> 12-Word BIP-39 Mnemonic</li>\n        <li><strong>Hashing:</strong> Keccak-256 (Last 20 Bytes)</li>\n        <li><strong>Address:</strong> EIP-55 Checksum Hex (starts with <code>0x...</code>)</li>\n      </ul>\n    </div>\n  </div>\n</div>\n<h3 id=\"why-are-there-two-different-backup-phrases\" class=\"doc-heading doc-h3\">Why are there two different backup phrases?<a class=\"anchor-link\" href=\"#why-are-there-two-different-backup-phrases\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">A common question is: <em>&quot;Why can&#x27;t I back up everything with just one phrase?&quot;</em></p>\n<ul class=\"doc-list\">\n<li><strong>TRU</strong> is a Bitcoin-like Proof-of-Work blockchain. It uses a 256-bit private key. In TRUSWAP, this is represented as a <strong>24-word BIP-39 mnemonic phrase</strong> or a <strong>WIF key</strong> (a string of letters and numbers starting with <code>K</code> or <code>L</code>).</li>\n<li><strong>Base</strong> is an EVM network compatible with Ethereum. It uses standard <strong>12-word BIP-39 mnemonic phrases</strong> following the industry-standard BIP-44 path (<code>m/44&#x27;/60&#x27;/0&#x27;/0/0</code>).</li>\n</ul>\n<p class=\"doc-para\">By keeping them independent:</p>\n<ul class=\"doc-list\">\n<li>You can import an existing Ethereum wallet (like MetaMask or Rabby) directly into Base by entering your 12 words.</li>\n<li>Your TRU keys remain isolated from your EVM keys, ensuring an issue on one network cannot compromise the other.</li>\n</ul>\n<h3 id=\"what-are-vault-dat-and-vault-key\" class=\"doc-heading doc-h3\">What are <code>vault.dat</code> and <code>.vault.key</code>?<a class=\"anchor-link\" href=\"#what-are-vault-dat-and-vault-key\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">When you run TRUSWAP, two files are created in your data directory:</p>\n<ul class=\"doc-list\">\n<li><code>vault.dat</code>: An encrypted file containing your private keys and records of active swaps.</li>\n<li><code>.vault.key</code>: A 32-byte cryptographic secret key that unlocks <code>vault.dat</code>.</li>\n</ul>\n<p class=\"doc-para\">Think of <code>vault.dat</code> as a locked physical safe, and <code>.vault.key</code> as the physical key that opens it. If an attacker copies your <code>vault.dat</code> file, they cannot decrypt it or read your private keys without <code>.vault.key</code>.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"2-backup-and-recovery-instructions\" class=\"doc-heading doc-h2\">2. Backup and Recovery Instructions<a class=\"anchor-link\" href=\"#2-backup-and-recovery-instructions\" title=\"Direct Link\">#</a></h2>\n<div class=\"doc-alert doc-alert-caution\"><div class=\"alert-title\">CAUTION</div><div class=\"alert-body\"><strong>Write Down Your Backup Words on Paper</strong>\nTRUSWAP is non-custodial. There is no customer support, no password reset, and no central database. If your device breaks and you do not have your backup words, your funds cannot be recovered.</div></div>\n<h3 id=\"how-to-back-up\" class=\"doc-heading doc-h3\">How to Back Up:<a class=\"anchor-link\" href=\"#how-to-back-up\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Open TRUSWAP at <code>http://127.0.0.1:8899</code>.</li>\n<li>On the <strong>TRU Vault Card</strong> at the top of the dashboard, click <strong>Export</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>The modal reveals your <strong>24-word BIP-39 mnemonic phrase</strong> and your <strong>WIF Private Key</strong>.</li>\n<li>Write them down in order on paper.</li>\n</ul>\n<ol class=\"doc-list\">\n<li>On the <strong>Base Vault Card</strong>, click <strong>Export</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Click the <strong>\ud83d\udc41 Show</strong> buttons to reveal your <strong>12-word Base mnemonic phrase</strong> and EVM private key.</li>\n<li>Write down the 12 words on paper.</li>\n</ul>\n<ol class=\"doc-list\">\n<li>Store your paper backup in a secure, fireproof, and dry location.</li>\n</ol>\n<h3 id=\"how-to-restore-your-wallet\" class=\"doc-heading doc-h3\">How to Restore Your Wallet:<a class=\"anchor-link\" href=\"#how-to-restore-your-wallet\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>File Transfer Method (Fastest)</strong>:</li>\n</ul>\n<p class=\"doc-para\">Copy both <code>vault.dat</code> and <code>.vault.key</code> from your old machine&#x27;s <code>data/</code> folder into the <code>data/</code> folder on your new machine. When TRUSWAP starts, it will automatically decrypt and load your existing keys and active swap states.</p>\n<ul class=\"doc-list\">\n<li><strong>Key Derivation from Seed</strong>:</li>\n</ul>\n<p class=\"doc-para\">You can also restore your accounts in any BIP-39 compatible wallet:</p>\n<ul class=\"doc-list\">\n<li>Base account: Import the 12 words into any EVM wallet (derivation path <code>m/44&#x27;/60&#x27;/0&#x27;/0/0</code>).</li>\n<li>TRU account: Import the WIF private key into any TRU-compatible node or wallet.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"3-cryptographic-specifications-for-developers\" class=\"doc-heading doc-h2\">3. Cryptographic Specifications (For Developers)<a class=\"anchor-link\" href=\"#3-cryptographic-specifications-for-developers\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"3-1-tru-key-derivation\" class=\"doc-heading doc-h3\">3.1 TRU Key Derivation<a class=\"anchor-link\" href=\"#3-1-tru-key-derivation\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Entropy</strong>: 256 bits (32 bytes) generated via the operating system&#x27;s Cryptographically Secure Pseudorandom Number Generator (CSPRNG via <code>rand::rngs::OsRng</code>).</li>\n<li><strong>Curve</strong>: SECP256k1 elliptic curve.</li>\n<li><strong>WIF Encoding</strong>:</li>\n<li>Byte <code>0x80</code> prepended to private key.</li>\n<li>Byte <code>0x01</code> appended to indicate compressed public key.</li>\n<li>4-byte double-SHA256 checksum appended.</li>\n<li>Encoded with Base58.</li>\n<li><strong>24-Word BIP-39</strong>: Derived via <code>bip39::Mnemonic::from_entropy(priv_key)</code>.</li>\n<li><strong>Public Key</strong>: 33-byte compressed coordinate point (prefixed with <code>0x02</code> for even Y or <code>0x03</code> for odd Y).</li>\n<li><strong>Address</strong>:</li>\n</ul>\n<p class=\"doc-para\">$$\\text{PKH} = \\text{RIPEMD-160}(\\text{SHA-256}(\\text{CompressedPubKey}))$$</p>\n<p class=\"doc-para\">Version byte <code>0x41</code> (decimal 65, producing character <code>T</code>) is prepended, followed by a 4-byte double-SHA256 checksum, then Base58Check encoded.</p>\n<h3 id=\"3-2-base-evm-key-derivation\" class=\"doc-heading doc-h3\">3.2 Base EVM Key Derivation<a class=\"anchor-link\" href=\"#3-2-base-evm-key-derivation\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Mnemonic</strong>: 128-bit entropy mapped to 12 words via standard BIP-39.</li>\n<li><strong>Derivation Path</strong>: <code>m/44&#x27;/60&#x27;/0&#x27;/0/0</code> via BIP-32 and BIP-44 standards.</li>\n<li><strong>Public Key</strong>: 64-byte uncompressed coordinate point (excluding leading <code>0x04</code> prefix).</li>\n<li><strong>Address</strong>:</li>\n<li>Hash uncompressed point with <code>Keccak-256</code>.</li>\n<li>Extract the final 20 bytes (160 bits).</li>\n<li>Format as an EIP-55 mixed-case checksum string prefixed with <code>0x</code>.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"4-storage-encryption-at-rest-vault-dat\" class=\"doc-heading doc-h2\">4. Storage Encryption at Rest (<code>vault.dat</code>)<a class=\"anchor-link\" href=\"#4-storage-encryption-at-rest-vault-dat\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">All keys and swap states are written to disk in a single compressed, authenticated binary file (<code>vault.dat</code>).</p>\n<h3 id=\"binary-file-structure\" class=\"doc-heading doc-h3\">Binary File Structure:<a class=\"anchor-link\" href=\"#binary-file-structure\" title=\"Direct Link\">#</a></h3>\n<div class=\"table-responsive\"><table class=\"doc-table\">\n<thead><tr>\n<th>Byte Offset</th>\n<th>Field Name</th>\n<th>Data Type</th>\n<th>Description</th>\n</tr></thead>\n<tbody>\n<tr>\n<td><code>0..8</code></td>\n<td>Magic Identifier</td>\n<td><code>[u8; 8]</code></td>\n<td>ASCII string <code>TRUSWAP\\x04</code> (Version 4 format)</td>\n</tr>\n<tr>\n<td><code>8..24</code></td>\n<td>Salt</td>\n<td><code>[u8; 16]</code></td>\n<td>Cryptographic salt generated per file write</td>\n</tr>\n<tr>\n<td><code>24..N-32</code></td>\n<td>Ciphertext</td>\n<td><code>Vec&lt;u8&gt;</code></td>\n<td>Deflate-compressed, XOR-encrypted binary payload</td>\n</tr>\n<tr>\n<td><code>N-32..N</code></td>\n<td>HMAC Tag</td>\n<td><code>[u8; 32]</code></td>\n<td>HMAC-SHA256 integrity tag over `(Salt \\</td>\n<td>\\</td>\n<td>Ciphertext)`</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"encryption-pipeline\" class=\"doc-heading doc-h3\">Encryption Pipeline:<a class=\"anchor-link\" href=\"#encryption-pipeline\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li><strong>Serialization &amp; Compression</strong>:</li>\n</ol>\n<p class=\"doc-para\">The <code>VaultWalletData</code> struct (containing keys, mnemonics, and active swap states) is serialized and compressed using <code>flate2::write::DeflateEncoder</code>. Compression reduces file size and removes repeating plaintext patterns.</p>\n<ol class=\"doc-list\">\n<li><strong>Counter-Mode Keystream (XOR)</strong>:</li>\n</ol>\n<p class=\"doc-para\">A deterministic keystream is generated using SHA-256:</p>\n<p class=\"doc-para\">$$\\text{Block}_i = \\text{SHA-256}(\\text{MasterKey} \\parallel \\text{Salt} \\parallel \\text{Counter}_{\\text{LE32}})$$</p>\n<p class=\"doc-para\">Each 32-byte chunk of compressed payload is XORed with its corresponding keystream block.</p>\n<ol class=\"doc-list\">\n<li><strong>HMAC-SHA256 Authentication</strong>:</li>\n</ol>\n<p class=\"doc-para\">A 32-byte HMAC-SHA256 signature is calculated across <code>(Salt || Ciphertext)</code> using the master key. When loading, the HMAC is verified first. If a single byte has been modified or corrupted, loading fails immediately before decryption.</p>\n<ol class=\"doc-list\">\n<li><strong>POSIX File Permissions (<code>0o600</code>)</strong>:</li>\n</ol>\n<p class=\"doc-para\">On Linux and macOS, both <code>vault.dat</code> and <code>.vault.key</code> are created with strict <code>0o600</code> permissions (read/write only by the process owner). Other user accounts on the machine cannot open or read the files.</p>\n<ol class=\"doc-list\">\n<li><strong>Atomic Write Replacement</strong>:</li>\n</ol>\n<p class=\"doc-para\">To prevent corrupt files during power outages, new data is written to a temporary file (<code>vault.dat.tmp</code>), flushed to disk with <code>sync_all()</code>, and atomically renamed to <code>vault.dat</code>.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"5-in-memory-security\" class=\"doc-heading doc-h2\">5. In-Memory Security<a class=\"anchor-link\" href=\"#5-in-memory-security\" title=\"Direct Link\">#</a></h2>\n<ul class=\"doc-list\">\n<li><strong>Short-Lived Keys</strong>: Private keys are held in memory only for the duration of transaction signing and dropped immediately after use.</li>\n<li><strong>Log Sanitization</strong>: Private keys, mnemonics, and preimages are never printed to terminal logs, debug files, or error messages.</li>\n<li><strong>Loopback Binding</strong>: The local web dashboard binds strictly to <code>127.0.0.1</code>. Other devices on your local Wi-Fi cannot connect to your wallet interface unless you explicitly run with <code>--dev</code>.</li>\n</ul>", "raw_text": "  Chapter 4: Native Vault & Key Management\n\nThis chapter explains how your private keys are generated, stored, and protected in TRUSWAP, written for both first time users and security auditors.\n\n   \n\n   1. Vault Overview (For Beginners)\n\n    What is the Dual Vault?\nTRUSWAP uses a   Dual Vault   system. Think of it as a wallet with two separate pockets:\n\n1.   The TRU Pocket  : Holds your native Tokenized Real Utility ($TRU) coins on the Proof of Work blockchain. Addresses start with  T .\n2.   The Base Pocket  : Holds your Ethereum Layer 2 assets (ETH for network fees and USDC stablecoins). Addresses start with  0x .\n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" CRYPTOGRAPHY</span \n    <span class=\"diagram heading\" Dual Vault Key Derivation & Account Architecture</span \n  </div \n  <div class=\"diagram grid 2\" \n    <div class=\"diagram node node tru\" \n      <div class=\"node badge\" \ud83d\udfe1 TRU ACCOUNT (POW CHAIN)</div \n      <div class=\"node title\" Native Bitcoin like Script</div \n      <ul class=\"node list\" \n        <li <strong Entropy:</strong  32 Byte SECP256k1 (256 bit)</li \n        <li <strong Backup:</strong  24 Word Mnemonic or WIF private key</li \n        <li <strong Public Key:</strong  33 Byte Compressed Pubkey</li \n        <li <strong Hashing:</strong  HASH160 (SHA256 + RIPEMD160)</li \n        <li <strong Address:</strong  Base58Check (starts with <code T...</code )</li \n      </ul \n    </div \n    <div class=\"diagram node node base\" \n      <div class=\"node badge\" \ud83d\udd35 BASE ACCOUNT (EVM LAYER 2)</div \n      <div class=\"node title\" Ethereum Compatible Account</div \n      <ul class=\"node list\" \n        <li <strong Entropy:</strong  12 Word BIP 39 (128 bit)</li \n        <li <strong Derivation:</strong  Standard path <code m/44'/60'/0'/0/0</code </li \n        <li <strong Backup:</strong  12 Word BIP 39 Mnemonic</li \n        <li <strong Hashing:</strong  Keccak 256 (Last 20 Bytes)</li \n        <li <strong Address:</strong  EIP 55 Checksum Hex (starts with <code 0x...</code )</li \n      </ul \n    </div \n  </div \n</div \n\n    Why are there two different backup phrases?\nA common question is:  \"Why can't I back up everything with just one phrase?\" \n\n    TRU   is a Bitcoin like Proof of Work blockchain. It uses a 256 bit private key. In TRUSWAP, this is represented as a   24 word BIP 39 mnemonic phrase   or a   WIF key   (a string of letters and numbers starting with  K  or  L ).\n    Base   is an EVM network compatible with Ethereum. It uses standard   12 word BIP 39 mnemonic phrases   following the industry standard BIP 44 path ( m/44'/60'/0'/0/0 ).\n\nBy keeping them independent:\n  You can import an existing Ethereum wallet (like MetaMask or Rabby) directly into Base by entering your 12 words.\n  Your TRU keys remain isolated from your EVM keys, ensuring an issue on one network cannot compromise the other.\n\n    What are  vault.dat  and  .vault.key ?\nWhen you run TRUSWAP, two files are created in your data directory:\n   vault.dat : An encrypted file containing your private keys and records of active swaps.\n   .vault.key : A 32 byte cryptographic secret key that unlocks  vault.dat .\n\nThink of  vault.dat  as a locked physical safe, and  .vault.key  as the physical key that opens it. If an attacker copies your  vault.dat  file, they cannot decrypt it or read your private keys without  .vault.key .\n\n   \n\n   2. Backup and Recovery Instructions\n\n  [!CAUTION]\n    Write Down Your Backup Words on Paper  \n  TRUSWAP is non custodial. There is no customer support, no password reset, and no central database. If your device breaks and you do not have your backup words, your funds cannot be recovered.\n\n    How to Back Up:\n1. Open TRUSWAP at  http://127.0.0.1:8899 .\n2. On the   TRU Vault Card   at the top of the dashboard, click   Export  :\n     The modal reveals your   24 word BIP 39 mnemonic phrase   and your   WIF Private Key  .\n     Write them down in order on paper.\n3. On the   Base Vault Card  , click   Export  :\n     Click the   \ud83d\udc41 Show   buttons to reveal your   12 word Base mnemonic phrase   and EVM private key.\n     Write down the 12 words on paper.\n4. Store your paper backup in a secure, fireproof, and dry location.\n\n    How to Restore Your Wallet:\n    File Transfer Method (Fastest)  :\n  Copy both  vault.dat  and  .vault.key  from your old machine's  data/  folder into the  data/  folder on your new machine. When TRUSWAP starts, it will automatically decrypt and load your existing keys and active swap states.\n    Key Derivation from Seed  :\n  You can also restore your accounts in any BIP 39 compatible wallet:\n    Base account: Import the 12 words into any EVM wallet (derivation path  m/44'/60'/0'/0/0 ).\n    TRU account: Import the WIF private key into any TRU compatible node or wallet.\n\n   \n\n   3. Cryptographic Specifications (For Developers)\n\n    3.1 TRU Key Derivation\n    Entropy  : 256 bits (32 bytes) generated via the operating system's Cryptographically Secure Pseudorandom Number Generator (CSPRNG via  rand::rngs::OsRng ).\n    Curve  : SECP256k1 elliptic curve.\n    WIF Encoding  :\n    Byte  0x80  prepended to private key.\n    Byte  0x01  appended to indicate compressed public key.\n    4 byte double SHA256 checksum appended.\n    Encoded with Base58.\n    24 Word BIP 39  : Derived via  bip39::Mnemonic::from entropy(priv key) .\n    Public Key  : 33 byte compressed coordinate point (prefixed with  0x02  for even Y or  0x03  for odd Y).\n    Address  :\n  $$\\text{PKH} = \\text{RIPEMD 160}(\\text{SHA 256}(\\text{CompressedPubKey}))$$\n  Version byte  0x41  (decimal 65, producing character  T ) is prepended, followed by a 4 byte double SHA256 checksum, then Base58Check encoded.\n\n    3.2 Base EVM Key Derivation\n    Mnemonic  : 128 bit entropy mapped to 12 words via standard BIP 39.\n    Derivation Path  :  m/44'/60'/0'/0/0  via BIP 32 and BIP 44 standards.\n    Public Key  : 64 byte uncompressed coordinate point (excluding leading  0x04  prefix).\n    Address  :\n    Hash uncompressed point with  Keccak 256 .\n    Extract the final 20 bytes (160 bits).\n    Format as an EIP 55 mixed case checksum string prefixed with  0x .\n\n   \n\n   4. Storage Encryption at Rest ( vault.dat )\n\nAll keys and swap states are written to disk in a single compressed, authenticated binary file ( vault.dat ).\n\n    Binary File Structure:\n\n  Byte Offset   Field Name   Data Type   Description  \n                 \n   0..8    Magic Identifier    [u8; 8]    ASCII string  TRUSWAP\\x04  (Version 4 format)  \n   8..24    Salt    [u8; 16]    Cryptographic salt generated per file write  \n   24..N 32    Ciphertext    Vec<u8     Deflate compressed, XOR encrypted binary payload  \n   N 32..N    HMAC Tag    [u8; 32]    HMAC SHA256 integrity tag over  (Salt \\ \\  Ciphertext)   \n\n    Encryption Pipeline:\n1.   Serialization & Compression  :\n   The  VaultWalletData  struct (containing keys, mnemonics, and active swap states) is serialized and compressed using  flate2::write::DeflateEncoder . Compression reduces file size and removes repeating plaintext patterns.\n2.   Counter Mode Keystream (XOR)  :\n   A deterministic keystream is generated using SHA 256:\n   $$\\text{Block} i = \\text{SHA 256}(\\text{MasterKey} \\parallel \\text{Salt} \\parallel \\text{Counter} {\\text{LE32}})$$\n   Each 32 byte chunk of compressed payload is XORed with its corresponding keystream block.\n3.   HMAC SHA256 Authentication  :\n   A 32 byte HMAC SHA256 signature is calculated across  (Salt    Ciphertext)  using the master key. When loading, the HMAC is verified first. If a single byte has been modified or corrupted, loading fails immediately before decryption.\n4.   POSIX File Permissions ( 0o600 )  :\n   On Linux and macOS, both  vault.dat  and  .vault.key  are created with strict  0o600  permissions (read/write only by the process owner). Other user accounts on the machine cannot open or read the files.\n5.   Atomic Write Replacement  :\n   To prevent corrupt files during power outages, new data is written to a temporary file ( vault.dat.tmp ), flushed to disk with  sync all() , and atomically renamed to  vault.dat .\n\n   \n\n   5. In Memory Security\n\n    Short Lived Keys  : Private keys are held in memory only for the duration of transaction signing and dropped immediately after use.\n    Log Sanitization  : Private keys, mnemonics, and preimages are never printed to terminal logs, debug files, or error messages.\n    Loopback Binding  : The local web dashboard binds strictly to  127.0.0.1 . Other devices on your local Wi Fi cannot connect to your wallet interface unless you explicitly run with    dev .\n"}, {"id": "05_atomic_swap_protocol", "num": "05", "file": "05_atomic_swap_protocol.md", "title": "5. Atomic Swap Protocol", "icon": "\ud83d\udd04", "words": 1853, "read_time": "9 min read", "html": "<h1 id=\"chapter-5-cryptographic-atomic-swap-protocol\" class=\"doc-heading doc-h1\">Chapter 5: Cryptographic Atomic Swap Protocol<a class=\"anchor-link\" href=\"#chapter-5-cryptographic-atomic-swap-protocol\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how cross-chain atomic swaps work in TRUSWAP, starting with an intuitive analogy for beginners, followed by exact technical specifications, script opcodes, and smart contract interfaces for developers.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-how-atomic-swaps-work-the-lockbox-analogy\" class=\"doc-heading doc-h2\">1. How Atomic Swaps Work (The Lockbox Analogy)<a class=\"anchor-link\" href=\"#1-how-atomic-swaps-work-the-lockbox-analogy\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"what-does-atomic-mean\" class=\"doc-heading doc-h3\">What does &quot;Atomic&quot; mean?<a class=\"anchor-link\" href=\"#what-does-atomic-mean\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">In computer science, an operation is <strong>atomic</strong> if it is &quot;all or nothing.&quot; Either the entire trade succeeds for both participants, or it fails and both participants keep their original funds. There is no intermediate state where one person gets the money and the other is left empty-handed.</p>\n<h3 id=\"the-two-lockboxes-with-one-key\" class=\"doc-heading doc-h3\">The Two Lockboxes with One Key:<a class=\"anchor-link\" href=\"#the-two-lockboxes-with-one-key\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Imagine Alice wants to trade 100 TRU for 50 USDC with Bob:</p>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">HTLC PROTOCOL</span>\n    <span class=\"diagram-heading\">The Two Lockboxes with One Key</span>\n  </div>\n  <div class=\"diagram-grid-2\">\n    <div class=\"diagram-node node-tru\">\n      <div class=\"node-badge\">\ud83d\udfe1 TRU LOCKBOX (TRU NETWORK)</div>\n      <div class=\"lockbox-content-badge\">Contains: 100 TRU (Deposited by Alice)</div>\n      <div class=\"lockbox-rules-title\">Unlocks if:</div>\n      <ul class=\"node-list\">\n        <li><strong>Bob</strong> provides the SECRET PREIMAGE, OR</li>\n        <li><strong>48 hours</strong> pass (Alice claims full refund)</li>\n      </ul>\n    </div>\n    <div class=\"diagram-node node-base\">\n      <div class=\"node-badge\">\ud83d\udd35 BASE LOCKBOX (BASE NETWORK)</div>\n      <div class=\"lockbox-content-badge\">Contains: 50 USDC (Deposited by Bob)</div>\n      <div class=\"lockbox-rules-title\">Unlocks if:</div>\n      <ul class=\"node-list\">\n        <li><strong>Alice</strong> provides the SECRET PREIMAGE, OR</li>\n        <li><strong>24 hours</strong> pass (Bob claims full refund)</li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"diagram-connector\">\n    <div class=\"connector-line\"></div>\n    <div class=\"connector-arrow\">\u25b2 &nbsp; Coupled by a Single Secret Preimage &nbsp; \u25b2</div>\n  </div>\n  <div class=\"diagram-node node-app text-center\">\n    <div class=\"node-badge\">\ud83d\udd11 THE SAME SECRET KEY (PREIMAGE)</div>\n    <div class=\"node-desc\">Generated and held securely by Alice. Revealed publicly on Base when claiming USDC, automatically allowing Bob to claim TRU.</div>\n  </div>\n</div>\n<ol class=\"doc-list\">\n<li><strong>Creating the Lock</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Alice generates a secret password (called a <strong>preimage</strong>).</li>\n<li>She hashes this password using a one-way mathematical function to create a digital lock (called <strong>HASH160</strong>). Anyone can see the lock, but nobody can guess the password.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Locking Assets</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Alice locks 100 TRU into a smart script on the TRU network.</li>\n<li>Bob locks 50 USDC into a smart contract on the Base network using the <strong>exact same digital lock</strong>.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>The Swap</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Alice unlocks Bob&#x27;s USDC on Base by providing her secret password.</li>\n<li>The moment she does this, the password is permanently recorded on the public Base blockchain.</li>\n<li>Bob&#x27;s TRUSWAP client sees the password on the Base blockchain, copies it, and submits it to unlock Alice&#x27;s 100 TRU on the TRU network.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Safety Timers (Refunds)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>What if Bob never deposits his USDC? Alice waits for her timer to expire and takes her 100 TRU back.</li>\n<li>What if Alice disappears after Bob deposits? Bob waits for his timer to expire and takes his 50 USDC back.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-cryptographic-fundamentals-hash160\" class=\"doc-heading doc-h2\">2. Cryptographic Fundamentals (HASH160)<a class=\"anchor-link\" href=\"#2-cryptographic-fundamentals-hash160\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The digital lock is created using <strong>HASH160</strong>:</p>\n<p class=\"doc-para\">$$\\text{HASH160}(S) = \\text{RIPEMD-160}(\\text{SHA-256}(S))$$</p>\n<p class=\"doc-para\">Where:</p>\n<ul class=\"doc-list\">\n<li>$S$ is a 32-byte secret preimage generated from a cryptographically secure random number generator (CSPRNG).</li>\n<li>$\\text{HASH160}(S)$ produces a 20-byte digest.</li>\n</ul>\n<p class=\"doc-para\"><strong>Why HASH160 instead of SHA-256?</strong></p>\n<ol class=\"doc-list\">\n<li>Standard SHA-256 digests are 32 bytes. HASH160 is 20 bytes.</li>\n<li>The 12-byte reduction saves space in TRU transaction outputs and reduces calldata gas costs on the Base network, while maintaining equivalent collision resistance against known attacks.</li>\n</ol>\n<hr class=\"doc-divider\">\n<h2 id=\"3-canonical-103-byte-tru-htlc-script\" class=\"doc-heading doc-h2\">3. Canonical 103-Byte TRU HTLC Script<a class=\"anchor-link\" href=\"#3-canonical-103-byte-tru-htlc-script\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">On the TRU Proof-of-Work blockchain, the swap is locked in a Pay-to-Script-Hash (P2SH) script implemented in <a href=\"file:///home/user/git_test/projects/tru/repos/truswap/src/core/script.rs#L23-L52\" target=\"_blank\" rel=\"noopener\"><code>src/core/script.rs</code></a>:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">TEXT</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-text\">OP_IF\n    OP_HASH160 &lt;20-byte hash160&gt; OP_EQUALVERIFY\n    &lt;33-byte claim_pubkey&gt; OP_CHECKSIG\nOP_ELSE\n    &lt;4-byte timelock&gt; OP_CHECKLOCKTIMEVERIFY OP_DROP\n    &lt;33-byte refund_pubkey&gt; OP_CHECKSIG\nOP_ENDIF</code></pre></div>\n<h3 id=\"exact-byte-layout-103-bytes-total\" class=\"doc-heading doc-h3\">Exact Byte Layout (103 Bytes Total):<a class=\"anchor-link\" href=\"#exact-byte-layout-103-bytes-total\" title=\"Direct Link\">#</a></h3>\n<div class=\"table-responsive\"><table class=\"doc-table\">\n<thead><tr>\n<th>Opcode / Field</th>\n<th>Hex Byte</th>\n<th>Size</th>\n<th>Function</th>\n</tr></thead>\n<tbody>\n<tr>\n<td><code>OP_IF</code></td>\n<td><code>0x63</code></td>\n<td>1 byte</td>\n<td>Begin conditional branch</td>\n</tr>\n<tr>\n<td><code>OP_HASH160</code></td>\n<td><code>0xa9</code></td>\n<td>1 byte</td>\n<td>Hash the input with SHA-256 followed by RIPEMD-160</td>\n</tr>\n<tr>\n<td><code>PUSH_20</code></td>\n<td><code>0x14</code></td>\n<td>1 byte</td>\n<td>Push 20 bytes of hash digest to the stack</td>\n</tr>\n<tr>\n<td><code>&lt;hash160&gt;</code></td>\n<td><code>20 bytes</code></td>\n<td>20 bytes</td>\n<td>Target HASH160 digest</td>\n</tr>\n<tr>\n<td><code>OP_EQUALVERIFY</code></td>\n<td><code>0x88</code></td>\n<td>1 byte</td>\n<td>Verify input hash matches target, abort if unequal</td>\n</tr>\n<tr>\n<td><code>PUSH_33</code></td>\n<td><code>0x21</code></td>\n<td>1 byte</td>\n<td>Push 33 bytes of claim public key</td>\n</tr>\n<tr>\n<td><code>&lt;claim_pubkey&gt;</code></td>\n<td><code>33 bytes</code></td>\n<td>33 bytes</td>\n<td>Recipient&#x27;s SECP256k1 compressed public key</td>\n</tr>\n<tr>\n<td><code>OP_CHECKSIG</code></td>\n<td><code>0xac</code></td>\n<td>1 byte</td>\n<td>Verify recipient&#x27;s ECDSA signature</td>\n</tr>\n<tr>\n<td><code>OP_ELSE</code></td>\n<td><code>0x67</code></td>\n<td>1 byte</td>\n<td>Begin alternate refund branch</td>\n</tr>\n<tr>\n<td><code>PUSH_4</code></td>\n<td><code>0x04</code></td>\n<td>1 byte</td>\n<td>Push 4-byte little-endian Unix timelock</td>\n</tr>\n<tr>\n<td><code>&lt;timelock&gt;</code></td>\n<td><code>4 bytes</code></td>\n<td>4 bytes</td>\n<td>Unix timestamp after which refund is valid</td>\n</tr>\n<tr>\n<td><code>OP_CHECKLOCKTIMEVERIFY</code></td>\n<td><code>0xb1</code></td>\n<td>1 byte</td>\n<td>Verify transaction <code>nLockTime &gt;= timelock</code></td>\n</tr>\n<tr>\n<td><code>OP_DROP</code></td>\n<td><code>0x75</code></td>\n<td>1 byte</td>\n<td>Discard timelock value from the stack</td>\n</tr>\n<tr>\n<td><code>PUSH_33</code></td>\n<td><code>0x21</code></td>\n<td>1 byte</td>\n<td>Push 33 bytes of refund public key</td>\n</tr>\n<tr>\n<td><code>&lt;refund_pubkey&gt;</code></td>\n<td><code>33 bytes</code></td>\n<td>33 bytes</td>\n<td>Depositor&#x27;s SECP256k1 compressed public key</td>\n</tr>\n<tr>\n<td><code>OP_CHECKSIG</code></td>\n<td><code>0xac</code></td>\n<td>1 byte</td>\n<td>Verify depositor&#x27;s ECDSA signature</td>\n</tr>\n<tr>\n<td><code>OP_ENDIF</code></td>\n<td><code>0x68</code></td>\n<td>1 byte</td>\n<td>End conditional branch</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"spending-paths-witness-stack-scriptsig\" class=\"doc-heading doc-h3\">Spending Paths (Witness Stack / ScriptSig):<a class=\"anchor-link\" href=\"#spending-paths-witness-stack-scriptsig\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>To Claim</strong>: <code>[&lt;claim_signature&gt;, &lt;secret_preimage&gt;, 1, &lt;redeem_script&gt;]</code></li>\n<li><strong>To Refund</strong>: <code>[&lt;refund_signature&gt;, 0, &lt;redeem_script&gt;]</code> (requiring <code>tx.lock_time &gt;= timelock</code>)</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"4-base-layer-2-smart-contract-basehtlc-sol\" class=\"doc-heading doc-h2\">4. Base Layer-2 Smart Contract (<code>BaseHTLC.sol</code>)<a class=\"anchor-link\" href=\"#4-base-layer-2-smart-contract-basehtlc-sol\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">On Base, the swap is governed by the deployed <code>BaseHTLC</code> contract:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">SOLIDITY</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\npragma solidity ^0.8.20;\n\ninterface IBaseHTLC {\n    // Selector: 0xefafa23f\n    function createSwap(\n        address beneficiary,\n        address token,\n        uint256 amount,\n        bytes20 hash160,\n        uint256 timelock,\n        bytes32 salt\n    ) external returns (bytes32 swapId);\n\n    // Selector: 0xf0331024\n    function claimSwap(bytes32 swapId, bytes calldata secret) external;\n\n    // Selector: 0x7249fbb6\n    function refundSwap(bytes32 swapId) external;\n}</code></pre></div>\n<h3 id=\"verification-logic\" class=\"doc-heading doc-h3\">Verification Logic:<a class=\"anchor-link\" href=\"#verification-logic\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li><strong>Claiming</strong>:</li>\n</ol>\n<p class=\"doc-para\">When <code>claimSwap(swapId, secret)</code> is called, the contract verifies:</p>\n<p class=\"doc-para\">$$\\text{ripemd160}(\\text{abi.encodePacked}(\\text{sha256}(secret))) == \\text{hash160}$$</p>\n<p class=\"doc-para\">If the check passes, the contract transfers the tokens to the beneficiary.</p>\n<ol class=\"doc-list\">\n<li><strong>Deterministic Swap ID</strong>:</li>\n</ol>\n<p class=\"doc-para\">$$\\text{swapId} = \\text{keccak256}(\\text{sender}, \\text{beneficiary}, \\text{token}, \\text{amount}, \\text{hash160}, \\text{timelock}, \\text{block.chainid}, \\text{salt})$$</p>\n<ol class=\"doc-list\">\n<li><strong>Public Secret Extraction</strong>:</li>\n</ol>\n<p class=\"doc-para\">When funds are claimed on Base, the contract emits an event:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">SOLIDITY</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-solidity\">   event SwapClaimed(bytes32 indexed swapId, bytes secret, address claimer);</code></pre></div>\n<p class=\"doc-para\">Topic 0: <code>0xd14278a0c2b5ef6c1c6418dba05a4ebd99536912416835fde879006db64b8d06</code></p>\n<p class=\"doc-para\">The counterparty&#x27;s client monitors this event, extracts <code>secret</code>, and uses it to claim the TRU on the Proof-of-Work network.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"5-timelock-asymmetry-t-1-t-2\" class=\"doc-heading doc-h2\">5. Timelock Asymmetry ($T_1 &gt; T_2$)<a class=\"anchor-link\" href=\"#5-timelock-asymmetry-t-1-t-2\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">To prevent a race condition where one party claims their funds while simultaneously refunding their own deposit, the timelocks must have a staggered expiration window:</p>\n<ul class=\"doc-list\">\n<li><strong>Maker Timelock ($T_1$)</strong>: E.g., <strong>48 Hours</strong></li>\n<li><strong>Taker Timelock ($T_2$)</strong>: E.g., <strong>24 Hours</strong></li>\n</ul>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">SECURITY TIMELINE</span>\n    <span class=\"diagram-heading\">Timelock Asymmetry Window (T1 > T2)</span>\n  </div>\n  <div class=\"flow-steps\">\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">0h</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Both Locks Created (Assets Escrowed)</div>\n        <div class=\"flow-step-desc\">Alice escrows 100 TRU (48h lock), Bob escrows 50 USDC (24h lock) with identical hash lock H.</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc 24-Hour Safety Buffer</div>\n    <div class=\"flow-step node-base\">\n      <div class=\"flow-step-num\">24h</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Taker Timelock Expires (T2)</div>\n        <div class=\"flow-step-desc\">If Alice never claimed USDC, Bob can safely refund his USDC. Alice cannot claim after T2.</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Additional 24-Hour Window for Bob to Claim</div>\n    <div class=\"flow-step node-tru\">\n      <div class=\"flow-step-num\">48h</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Maker Timelock Expires (T1)</div>\n        <div class=\"flow-step-desc\">If Bob never claimed TRU after Alice revealed S, Alice can refund her TRU.</div>\n      </div>\n    </div>\n  </div>\n</div>\n<p class=\"doc-para\">Because $T_1$ expires 24 hours after $T_2$, the Maker must claim before $T_2$ expires. The moment the Maker claims, the secret is revealed, giving the Taker a full 24-hour safety window to claim on the other chain before $T_1$ expires.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"6-end-to-end-execution-sequence\" class=\"doc-heading doc-h2\">6. End-to-End Execution Sequence<a class=\"anchor-link\" href=\"#6-end-to-end-execution-sequence\" title=\"Direct Link\">#</a></h2>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">PROTOCOL SEQUENCE</span>\n    <span class=\"diagram-heading\">Step-by-Step Atomic Swap Flow</span>\n  </div>\n  <div class=\"flow-steps\">\n    <div class=\"flow-step node-tru\">\n      <div class=\"flow-step-num\">1</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Alice Generates Secret Preimage (S)</div>\n        <div class=\"flow-step-desc\">Calculates cryptographic lock <code>H = HASH160(S)</code> locally on device. S remains secret.</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Broadcast to TRU PoW Chain</div>\n    <div class=\"flow-step node-tru\">\n      <div class=\"flow-step-num\">2</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Alice Locks TRU in 103-Byte HTLC</div>\n        <div class=\"flow-step-desc\">Locks native TRU coins under hash lock H with 48-hour expiration ($T_1$).</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc 6 Block Confirmations (~15 min)</div>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">3</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Confirmation Guard Verification</div>\n        <div class=\"flow-step-desc\">Both Alice and Bob verify 6 consecutive block confirmations to guarantee zero reorg risk.</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc EVM Transaction on Base L2</div>\n    <div class=\"flow-step node-base\">\n      <div class=\"flow-step-num\">4</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Bob Locks USDC in BaseHTLC</div>\n        <div class=\"flow-step-desc\">Calls <code>createSwap(H, 24h)</code> on Base smart contract escrowing USDC ($T_2$).</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Alice Reveals Secret Preimage</div>\n    <div class=\"flow-step node-base\">\n      <div class=\"flow-step-num\">5</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Alice Claims USDC on Base</div>\n        <div class=\"flow-step-desc\">Calls <code>claimSwap(swapId, S)</code> submitting secret S on-chain. USDC transfers to Alice; S becomes public on Base!</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Bob Reads S from Base Blockchain</div>\n    <div class=\"flow-step node-tru\">\n      <div class=\"flow-step-num\">6</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Bob Claims TRU on PoW Chain</div>\n        <div class=\"flow-step-desc\">Extracts preimage S from Base event logs and unlocks Alice's TRU coins into his wallet. Both sides complete 100%!</div>\n      </div>\n    </div>\n  </div>\n</div>\n<hr class=\"doc-divider\">\n<h2 id=\"7-safety-guards-and-automatic-refunds\" class=\"doc-heading doc-h2\">7. Safety Guards and Automatic Refunds<a class=\"anchor-link\" href=\"#7-safety-guards-and-automatic-refunds\" title=\"Direct Link\">#</a></h2>\n<ol class=\"doc-list\">\n<li><strong>Confirmation Guard (Reorg Protection)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>On the TRU network, the client waits for <strong>6 block confirmations</strong> before Bob locks funds on Base. This ensures an orphaned block or Proof-of-Work reorg cannot reverse the TRU deposit.</li>\n<li>On Base, the client monitors confirmed/finalized RPC receipts.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Automatic Background Refund</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>If the counterparty disconnects, loses internet, or refuses to complete the swap, TRUSWAP&#x27;s background daemon automatically monitors block timestamps.</li>\n<li>As soon as the timelock expires, TRUSWAP signs and broadcasts the refund transaction. Your full deposit returns to your wallet automatically.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"8-what-you-see-in-the-truswap-interface-during-a-swap\" class=\"doc-heading doc-h2\">8. What You See in the TRUSWAP Interface During a Swap<a class=\"anchor-link\" href=\"#8-what-you-see-in-the-truswap-interface-during-a-swap\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The cryptographic protocol translates into intuitive visual steps in the TRUSWAP trading terminal:</p>\n<ol class=\"doc-list\">\n<li><strong>Take Order Modal</strong>:</li>\n</ol>\n<p class=\"doc-para\">When you click <strong>[Swap]</strong> on any open offer in the Orderbook, this modal displays:</p>\n<ul class=\"doc-list\">\n<li><strong>YOU SEND</strong> and <strong>YOU RECEIVE</strong>: The exact amounts of TRU and USDC being traded.</li>\n<li><strong>Maker Beneficiary</strong>: The counterparty&#x27;s receiving address.</li>\n<li><strong>Your Receiving Vault</strong>: Your local address where coins will arrive.</li>\n<li><strong>Cryptographic Hashlock</strong>: The 20-byte HASH160 digest that ties both blockchain contracts together.</li>\n<li><strong>Estimated Rate</strong>: The price per 1 TRU.</li>\n<li>Clicking <strong>Confirm Swap</strong> initiates the atomic protocol.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>The In-Progress Tab (<code>\ud83d\udd04 In-Progress</code>)</strong>:</li>\n</ol>\n<p class=\"doc-para\">Once accepted, the swap moves to the In-Progress tab in the right panel. It shows a live status badge:</p>\n<ul class=\"doc-list\">\n<li><code>\u23f3 Awaiting USDC Deposit</code>: TRU is locked; waiting for the buyer&#x27;s BaseHTLC transaction.</li>\n<li><code>\u23f3 Confirming (X/6 Blocks)</code>: The TRU deposit is waiting for network depth to eliminate reorg risk.</li>\n<li><code>\u26a1 Claiming</code>: Secret preimage revealed; claiming funds on the destination chain.</li>\n<li><code>\u2705 Completed</code>: Trade successfully settled on both chains.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Automation Audit Modal</strong>:</li>\n</ol>\n<p class=\"doc-para\">Clicking on any active swap row opens the <strong>Autonomous Engine Process Audit Modal</strong>. This provides real-time transparency into the background state machine:</p>\n<ul class=\"doc-list\">\n<li>Displays real-time console log telemetry.</li>\n<li>Shows active HASH160 digest and trade directi
