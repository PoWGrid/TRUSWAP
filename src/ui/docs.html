<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The TRUSWAP Book — Comprehensive Guide & Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-sidebar: #0b0f19;
      --bg-card: #111726;
      --bg-card-hover: #161e30;
      --bg-code: #06080d;
      --border-color: rgba(0, 240, 255, 0.18);
      --border-glow: rgba(0, 240, 255, 0.4);
      --accent-cyan: #00f0ff;
      --accent-cyan-rgb: 0, 240, 255;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --sidebar-width: 320px;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      height: 100%;
      overflow: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(11, 15, 25, 0.7);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 240, 255, 0.5);
    }

    /* App Shell */
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Mecha Cyberpunk Header */
    header.book-header {
      height: var(--header-height);
      background: linear-gradient(180deg, #131a29 0%, #0c111c 100%);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      font-size: 1.25rem;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .mobile-menu-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--accent-cyan);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-logo-gem {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      flex-shrink: 0;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      white-space: nowrap;
    }

    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      white-space: nowrap;
      display: inline-block;
    }

    .header-search-wrap {
      flex: 1;
      max-width: 440px;
      margin: 0 24px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: #080c14;
      border: 1px solid rgba(0, 240, 255, 0.22);
      border-radius: 8px;
      padding: 9px 38px 9px 38px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      color: #fff;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .search-results-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0d121f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
      max-height: 380px;
      overflow-y: auto;
      z-index: 200;
    }

    .search-result-item {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .search-result-item:hover {
      background: rgba(0, 240, 255, 0.1);
    }

    .search-result-title {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .search-result-snippet {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .header-nav-link:hover {
      color: #fff;
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .mobile-search-btn {
      display: none;
    }

    .mobile-search-bar {
      display: none;
    }

    .nav-text-short {
      display: none;
    }

    .nav-text-full {
      display: inline;
    }

    /* Sidebar Backdrop & Mobile Drawer */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      z-index: 140;
    }

    .sidebar-backdrop.open {
      display: block;
    }

    .sidebar-footer {
      display: none;
      padding: 16px 12px;
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      background: rgba(6, 8, 14, 0.6);
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-footer-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .sidebar-footer-link:hover {
      color: #fff;
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    /* Main Container */
    .book-body {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Table of Contents */
    aside.book-sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      height: 100%;
      user-select: none;
    }

    .sidebar-section-title {
      padding: 16px 20px 8px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .chapter-list {
      list-style: none;
      padding: 0 10px 30px 10px;
    }

    .chapter-item {
      margin-bottom: 2px;
    }

    .chapter-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 7px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s ease;
      cursor: pointer;
      position: relative;
    }

    .chapter-link:hover {
      color: #fff;
      background: rgba(0, 240, 255, 0.06);
    }

    .chapter-link.active {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.16) 0%, rgba(0, 240, 255, 0.04) 100%);
      border-left: 3px solid var(--accent-cyan);
    }

    .chapter-link-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .chapter-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .chapter-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chapter-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Main Reader Area */
    main.book-content-pane {
      flex: 1;
      overflow-y: auto;
      height: 100%;
      padding: 36px 48px 80px 48px;
      position: relative;
      scroll-behavior: smooth;
    }

    .content-container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Top Breadcrumbs & Meta */
    .chapter-header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .breadcrumbs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .breadcrumbs span.current {
      color: var(--accent-cyan);
    }

    .read-time-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* Typography inside reader */
    .doc-h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      position: relative;
    }

    .doc-h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 40px;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
      border-bottom: 1px solid rgba(0, 240, 255, 0.15);
      padding-bottom: 8px;
      position: relative;
    }

    .doc-h3 {
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-top: 26px;
      margin-bottom: 12px;
      position: relative;
    }

    .anchor-link {
      opacity: 0;
      margin-left: 8px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.85em;
      transition: opacity 0.15s ease;
    }

    .doc-heading:hover .anchor-link {
      opacity: 0.8;
    }

    .doc-para {
      margin-bottom: 16px;
      color: #cbd5e1;
      font-size: 1rem;
    }

    .doc-list {
      margin: 14px 0 20px 24px;
      color: #cbd5e1;
    }

    .doc-list li {
      margin-bottom: 8px;
    }

    .doc-divider {
      border: none;
      border-top: 1px solid rgba(0, 240, 255, 0.16);
      margin: 36px 0;
    }

    /* Code Blocks */
    .code-block-wrapper {
      margin: 22px 0;
      border-radius: 10px;
      background: var(--bg-code);
      border: 1px solid rgba(0, 240, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #0d121c;
      border-bottom: 1px solid rgba(0, 240, 255, 0.12);
    }

    .code-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      color: #fff;
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.15);
    }

    pre {
      padding: 16px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #e2e8f0;
      white-space: pre;
      word-wrap: normal;
    }

    code {
      font-family: 'JetBrains Mono', monospace;
      white-space: inherit;
    }

    p code, li code {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      white-space: normal;
    }

    /* Responsive Cyberpunk Architecture & Flow Diagrams */
    .cyber-diagram-box {
      margin: 24px 0;
      background: linear-gradient(180deg, #0e1526 0%, #080c16 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(0, 240, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .diagram-title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.12);
    }

    .diagram-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.08em;
    }

    .diagram-heading {
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .diagram-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .diagram-node {
      background: #090e1a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 14px 16px;
      transition: border-color 0.2s ease;
    }

    .diagram-node.node-tru {
      border-left: 3px solid var(--accent-gold);
    }

    .diagram-node.node-base {
      border-left: 3px solid #3b82f6;
    }

    .diagram-node.node-app {
      border-left: 3px solid var(--accent-cyan);
      background: linear-gradient(180deg, #0d1526 0%, #080c14 100%);
    }

    .node-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .node-tru .node-badge { color: var(--accent-gold); }
    .node-base .node-badge { color: #60a5fa; }
    .node-app .node-badge { color: var(--accent-cyan); }

    .node-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .node-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .node-list li {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-list li::before {
      content: "•";
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .diagram-connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      color: var(--accent-cyan);
    }

    .connector-line {
      width: 2px;
      height: 16px;
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.4) 0%, rgba(0, 240, 255, 0.8) 100%);
    }

    .connector-arrow {
      font-size: 0.75rem;
      line-height: 1;
      color: var(--accent-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .node-tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .feature-tag {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feature-tag::before {
      content: "▸";
      color: var(--accent-cyan);
    }

    /* Atomic Swap Outcome Cards */
    .outcome-grid {
      display: flex;
      align-items: stretch;
      gap: 16px;
      position: relative;
    }

    .outcome-card {
      flex: 1;
      border-radius: 10px;
      padding: 16px;
      background: #090e1a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .outcome-card.success {
      border-left: 4px solid var(--accent-green);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, #080c14 100%);
    }

    .outcome-card.refund {
      border-left: 4px solid var(--accent-gold);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.08) 0%, #080c14 100%);
    }

    .outcome-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .outcome-icon {
      font-size: 1.1rem;
    }

    .outcome-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }

    .outcome-condition {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .outcome-points {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.84rem;
      color: #cbd5e1;
    }

    .outcome-points li strong {
      color: #fff;
    }

    .outcome-divider-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-dim);
      background: #0d1322;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      align-self: center;
      flex-shrink: 0;
    }

    /* UI Tour Blueprint Card */
    .ui-tour-diagram .ui-mockup-frame {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #05070c;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 12px;
    }

    .ui-mockup-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0c1220;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--accent-cyan);
    }

    .ui-mockup-vaults {
      display: grid;

  <script>
    const CHAPTERS = [{"id": "readme", "num": "00", "file": "README.md", "title": "Overview & Architecture", "icon": "\u26a1", "words": 815, "read_time": "4 min read", "html": "<h1 id=\"the-truswap-book\" class=\"doc-heading doc-h1\">The TRUSWAP Book<a class=\"anchor-link\" href=\"#the-truswap-book\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">A complete guide to <strong>TRUSWAP</strong> \u2014 an application for trading <strong>Tokenized Real Utility ($TRU)</strong> and <strong>Base USD Coin ($USDC)</strong> directly peer-to-peer without centralized exchanges or custodial bridges.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"what-is-truswap\" class=\"doc-heading doc-h2\">What is TRUSWAP?<a class=\"anchor-link\" href=\"#what-is-truswap\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP is an open-source client for desktop and Android written in Rust. It lets you trade native Proof-of-Work cryptocurrency ($TRU) for stablecoins on Ethereum Layer-2 (Base USDC) directly with another user.</p>\n<h3 id=\"key-differences-from-centralized-exchanges\" class=\"doc-heading doc-h3\">Key Differences from Centralized Exchanges:<a class=\"anchor-link\" href=\"#key-differences-from-centralized-exchanges\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>No Account Sign-up</strong>: No email, passwords, KYC identity verification, or deposit approvals.</li>\n<li><strong>You Keep Your Keys</strong>: Your funds never sit in an exchange wallet. Your private keys stay on your local device.</li>\n<li><strong>No Wrapped Tokens</strong>: You trade real native TRU and real Base USDC. No &quot;wTRU&quot;, bridges, or IOUs that can be hacked or frozen.</li>\n<li><strong>Automatic Refund Protection</strong>: If the trade does not finish, both parties get their original coins back automatically when the timer runs out.</li>\n</ul>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">ARCHITECTURE</span>\n    <span class=\"diagram-heading\">HOW TRUSWAP WORKS</span>\n  </div>\n  <div class=\"diagram-grid-2\">\n    <div class=\"diagram-node node-tru\">\n      <div class=\"node-badge\">\ud83d\udfe1 PROOF-OF-WORK</div>\n      <div class=\"node-title\">TRU Network</div>\n      <ul class=\"node-list\">\n        <li>Native Proof-of-Work Coins</li>\n        <li>103-byte HTLC Script Engine</li>\n        <li>Direct P2P SPV Light Client (TCP 21833)</li>\n      </ul>\n    </div>\n    <div class=\"diagram-node node-base\">\n      <div class=\"node-badge\">\ud83d\udd35 ETHEREUM L2</div>\n      <div class=\"node-title\">Base Network</div>\n      <ul class=\"node-list\">\n        <li>Official Circle USDC Stablecoins</li>\n        <li>BaseHTLC Smart Contract</li>\n        <li>Headless EVM Signer & RPC Watcher</li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"diagram-connector\">\n    <div class=\"connector-line\"></div>\n    <div class=\"connector-arrow\">\u25bc</div>\n  </div>\n  <div class=\"diagram-node node-app\">\n    <div class=\"node-badge\">\u26a1 UNIFIED RUNNER</div>\n    <div class=\"node-title\">TRUSWAP APP (Desktop & Android)</div>\n    <div class=\"node-tags-grid\">\n      <div class=\"feature-tag\">Dual-Vault (Keys & UTXO)</div>\n      <div class=\"feature-tag\">Exchange Cockpit & Orderbook</div>\n      <div class=\"feature-tag\">Autonomous Swap Engine</div>\n      <div class=\"feature-tag\">Direct TRU SPV (TCP 21833)</div>\n      <div class=\"feature-tag\">Base EVM Signer & Watcher</div>\n      <div class=\"feature-tag\">P2P Orderbook Relay Mesh</div>\n      <div class=\"feature-tag\">Native NDK Camera QR Scanner</div>\n      <div class=\"feature-tag\">Built-in Explorer & Book Reader</div>\n    </div>\n  </div>\n</div>\n<hr class=\"doc-divider\">\n<h2 id=\"how-an-atomic-swap-works-in-30-seconds\" class=\"doc-heading doc-h2\">How an Atomic Swap Works (In 30 Seconds)<a class=\"anchor-link\" href=\"#how-an-atomic-swap-works-in-30-seconds\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Imagine you want to trade 100 TRU for 50 USDC with someone across the internet:</p>\n<ol class=\"doc-list\">\n<li><strong>Locking Assets</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>You put 100 TRU into a cryptographic digital lockbox on the TRU network.</li>\n<li>The buyer puts 50 USDC into a matching digital lockbox on the Base network.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>The Shared Key</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Both lockboxes are keyed to the exact same cryptographic secret (<code>preimage</code>).</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Claiming</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>To take the 50 USDC on Base, you reveal this secret key to the smart contract.</li>\n<li>The moment you claim your USDC, the secret key is published on the public blockchain.</li>\n<li>The buyer reads that key and immediately uses it to unlock your 100 TRU on the TRU network.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Safety Timer (Refund)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>If the buyer never shows up or you change your mind before locking, the lockbox timers expire and everyone takes their original coins back. Nobody can steal your money.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"book-chapters\" class=\"doc-heading doc-h2\">Book Chapters<a class=\"anchor-link\" href=\"#book-chapters\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">This book is organized so that beginners can learn how to install and use the app, while developers and auditors can inspect the code and cryptographic rules:</p>\n<ol class=\"doc-list\">\n<li><a href=\"#01_introduction\" class=\"internal-link\" onclick=\"loadChapter('01_introduction')\"><strong>Chapter 1: Introduction &amp; Concepts</strong></a></li>\n</ol>\n<p class=\"doc-para\">Why peer-to-peer swaps exist, how they differ from centralized exchanges and bridge hacks, and what TRU and Base are.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#02_quickstart_desktop\" class=\"internal-link\" onclick=\"loadChapter('02_quickstart_desktop')\"><strong>Chapter 2: Desktop Quick Start</strong></a></li>\n</ol>\n<p class=\"doc-para\">How to download or compile TRUSWAP on Linux, macOS, or Windows, start the background service, and open the web dashboard.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#03_quickstart_android\" class=\"internal-link\" onclick=\"loadChapter('03_quickstart_android')\"><strong>Chapter 3: Android Setup</strong></a></li>\n</ol>\n<p class=\"doc-para\">How to install <code>truswap.apk</code> on Android, grant camera permission for QR scanning, and use the mobile interface.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#04_vault_and_security\" class=\"internal-link\" onclick=\"loadChapter('04_vault_and_security')\"><strong>Chapter 4: Vault &amp; Key Management</strong></a></li>\n</ol>\n<p class=\"doc-para\">How your TRU keys (24 words / WIF) and Base keys (12 words / BIP-44) are generated, stored in <code>vault.dat</code>, and encrypted on disk.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#05_atomic_swap_protocol\" class=\"internal-link\" onclick=\"loadChapter('05_atomic_swap_protocol')\"><strong>Chapter 5: Atomic Swap Protocol</strong></a></li>\n</ol>\n<p class=\"doc-para\">The step-by-step swap mechanics, the canonical 103-byte TRU HTLC script, BaseHTLC contract calls, and timer math ($T_1 &gt; T_2$).</p>\n<ol class=\"doc-list\">\n<li><a href=\"#06_tru_blockchain_engine\" class=\"internal-link\" onclick=\"loadChapter('06_tru_blockchain_engine')\"><strong>Chapter 6: TRU Network Engine</strong></a></li>\n</ol>\n<p class=\"doc-para\">How TRUSWAP connects to TRU nodes over TCP port 21833, verifies block Proof-of-Work, caches headers in <code>tru.dat</code>, and tracks unspent coins (UTXOs).</p>\n<ol class=\"doc-list\">\n<li><a href=\"#07_base_layer2_engine\" class=\"internal-link\" onclick=\"loadChapter('07_base_layer2_engine')\"><strong>Chapter 7: Base Layer-2 Engine</strong></a></li>\n</ol>\n<p class=\"doc-para\">How the app connects to Base JSON-RPC, signs transactions with EIP-155 replay protection, approves USDC, and calls the <code>BaseHTLC</code> contract.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#08_p2p_orderbook_mesh\" class=\"internal-link\" onclick=\"loadChapter('08_p2p_orderbook_mesh')\"><strong>Chapter 8: P2P Orderbook Mesh</strong></a></li>\n</ol>\n<p class=\"doc-para\">How buy and sell orders are signed, broadcast across WebSocket relays in real time, and validated against fake spam orders.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#09_mobile_ndk_hardware\" class=\"internal-link\" onclick=\"loadChapter('09_mobile_ndk_hardware')\"><strong>Chapter 9: Android NDK Camera Scanner</strong></a></li>\n</ol>\n<p class=\"doc-para\">How the camera QR scanner runs directly on device hardware using Android C headers without Java overhead or cloud APIs.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#10_security_model_and_threat_analysis\" class=\"internal-link\" onclick=\"loadChapter('10_security_model_and_threat_analysis')\"><strong>Chapter 10: Security &amp; Threat Model</strong></a></li>\n</ol>\n<p class=\"doc-para\">How TRUSWAP protects against blockchain reorganizations, malicious dropouts, timing attacks, and rogue computer processes.</p>\n<ol class=\"doc-list\">\n<li><a href=\"#11_troubleshooting_and_faq\" class=\"internal-link\" onclick=\"loadChapter('11_troubleshooting_and_faq')\"><strong>Chapter 11: Troubleshooting &amp; Settings</strong></a></li>\n</ol>\n<p class=\"doc-para\">Command-line flags, environment variables, gas requirements, and answers to common problems.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"the-three-core-rules\" class=\"doc-heading doc-h2\">The Three Core Rules<a class=\"anchor-link\" href=\"#the-three-core-rules\" title=\"Direct Link\">#</a></h2>\n<ol class=\"doc-list\">\n<li><strong>You Hold Your Keys</strong>: Keys are stored on your machine. No remote server ever sees them.</li>\n<li><strong>Automatic Refunds on Timeout</strong>: If a trade stalls or counterparty vanishes, your deposit returns to you.</li>\n<li><strong>Open and Verifiable</strong>: Every byte of logic is inspectable in the open-source repository and verifiable on public explorers.</li>\n</ol>", "raw_text": "  The TRUSWAP Book\n\nA complete guide to   TRUSWAP   \u2014 an application for trading   Tokenized Real Utility ($TRU)   and   Base USD Coin ($USDC)   directly peer to peer without centralized exchanges or custodial bridges.\n\n   \n\n   What is TRUSWAP?\n\nTRUSWAP is an open source client for desktop and Android written in Rust. It lets you trade native Proof of Work cryptocurrency ($TRU) for stablecoins on Ethereum Layer 2 (Base USDC) directly with another user.\n\n    Key Differences from Centralized Exchanges:\n    No Account Sign up  : No email, passwords, KYC identity verification, or deposit approvals.\n    You Keep Your Keys  : Your funds never sit in an exchange wallet. Your private keys stay on your local device.\n    No Wrapped Tokens  : You trade real native TRU and real Base USDC. No \"wTRU\", bridges, or IOUs that can be hacked or frozen.\n    Automatic Refund Protection  : If the trade does not finish, both parties get their original coins back automatically when the timer runs out.\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" ARCHITECTURE</span \n    <span class=\"diagram heading\" HOW TRUSWAP WORKS</span \n  </div \n  <div class=\"diagram grid 2\" \n    <div class=\"diagram node node tru\" \n      <div class=\"node badge\" \ud83d\udfe1 PROOF OF WORK</div \n      <div class=\"node title\" TRU Network</div \n      <ul class=\"node list\" \n        <li Native Proof of Work Coins</li \n        <li 103 byte HTLC Script Engine</li \n        <li Direct P2P SPV Light Client (TCP 21833)</li \n      </ul \n    </div \n    <div class=\"diagram node node base\" \n      <div class=\"node badge\" \ud83d\udd35 ETHEREUM L2</div \n      <div class=\"node title\" Base Network</div \n      <ul class=\"node list\" \n        <li Official Circle USDC Stablecoins</li \n        <li BaseHTLC Smart Contract</li \n        <li Headless EVM Signer & RPC Watcher</li \n      </ul \n    </div \n  </div \n  <div class=\"diagram connector\" \n    <div class=\"connector line\" </div \n    <div class=\"connector arrow\" \u25bc</div \n  </div \n  <div class=\"diagram node node app\" \n    <div class=\"node badge\" \u26a1 UNIFIED RUNNER</div \n    <div class=\"node title\" TRUSWAP APP (Desktop & Android)</div \n    <div class=\"node tags grid\" \n      <div class=\"feature tag\" Dual Vault (Keys & UTXO)</div \n      <div class=\"feature tag\" Exchange Cockpit & Orderbook</div \n      <div class=\"feature tag\" Autonomous Swap Engine</div \n      <div class=\"feature tag\" Direct TRU SPV (TCP 21833)</div \n      <div class=\"feature tag\" Base EVM Signer & Watcher</div \n      <div class=\"feature tag\" P2P Orderbook Relay Mesh</div \n      <div class=\"feature tag\" Native NDK Camera QR Scanner</div \n      <div class=\"feature tag\" Built in Explorer & Book Reader</div \n    </div \n  </div \n</div \n\n   \n\n   How an Atomic Swap Works (In 30 Seconds)\n\nImagine you want to trade 100 TRU for 50 USDC with someone across the internet:\n\n1.   Locking Assets  :\n     You put 100 TRU into a cryptographic digital lockbox on the TRU network.\n     The buyer puts 50 USDC into a matching digital lockbox on the Base network.\n2.   The Shared Key  :\n     Both lockboxes are keyed to the exact same cryptographic secret ( preimage ).\n3.   Claiming  :\n     To take the 50 USDC on Base, you reveal this secret key to the smart contract.\n     The moment you claim your USDC, the secret key is published on the public blockchain.\n     The buyer reads that key and immediately uses it to unlock your 100 TRU on the TRU network.\n4.   Safety Timer (Refund)  :\n     If the buyer never shows up or you change your mind before locking, the lockbox timers expire and everyone takes their original coins back. Nobody can steal your money.\n\n   \n\n   Book Chapters\n\nThis book is organized so that beginners can learn how to install and use the app, while developers and auditors can inspect the code and cryptographic rules:\n\n1. [  Chapter 1: Introduction & Concepts  ](01 introduction.md)  \n   Why peer to peer swaps exist, how they differ from centralized exchanges and bridge hacks, and what TRU and Base are.\n\n2. [  Chapter 2: Desktop Quick Start  ](02 quickstart desktop.md)  \n   How to download or compile TRUSWAP on Linux, macOS, or Windows, start the background service, and open the web dashboard.\n\n3. [  Chapter 3: Android Setup  ](03 quickstart android.md)  \n   How to install  truswap.apk  on Android, grant camera permission for QR scanning, and use the mobile interface.\n\n4. [  Chapter 4: Vault & Key Management  ](04 vault and security.md)  \n   How your TRU keys (24 words / WIF) and Base keys (12 words / BIP 44) are generated, stored in  vault.dat , and encrypted on disk.\n\n5. [  Chapter 5: Atomic Swap Protocol  ](05 atomic swap protocol.md)  \n   The step by step swap mechanics, the canonical 103 byte TRU HTLC script, BaseHTLC contract calls, and timer math ($T 1   T 2$).\n\n6. [  Chapter 6: TRU Network Engine  ](06 tru blockchain engine.md)  \n   How TRUSWAP connects to TRU nodes over TCP port 21833, verifies block Proof of Work, caches headers in  tru.dat , and tracks unspent coins (UTXOs).\n\n7. [  Chapter 7: Base Layer 2 Engine  ](07 base layer2 engine.md)  \n   How the app connects to Base JSON RPC, signs transactions with EIP 155 replay protection, approves USDC, and calls the  BaseHTLC  contract.\n\n8. [  Chapter 8: P2P Orderbook Mesh  ](08 p2p orderbook mesh.md)  \n   How buy and sell orders are signed, broadcast across WebSocket relays in real time, and validated against fake spam orders.\n\n9. [  Chapter 9: Android NDK Camera Scanner  ](09 mobile ndk hardware.md)  \n   How the camera QR scanner runs directly on device hardware using Android C headers without Java overhead or cloud APIs.\n\n10. [  Chapter 10: Security & Threat Model  ](10 security model and threat analysis.md)  \n    How TRUSWAP protects against blockchain reorganizations, malicious dropouts, timing attacks, and rogue computer processes.\n\n11. [  Chapter 11: Troubleshooting & Settings  ](11 troubleshooting and faq.md)  \n    Command line flags, environment variables, gas requirements, and answers to common problems.\n\n   \n\n   The Three Core Rules\n\n1.   You Hold Your Keys  : Keys are stored on your machine. No remote server ever sees them.\n2.   Automatic Refunds on Timeout  : If a trade stalls or counterparty vanishes, your deposit returns to you.\n3.   Open and Verifiable  : Every byte of logic is inspectable in the open source repository and verifiable on public explorers.\n"}, {"id": "01_introduction", "num": "01", "file": "01_introduction.md", "title": "1. Introduction & Vision", "icon": "\ud83c\udf10", "words": 763, "read_time": "4 min read", "html": "<h1 id=\"chapter-1-introduction-concepts\" class=\"doc-heading doc-h1\">Chapter 1: Introduction &amp; Concepts<a class=\"anchor-link\" href=\"#chapter-1-introduction-concepts\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">TRUSWAP is an application that allows two people to trade cryptocurrency directly with each other across different blockchains. It connects <strong>Tokenized Real Utility ($TRU)</strong>, a Proof-of-Work coin, with <strong>USD Coin ($USDC)</strong> on Base, an Ethereum Layer-2 network.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"the-problem-why-traditional-exchanges-and-bridges-are-risky\" class=\"doc-heading doc-h2\">The Problem: Why Traditional Exchanges and Bridges Are Risky<a class=\"anchor-link\" href=\"#the-problem-why-traditional-exchanges-and-bridges-are-risky\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">When you want to trade between two different blockchains, you usually have three options \u2014 and all three carry significant risks:</p>\n<ol class=\"doc-list\">\n<li><strong>Centralized Exchanges (CEXs)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>You deposit your coins into the exchange&#x27;s wallet.</li>\n<li>While your coins are there, you do not own them \u2014 the exchange does (&quot;not your keys, not your coins&quot;).</li>\n<li>If the exchange goes bankrupt, gets hacked, or freezes withdrawals, your funds can disappear.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Wrapped Tokens (like wBTC or wTRU)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>A custodian locks real coins on one chain and issues &quot;wrapped&quot; IOU tokens on another chain.</li>\n<li>If the custodian is dishonest or their reserve wallet is compromised, the wrapped token loses all its backing and becomes worthless.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Cross-Chain Bridges</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Bridges use multi-signature wallets or smart contracts to move value.</li>\n<li>Over the years, bridge exploits have been responsible for billions of dollars in losses due to smart contract bugs and stolen signing keys.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"the-solution-how-atomic-swaps-work\" class=\"doc-heading doc-h2\">The Solution: How Atomic Swaps Work<a class=\"anchor-link\" href=\"#the-solution-how-atomic-swaps-work\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">In computer science, an <strong>atomic</strong> operation is an all-or-nothing event. It either completes 100%, or it gets cancelled completely. There is never an in-between state.</p>\n<p class=\"doc-para\">An <strong>Atomic Swap</strong> allows you and a counterparty to trade across two separate blockchains without an escrow agent or middleman:</p>\n<ul class=\"doc-list\">\n<li><strong>If everything goes right</strong>: You get the counterparty&#x27;s coins, and they get yours at the exact same moment.</li>\n<li><strong>If anything goes wrong</strong>: Either person disconnects, changes their mind, or tries to cheat \u2014 the built-in timer expires, and both people get their original funds back automatically.</li>\n</ul>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">ATOMIC SETTLEMENT</span>\n    <span class=\"diagram-heading\">All-or-Nothing Swap Outcomes</span>\n  </div>\n  <div class=\"outcome-grid\">\n    <div class=\"outcome-card success\">\n      <div class=\"outcome-header\">\n        <span class=\"outcome-icon\">\u2705</span>\n        <span class=\"outcome-title\">Trade Succeeds</span>\n      </div>\n      <div class=\"outcome-condition\">Secret preimage revealed on Base within time window</div>\n      <ul class=\"outcome-points\">\n        <li><strong>Alice</strong> gets USDC on Base</li>\n        <li><strong>Bob</strong> gets TRU on TRU blockchain</li>\n        <li>Atomic settlement completed without intermediaries</li>\n      </ul>\n    </div>\n    <div class=\"outcome-divider-badge\">OR</div>\n    <div class=\"outcome-card refund\">\n      <div class=\"outcome-header\">\n        <span class=\"outcome-icon\">\u23f1\ufe0f</span>\n        <span class=\"outcome-title\">Trade Cancels</span>\n      </div>\n      <div class=\"outcome-condition\">Counterparty disappears or timer expires</div>\n      <ul class=\"outcome-points\">\n        <li><strong>Alice</strong> claims full refund of her TRU</li>\n        <li><strong>Bob</strong> claims full refund of his USDC</li>\n        <li>Zero funds lost \u2014 guaranteed by cryptography</li>\n      </ul>\n    </div>\n  </div>\n</div>\n<hr class=\"doc-divider\">\n<h2 id=\"the-two-blockchains-truswap-connects\" class=\"doc-heading doc-h2\">The Two Blockchains TRUSWAP Connects<a class=\"anchor-link\" href=\"#the-two-blockchains-truswap-connects\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP bridges two very different blockchain technologies:</p>\n<h3 id=\"1-tokenized-real-utility-tru\" class=\"doc-heading doc-h3\">1. Tokenized Real Utility ($TRU)<a class=\"anchor-link\" href=\"#1-tokenized-real-utility-tru\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Type</strong>: Proof-of-Work (PoW) blockchain, similar to Bitcoin.</li>\n<li><strong>Accounting Model</strong>: UTXO (Unspent Transaction Output) \u2014 coins exist as discrete outputs from previous transactions.</li>\n<li><strong>Scripting Language</strong>: Bitcoin-compatible Forth-like stack scripts. Supports hash checks (<code>OP_HASH160</code>) and time checks (<code>OP_CHECKLOCKTIMEVERIFY</code>).</li>\n<li><strong>P2P Network</strong>: Communicates directly with TRU network nodes over TCP port <code>21833</code>.</li>\n</ul>\n<h3 id=\"2-base-ethereum-layer-2\" class=\"doc-heading doc-h3\">2. Base (Ethereum Layer-2)<a class=\"anchor-link\" href=\"#2-base-ethereum-layer-2\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Type</strong>: Optimistic Rollup that settles transactions on Ethereum Layer-1.</li>\n<li><strong>Accounting Model</strong>: Account balance model with smart contracts (EVM).</li>\n<li><strong>Speed &amp; Cost</strong>: 2-second block times and sub-cent gas fees.</li>\n<li><strong>Stablecoin</strong>: Official Circle USDC (<code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code>), pegged 1:1 to the US Dollar.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"who-uses-truswap\" class=\"doc-heading doc-h2\">Who Uses TRUSWAP?<a class=\"anchor-link\" href=\"#who-uses-truswap\" title=\"Direct Link\">#</a></h2>\n<ol class=\"doc-list\">\n<li><strong>Proof-of-Work Miners</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>You mine TRU using mining pools or independent nodes and receive native block rewards.</li>\n<li>You want to convert mined TRU into stable USD Coin (USDC) on Base without giving your coins to a centralized exchange, paying high withdrawal fees, or undergoing KYC identity checks.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Crypto Traders &amp; Buyers</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>You hold USDC on Base (Coinbase, Uniswap, or MetaMask) and want to purchase native Proof-of-Work TRU.</li>\n<li>You receive real Layer-1 coins directly into your own private keys, rather than an IOU or wrapped synthetic token.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"how-truswap-is-built\" class=\"doc-heading doc-h2\">How TRUSWAP Is Built<a class=\"anchor-link\" href=\"#how-truswap-is-built\" title=\"Direct Link\">#</a></h2>\n<ul class=\"doc-list\">\n<li><strong>Single Self-Contained Binary</strong>: TRUSWAP contains its own TRU SPV light client, Base transaction signer, orderbook communicator, and local web dashboard.</li>\n<li><strong>Dual-Vault Key Management</strong>: Generates and manages both your TRU keys (24-word phrase or WIF) and your Base keys (12-word phrase) locally in an encrypted file (<code>vault.dat</code>).</li>\n<li><strong>No Java on Android</strong>: On Android, TRUSWAP runs as a native Linux binary (<code>aarch64</code>), accessing the camera and network directly through system C libraries for faster startup and lower battery usage.</li>\n<li><strong>Unified Terminal Web Interface</strong>: When launched, it opens a local web dashboard (<code>http://127.0.0.1:8899</code>) with live balance cards, limit order form, real-time spot orderbook, and an integrated blockchain explorer (<code>/explorer</code>).</li>\n<li><strong>Fully Transparent</strong>: You can inspect active swaps, raw transaction scripts, and block headers in the built-in blockchain explorer at any time.</li>\n</ul>", "raw_text": "  Chapter 1: Introduction & Concepts\n\nTRUSWAP is an application that allows two people to trade cryptocurrency directly with each other across different blockchains. It connects   Tokenized Real Utility ($TRU)  , a Proof of Work coin, with   USD Coin ($USDC)   on Base, an Ethereum Layer 2 network.\n\n   \n\n   The Problem: Why Traditional Exchanges and Bridges Are Risky\n\nWhen you want to trade between two different blockchains, you usually have three options \u2014 and all three carry significant risks:\n\n1.   Centralized Exchanges (CEXs)  :\n     You deposit your coins into the exchange's wallet.\n     While your coins are there, you do not own them \u2014 the exchange does (\"not your keys, not your coins\").\n     If the exchange goes bankrupt, gets hacked, or freezes withdrawals, your funds can disappear.\n2.   Wrapped Tokens (like wBTC or wTRU)  :\n     A custodian locks real coins on one chain and issues \"wrapped\" IOU tokens on another chain.\n     If the custodian is dishonest or their reserve wallet is compromised, the wrapped token loses all its backing and becomes worthless.\n3.   Cross Chain Bridges  :\n     Bridges use multi signature wallets or smart contracts to move value.\n     Over the years, bridge exploits have been responsible for billions of dollars in losses due to smart contract bugs and stolen signing keys.\n\n   \n\n   The Solution: How Atomic Swaps Work\n\nIn computer science, an   atomic   operation is an all or nothing event. It either completes 100%, or it gets cancelled completely. There is never an in between state.\n\nAn   Atomic Swap   allows you and a counterparty to trade across two separate blockchains without an escrow agent or middleman:\n\n    If everything goes right  : You get the counterparty's coins, and they get yours at the exact same moment.\n    If anything goes wrong  : Either person disconnects, changes their mind, or tries to cheat \u2014 the built in timer expires, and both people get their original funds back automatically.\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" ATOMIC SETTLEMENT</span \n    <span class=\"diagram heading\" All or Nothing Swap Outcomes</span \n  </div \n\n  <div class=\"outcome grid\" \n    <div class=\"outcome card success\" \n      <div class=\"outcome header\" \n        <span class=\"outcome icon\" \u2705</span \n        <span class=\"outcome title\" Trade Succeeds</span \n      </div \n      <div class=\"outcome condition\" Secret preimage revealed on Base within time window</div \n      <ul class=\"outcome points\" \n        <li <strong Alice</strong  gets USDC on Base</li \n        <li <strong Bob</strong  gets TRU on TRU blockchain</li \n        <li Atomic settlement completed without intermediaries</li \n      </ul \n    </div \n\n    <div class=\"outcome divider badge\" OR</div \n\n    <div class=\"outcome card refund\" \n      <div class=\"outcome header\" \n        <span class=\"outcome icon\" \u23f1\ufe0f</span \n        <span class=\"outcome title\" Trade Cancels</span \n      </div \n      <div class=\"outcome condition\" Counterparty disappears or timer expires</div \n      <ul class=\"outcome points\" \n        <li <strong Alice</strong  claims full refund of her TRU</li \n        <li <strong Bob</strong  claims full refund of his USDC</li \n        <li Zero funds lost \u2014 guaranteed by cryptography</li \n      </ul \n    </div \n  </div \n</div \n\n   \n\n   The Two Blockchains TRUSWAP Connects\n\nTRUSWAP bridges two very different blockchain technologies:\n\n    1. Tokenized Real Utility ($TRU)\n    Type  : Proof of Work (PoW) blockchain, similar to Bitcoin.\n    Accounting Model  : UTXO (Unspent Transaction Output) \u2014 coins exist as discrete outputs from previous transactions.\n    Scripting Language  : Bitcoin compatible Forth like stack scripts. Supports hash checks ( OP HASH160 ) and time checks ( OP CHECKLOCKTIMEVERIFY ).\n    P2P Network  : Communicates directly with TRU network nodes over TCP port  21833 .\n\n    2. Base (Ethereum Layer 2)\n    Type  : Optimistic Rollup that settles transactions on Ethereum Layer 1.\n    Accounting Model  : Account balance model with smart contracts (EVM).\n    Speed & Cost  : 2 second block times and sub cent gas fees.\n    Stablecoin  : Official Circle USDC ( 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 ), pegged 1:1 to the US Dollar.\n\n   \n\n   Who Uses TRUSWAP?\n\n1.   Proof of Work Miners  :\n     You mine TRU using mining pools or independent nodes and receive native block rewards.\n     You want to convert mined TRU into stable USD Coin (USDC) on Base without giving your coins to a centralized exchange, paying high withdrawal fees, or undergoing KYC identity checks.\n2.   Crypto Traders & Buyers  :\n     You hold USDC on Base (Coinbase, Uniswap, or MetaMask) and want to purchase native Proof of Work TRU.\n     You receive real Layer 1 coins directly into your own private keys, rather than an IOU or wrapped synthetic token.\n\n   \n\n   How TRUSWAP Is Built\n\n    Single Self Contained Binary  : TRUSWAP contains its own TRU SPV light client, Base transaction signer, orderbook communicator, and local web dashboard.\n    Dual Vault Key Management  : Generates and manages both your TRU keys (24 word phrase or WIF) and your Base keys (12 word phrase) locally in an encrypted file ( vault.dat ).\n    No Java on Android  : On Android, TRUSWAP runs as a native Linux binary ( aarch64 ), accessing the camera and network directly through system C libraries for faster startup and lower battery usage.\n    Unified Terminal Web Interface  : When launched, it opens a local web dashboard ( http://127.0.0.1:8899 ) with live balance cards, limit order form, real time spot orderbook, and an integrated blockchain explorer ( /explorer ).\n    Fully Transparent  : You can inspect active swaps, raw transaction scripts, and block headers in the built in blockchain explorer at any time.\n"}, {"id": "02_quickstart_desktop", "num": "02", "file": "02_quickstart_desktop.md", "title": "2. Desktop Quick Start", "icon": "\ud83d\udcbb", "words": 1962, "read_time": "10 min read", "html": "<h1 id=\"chapter-2-desktop-quick-start-guide\" class=\"doc-heading doc-h1\">Chapter 2: Desktop Quick Start Guide<a class=\"anchor-link\" href=\"#chapter-2-desktop-quick-start-guide\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This guide walks you through downloading, compiling, launching, and using TRUSWAP on Linux, macOS, or Windows.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-system-requirements\" class=\"doc-heading doc-h2\">1. System Requirements<a class=\"anchor-link\" href=\"#1-system-requirements\" title=\"Direct Link\">#</a></h2>\n<ul class=\"doc-list\">\n<li><strong>Operating System</strong>: Linux (Ubuntu 20.04+, Debian 11+, Arch, Fedora), macOS (Apple Silicon or Intel), or Windows 10/11 (Native <code>truswap.exe</code> or WSL2).</li>\n<li><strong>CPU</strong>: 64-bit <code>x86_64</code> or <code>aarch64</code>.</li>\n<li><strong>Memory</strong>: 512 MB RAM minimum (1 GB recommended).</li>\n<li><strong>Disk Space</strong>: ~100 MB for the binary, local header cache (<code>tru.dat</code>), and encrypted vault (<code>vault.dat</code>).</li>\n<li><strong>Network Access</strong>: Outbound TCP port <code>21833</code> for TRU P2P network and HTTPS port <code>443</code> for Base RPC endpoints.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-installation-compilation\" class=\"doc-heading doc-h2\">2. Installation &amp; Compilation<a class=\"anchor-link\" href=\"#2-installation-compilation\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"option-a-running-a-precompiled-binary\" class=\"doc-heading doc-h3\">Option A: Running a Precompiled Binary<a class=\"anchor-link\" href=\"#option-a-running-a-precompiled-binary\" title=\"Direct Link\">#</a></h3>\n<h4 id=\"on-linux-macos\" class=\"doc-heading doc-h4\">On Linux &amp; macOS:<a class=\"anchor-link\" href=\"#on-linux-macos\" title=\"Direct Link\">#</a></h4>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\"># Make binary executable\nchmod +x truswap\n\n# Run on Base Mainnet (default)\n./truswap\n\n# Or run on Base Sepolia testnet\n./truswap --testnet</code></pre></div>\n<h4 id=\"on-windows-powershell-or-command-prompt\" class=\"doc-heading doc-h4\">On Windows (PowerShell or Command Prompt):<a class=\"anchor-link\" href=\"#on-windows-powershell-or-command-prompt\" title=\"Direct Link\">#</a></h4>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">POWERSHELL</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-powershell\"># Run on Base Mainnet (default)\n.\\truswap.exe\n\n# Or run on Base Sepolia testnet\n.\\truswap.exe --testnet</code></pre></div>\n<hr class=\"doc-divider\">\n<h3 id=\"option-b-building-from-source\" class=\"doc-heading doc-h3\">Option B: Building from Source<a class=\"anchor-link\" href=\"#option-b-building-from-source\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Ensure Rust toolchain is installed (<code>rustc &gt;= 1.75</code>):</p>\n<h4 id=\"1-clone-the-repository\" class=\"doc-heading doc-h4\">1. Clone the repository<a class=\"anchor-link\" href=\"#1-clone-the-repository\" title=\"Direct Link\">#</a></h4>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\">git clone https://github.com/powgrid/truswap.git\ncd truswap</code></pre></div>\n<h4 id=\"2-build-release-binary\" class=\"doc-heading doc-h4\">2. Build release binary<a class=\"anchor-link\" href=\"#2-build-release-binary\" title=\"Direct Link\">#</a></h4>\n<ul class=\"doc-list\">\n<li><strong>On Linux / macOS / Windows WSL2</strong>:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\">  cargo build --release\n  # Executable generated at: ./target/release/truswap</code></pre></div>\n<ul class=\"doc-list\">\n<li><strong>On Windows Native (PowerShell / Command Prompt)</strong>:</li>\n</ul>\n<p class=\"doc-para\">Requires Microsoft C++ Build Tools (Visual Studio 2022 C++ build tools):</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">POWERSHELL</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-powershell\">  cargo build --release\n  # Executable generated at: .\\target\\release\\truswap.exe</code></pre></div>\n<ul class=\"doc-list\">\n<li><strong>Cross-compiling for Windows from Linux</strong>:</li>\n</ul>\n<p class=\"doc-para\">You can cross-compile a native standalone Windows <code>.exe</code> directly from Linux without a Windows machine:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\">  cargo zigbuild --target x86_64-pc-windows-gnu --release\n  # Executable generated at: ./target/x86_64-pc-windows-gnu/release/truswap.exe</code></pre></div>\n<hr class=\"doc-divider\">\n<h2 id=\"3-configuration-environment-variables\" class=\"doc-heading doc-h2\">3. Configuration &amp; Environment Variables<a class=\"anchor-link\" href=\"#3-configuration-environment-variables\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP runs with working defaults out of the box. To customize ports, network seeds, or RPC endpoints, you can place a <code>.env</code> file in the working directory or pass command-line arguments:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">INI</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-ini\"># Network Mode (0 = Mainnet [default], 1 = Testnet)\nTRUSWAP_TESTNET=0\n\n# Local Web Interface Bind Address (default: 127.0.0.1:8899)\n# Use TRUSWAP_DEV=1 to bind to 0.0.0.0:8899 for local network access\nBIND_ADDR=127.0.0.1:8899\n\n# Base RPC Endpoints\nBASE_RPC_URL=https://mainnet.base.org\nBASE_WSS_URL=wss://mainnet.base.org\n\n# Smart Contracts (Base Mainnet Defaults)\nBASE_HTLC_CONTRACT=0x812b611208297eb7A2b153BECA8b2AF47C7614DF\nBASE_USDC_CONTRACT=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\n\n# TRU P2P Seed Nodes (IP:Port)\nTRU_SEEDS=137.184.68.43:21833,193.181.216.10:21833\n\n# Storage Directory\nDATA_DIR=./data</code></pre></div>\n<hr class=\"doc-divider\">\n<h2 id=\"4-starting-the-daemon\" class=\"doc-heading doc-h2\">4. Starting the Daemon<a class=\"anchor-link\" href=\"#4-starting-the-daemon\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Run the executable from your terminal:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\">./target/release/truswap</code></pre></div>\n<p class=\"doc-para\">The daemon initializes the encrypted vault, connects to peer nodes, and launches the local web server:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">TEXT</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-text\">[INFO] TRUSWAP starting up...\n[INFO] Vault initialized at ./data/vault.dat\n[INFO] Connecting to TRU P2P network (21833)...\n[INFO] Connecting to Base RPC (https://mainnet.base.org)...\n[INFO] Web UI listening on http://127.0.0.1:8899</code></pre></div>\n<p class=\"doc-para\">Open your browser and navigate to:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">TEXT</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-text\">http://127.0.0.1:8899</code></pre></div>\n<hr class=\"doc-divider\">\n<h2 id=\"5-user-interface-tour-what-you-see-on-screen\" class=\"doc-heading doc-h2\">5. User Interface Tour (What You See on Screen)<a class=\"anchor-link\" href=\"#5-user-interface-tour-what-you-see-on-screen\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">When you open <code>http://127.0.0.1:8899</code>, TRUSWAP presents a single unified terminal interface organized into distinct operational areas:</p>\n<div class=\"cyber-diagram-box ui-tour-diagram\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">LAYOUT BLUEPRINT</span>\n    <span class=\"diagram-heading\">TRUSWAP Terminal Cockpit Organization</span>\n  </div>\n  <div class=\"ui-mockup-frame\">\n    <div class=\"ui-mockup-top\">\n      <span>TRUSWAP v1.0.0 \u2022 Atomic P2P Market</span>\n      <span>\u25cf Online (3 peers) &nbsp;|&nbsp; \ud83d\udd0d TRU #46,936 &nbsp;|&nbsp; Mempool: 1</span>\n    </div>\n    <div class=\"ui-mockup-vaults\">\n      <div class=\"mockup-card tru-card\">\n        <div class=\"card-title\">\ud83d\udfe1 TRU VAULT</div>\n        <div class=\"card-detail\">Balance: <strong>37.59838566 TRU</strong> \u2022 Address: TRJQ...94Gm1</div>\n        <div class=\"card-pills\">\n          <span class=\"pill\">[Export]</span>\n          <span class=\"pill\">[Copy]</span>\n          <span class=\"pill\">[Deposit]</span>\n          <span class=\"pill\">[Withdraw]</span>\n          <span class=\"pill\">\ud83d\udd12 Local Encrypted</span>\n        </div>\n      </div>\n      <div class=\"mockup-card base-card\">\n        <div class=\"card-title\">\ud83d\udd35 BASE VAULT</div>\n        <div class=\"card-detail\">Balance: <strong>0.00 USDC</strong> \u2022 \u26fd Gas: 0.0098 ETH \u2022 0xfb...cA83</div>\n        <div class=\"card-pills\">\n          <span class=\"pill\">[Export]</span>\n          <span class=\"pill\">[Copy]</span>\n          <span class=\"pill\">[Deposit]</span>\n          <span class=\"pill\">[Withdraw]</span>\n          <span class=\"pill\">Base Explorer \u2197</span>\n        </div>\n      </div>\n    </div>\n    <div class=\"ui-mockup-section\">\n      <div class=\"section-title\">\u26a1 SPOT LIMIT ORDER</div>\n      <div class=\"mockup-form-row\">\n        <span>[Buy TRU] [Sell TRU]</span>\n        <span>\u2022 Available: 0.00 USDC</span>\n        <span>\u2022 Price: [1.0000] USDC</span>\n        <span>\u2022 Amount: [0.0000] TRU (25% | 50% | 75% | 100%)</span>\n        <span>\u2022 Button: [Enter Amount & Price]</span>\n      </div>\n    </div>\n    <div class=\"ui-mockup-section\">\n      <div class=\"section-title\">\ud83d\udcca TRU / USDC SPOT (Orderbook)</div>\n      <div class=\"mockup-table-preview\">\n        <div class=\"mockup-row\">\n          <span>PRICE: $1.0000</span>\n          <span>AMOUNT: 29.0000 TRU</span>\n          <span>TOTAL: $29.00 USDC</span>\n          <span class=\"action-btn\">[Swap]</span>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n<h3 id=\"top-navigation-status-bar\" class=\"doc-heading doc-h3\">Top Navigation &amp; Status Bar<a class=\"anchor-link\" href=\"#top-navigation-status-bar\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Network Status Badge</strong>: Shows <code>\u25cf Online</code> with current count of connected TRU P2P daemon peers.</li>\n<li><strong>Blockchain Tip Badge</strong>: Displays current TRU block height (e.g. <code>\ud83d\udd0d TRU #46,936</code>). Clicking this badge opens the built-in <strong>TRU Block Explorer</strong> (<code>/explorer</code>).</li>\n<li><strong>Mempool Counter</strong>: Shows unconfirmed transactions currently in the local mempool. Clicking opens the mempool view in the explorer.</li>\n</ul>\n<h3 id=\"dual-vault-cards\" class=\"doc-heading doc-h3\">Dual Vault Cards<a class=\"anchor-link\" href=\"#dual-vault-cards\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Positioned at the top of the interface for immediate balance awareness:</p>\n<ol class=\"doc-list\">\n<li><strong>TRU Vault Card (Gold)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Displays your confirmed native TRU balance and unconfirmed balance.</li>\n<li>Shows your local TRU receiving address (starts with <code>T</code>).</li>\n<li>Action buttons:</li>\n<li><strong>Export</strong>: Opens the key reveal modal showing your 24-word BIP-39 mnemonic and WIF private key.</li>\n<li><strong>Copy</strong>: Copies your TRU address to clipboard.</li>\n<li><strong>Deposit</strong>: Opens the deposit modal displaying a QR code and address for receiving TRU.</li>\n<li><strong>Withdraw</strong>: Opens the TRU transfer modal to send coins to an external address.</li>\n<li><strong>UTXO Ledger</strong>: Opens the unspent transaction output inspector.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Base Vault Card (Blue)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Displays your available Base USDC balance and native ETH gas balance.</li>\n<li>Shows your local Base EVM address (starts with <code>0x</code>).</li>\n<li>Action buttons:</li>\n<li><strong>Export</strong>: Opens the export modal with reveal buttons for your EVM private key and 12-word seed.</li>\n<li><strong>Copy</strong>: Copies your Base <code>0x</code> address to clipboard.</li>\n<li><strong>Deposit</strong>: Opens the Base deposit modal with QR code and address.</li>\n<li><strong>Withdraw</strong>: Opens the Base withdrawal modal for USDC or ETH.</li>\n<li><strong>Base Explorer \u2197</strong>: Opens your address directly on BaseScan.</li>\n</ul>\n<h3 id=\"exchange-trading-cockpit\" class=\"doc-heading doc-h3\">Exchange Trading Cockpit<a class=\"anchor-link\" href=\"#exchange-trading-cockpit\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Positioned in a clean stacked layout directly below the vault cards:</p>\n<ul class=\"doc-list\">\n<li><strong>Spot Limit Order (Top Card)</strong>:</li>\n<li><strong>Direction Switcher</strong>: Toggle between <strong>Buy TRU</strong> (spending USDC) and <strong>Sell TRU</strong> (spending TRU).</li>\n<li><strong>Available Balance Readout</strong>: Dynamically displays available funds in the corresponding vault.</li>\n<li><strong>3 Responsive Inputs</strong>:</li>\n<li><strong>Price per 1 TRU</strong>: Set your limit price in USDC, with a one-click <strong>Best Price</strong> helper.</li>\n<li><strong>Amount</strong>: Specify quantity of TRU, with an interactive percentage slider (25%, 50%, 75%, 100%) visible when selling.</li>\n<li><strong>Total</strong>: Calculated total in USDC, with an interactive percentage slider visible when buying.</li>\n<li><strong>Action Button</strong>: Displays <code>Enter Amount &amp; Price</code> when inputs are empty, updating dynamically to <code>Buy TRU</code> or <code>Sell TRU</code>.</li>\n<li><strong>TRU / USDC Spot (Bottom Orderbook Terminal)</strong>:</li>\n<li>Sub-navigation filter tabs:</li>\n<li><strong>\ud83d\udcca Book</strong>: Combined overview of open bids and asks.</li>\n<li><strong>\ud83d\udd34 Asks</strong>: Open sell offers from peers (where you can buy TRU immediately).</li>\n<li><strong>\ud83d\udfe2 Bids</strong>: Open buy offers from peers (where you can sell TRU immediately).</li>\n<li><strong>\ud83d\udd04 In-Progress</strong>: Active atomic swaps currently executing, with live status tags and access to the <strong>Automation Audit Modal</strong>.</li>\n<li><strong>\ud83d\udcdc History</strong>: Historical completed trades and on-chain HTLC transactions.</li>\n</ul>\n<h3 id=\"footer\" class=\"doc-heading doc-h3\">Footer<a class=\"anchor-link\" href=\"#footer\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Contains copyright information and the official documentation link: <strong>\ud83d\udcd6 The TRUSWAP Book</strong> (<code>/docs</code>).</p>\n<hr class=\"doc-divider\">\n<h2 id=\"6-setting-up-and-backing-up-your-vault\" class=\"doc-heading doc-h2\">6. Setting Up and Backing Up Your Vault<a class=\"anchor-link\" href=\"#6-setting-up-and-backing-up-your-vault\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">When TRUSWAP starts for the first time, it automatically creates <code>data/vault.dat</code> encrypted with a 256-bit key (<code>data/.vault.key</code>) restricted to <code>0o600</code> permissions.</p>\n<h3 id=\"backing-up-your-recovery-phrases\" class=\"doc-heading doc-h3\">Backing Up Your Recovery Phrases:<a class=\"anchor-link\" href=\"#backing-up-your-recovery-phrases\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>On the <strong>TRU Vault Card</strong>, click the <strong>Export</strong> button.</li>\n</ol>\n<ul class=\"doc-list\">\n<li>The modal displays your <strong>24-word BIP-39 seed phrase</strong> and your <strong>WIF Private Key</strong>.</li>\n<li>Write these down on paper in exact order.</li>\n</ul>\n<ol class=\"doc-list\">\n<li>On the <strong>Base Vault Card</strong>, click the <strong>Export</strong> button.</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Click <strong>\ud83d\udc41 Show</strong> next to the private key and 12-word seed phrase.</li>\n<li>Write down your <strong>12-word Base seed phrase</strong> on paper.</li>\n</ul>\n<ol class=\"doc-list\">\n<li>Keep both paper backups in a safe, offline place.</li>\n</ol>\n<div class=\"doc-alert doc-alert-caution\"><div class=\"alert-title\">CAUTION</div><div class=\"alert-body\">TRUSWAP is strictly non-custodial. If your computer crashes and you do not have these backup phrases, your funds cannot be recovered by anyone.</div></div>\n<hr class=\"doc-divider\">\n<h2 id=\"7-funding-your-vault-deposits-gas\" class=\"doc-heading doc-h2\">7. Funding Your Vault (Deposits &amp; Gas)<a class=\"anchor-link\" href=\"#7-funding-your-vault-deposits-gas\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Before trading, you must deposit funds into your local vault:</p>\n<h3 id=\"1-depositing-tru-to-sell-tru\" class=\"doc-heading doc-h3\">1. Depositing TRU (to Sell TRU):<a class=\"anchor-link\" href=\"#1-depositing-tru-to-sell-tru\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li>Click <strong>Deposit</strong> on the TRU Vault Card.</li>\n<li>Copy your <code>T...</code> address or scan the displayed QR code.</li>\n<li>Send TRU from your mining pool or external wallet. Once the transaction confirms in a block, your balance updates automatically.</li>\n</ul>\n<h3 id=\"2-depositing-base-usdc-eth-to-buy-tru\" class=\"doc-heading doc-h3\">2. Depositing Base USDC &amp; ETH (to Buy TRU):<a class=\"anchor-link\" href=\"#2-depositing-base-usdc-eth-to-buy-tru\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li>Click <strong>Deposit</strong> on the Base Vault Card.</li>\n<li>Copy your <code>0x...</code> address or scan the QR code.</li>\n<li>Send <strong>Circle USDC on the Base network</strong> to this address.</li>\n<li><strong>Essential Gas Requirement</strong>: Send a small amount of <strong>native ETH on Base</strong> ($1.00 to $2.00 worth). Every interaction with the Base blockchain (approving USDC, locking deposits, or claiming funds) requires a fraction of a cent in ETH gas. Without ETH in your Base vault, transactions cannot be signed.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"8-step-by-step-trading-walkthrough\" class=\"doc-heading doc-h2\">8. Step-by-Step Trading Walkthrough<a class=\"anchor-link\" href=\"#8-step-by-step-trading-walkthrough\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"scenario-a-buying-tru-with-usdc-taker\" class=\"doc-heading doc-h3\">Scenario A: Buying TRU with USDC (Taker)<a class=\"anchor-link\" href=\"#scenario-a-buying-tru-with-usdc-taker\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>In the <strong>TRU / USDC Spot</strong> orderbook below, click the <strong>\ud83d\udd34 Asks</strong> tab to view open sell offers.</li>\n<li>Find an offer that suits you and click the <strong>[Swap]</strong> button in that row.</li>\n<li>The <strong>Take Order Modal</strong> appears, showing:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><strong>YOU SEND</strong>: Exact amount of USDC required on Base.</li>\n<li><strong>YOU RECEIVE</strong>: Exact amount of TRU you will receive.</li>\n<li><strong>Maker Beneficiary</strong>: The seller&#x27;s Base address.</li>\n<li><strong>Your Receiving Vault</strong>: Your local TRU address.</li>\n<li><strong>Cryptographic Hashlock</strong>: The 20-byte HASH160 digest securing the swap.</li>\n<li><strong>Estimated Rate</strong>: Exchange rate (e.g., <code>1 TRU = 1.0000 USDC</code>).</li>\n</ul>\n<ol class=\"doc-list\">\n<li>Click <strong>Confirm Swap</strong>.</li>\n<li>TRUSWAP executes the swap automatically:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Approves USDC spending on the <code>BaseHTLC</code> contract if needed.</li>\n<li>Calls <code>createSwap</code> on Base to lock your USDC in escrow.</li>\n<li>Switches the order to the <strong>\ud83d\udd04 In-Progress</strong> tab.</li>\n<li>Monitors the TRU blockchain until the seller locks the TRU and 6 confirmations pass.</li>\n<li>When the seller claims the USDC on Base, TRUSWAP extracts the secret preimage from the on-chain event and automatically claims your TRU on the PoW network.</li>\n</ul>\n<h3 id=\"scenario-b-selling-tru-for-usdc-maker\" class=\"doc-heading doc-h3\">Scenario B: Selling TRU for USDC (Maker)<a class=\"anchor-link\" href=\"#scenario-b-selling-tru-for-usdc-maker\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>In the <strong>Spot Limit Order</strong> card above, ensure the <strong>Sell TRU</strong> tab is selected.</li>\n<li>Enter your desired <strong>Price (USDC)</strong> and the <strong>Amount (TRU)</strong> you want to sell (or drag the percentage slider).</li>\n<li>The button changes from <code>Enter Amount &amp; Price</code> to <strong>Sell TRU</strong>. Click <strong>Sell TRU</strong>.</li>\n<li>TRUSWAP cryptographically signs the order with your local vault key and broadcasts it to the P2P relay mesh. The order appears in the orderbook for other traders.</li>\n<li>When a buyer accepts your order:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>The swap appears under <strong>\ud83d\udd04 In-Progress</strong>.</li>\n<li>TRUSWAP broadcasts a 103-byte HTLC script locking your TRU on-chain.</li>\n<li>Once the buyer deposits their USDC in <code>BaseHTLC</code>, TRUSWAP calls <code>claimSwap</code> on Base using your secret preimage, receiving your USDC.</li>\n<li>Publishing the secret allows the buyer to claim their TRU simultaneously.</li>\n</ul>\n<h3 id=\"the-automation-audit-modal\" class=\"doc-heading doc-h3\">The Automation Audit Modal<a class=\"anchor-link\" href=\"#the-automation-audit-modal\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">At any time during an active swap, you can click on the swap in the <strong>\ud83d\udd04 In-Progress</strong> tab to open the <strong>Automation Audit Modal</strong>. This modal displays real-time telemetry from the autonomous swap engine, including step progress indicators, cryptographic hashlocks, block confirmation counters, and raw on-chain transaction hashes.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"9-withdrawing-funds-to-external-wallets\" class=\"doc-heading doc-h2\">9. Withdrawing Funds to External Wallets<a class=\"anchor-link\" href=\"#9-withdrawing-funds-to-external-wallets\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">When you want to transfer funds out of TRUSWAP to cold storage or an external wallet:</p>\n<h3 id=\"withdrawing-native-tru\" class=\"doc-heading doc-h3\">Withdrawing Native TRU:<a class=\"anchor-link\" href=\"#withdrawing-native-tru\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Click <strong>Withdraw</strong> on the <strong>TRU Vault Card</strong>.</li>\n<li>Enter the destination TRU address (<code>T...</code>), or click the <strong>Camera Icon</strong> to scan a QR code if using a webcam.</li>\n<li>Click <strong>Max</strong> to withdraw your entire available balance, or enter a specific amount.</li>\n<li>The modal shows the exact network mining fee (e.g. <code>0.00000498 TRU</code>) and the net amount you will receive.</li>\n<li>Click <strong>Broadcast Withdrawal</strong>. The transaction is signed locally and sent to the TRU P2P network.</li>\n</ol>\n<h3 id=\"withdrawing-base-assets-usdc-or-eth\" class=\"doc-heading doc-h3\">Withdrawing Base Assets (USDC or ETH):<a class=\"anchor-link\" href=\"#withdrawing-base-assets-usdc-or-eth\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li>Click <strong>Withdraw</strong> on the <strong>Base Vault Card</strong>.</li>\n<li>Select the asset to withdraw: <strong>USDC</strong> or <strong>ETH</strong>.</li>\n<li>Enter the destination Ethereum address (<code>0x...</code>).</li>\n<li>Enter the amount or click <strong>Available: Max</strong>.</li>\n<li>The form calculates the required gas fee. Click <strong>Submit Withdrawal</strong>. The transaction is signed and broadcast via JSON-RPC.</li>\n</ol>", "raw_text": "  Chapter 2: Desktop Quick Start Guide\n\nThis guide walks you through downloading, compiling, launching, and using TRUSWAP on Linux, macOS, or Windows.\n\n   \n\n   1. System Requirements\n\n    Operating System  : Linux (Ubuntu 20.04+, Debian 11+, Arch, Fedora), macOS (Apple Silicon or Intel), or Windows 10/11 (Native  truswap.exe  or WSL2).\n    CPU  : 64 bit  x86 64  or  aarch64 .\n    Memory  : 512 MB RAM minimum (1 GB recommended).\n    Disk Space  : ~100 MB for the binary, local header cache ( tru.dat ), and encrypted vault ( vault.dat ).\n    Network Access  : Outbound TCP port  21833  for TRU P2P network and HTTPS port  443  for Base RPC endpoints.\n\n
