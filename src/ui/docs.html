on.</li>\n<li>Shows live confirmation counters and on-chain transaction hashes.</li>\n<li>Includes <strong>Copy Log</strong> and <strong>Auto-Scroll</strong> controls for auditing.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>The History Tab (<code>\ud83d\udcdc History</code>)</strong>:</li>\n</ol>\n<p class=\"doc-para\">When a swap completes, it is recorded under the History tab. You can click on any TRU transaction ID to inspect the raw inputs, outputs, and HTLC scripts in the <strong>TRU Transaction Details Modal</strong>, or click the Base link to verify settlement on BaseScan.</p>", "raw_text": "  Chapter 5: Cryptographic Atomic Swap Protocol\n\nThis chapter explains how cross chain atomic swaps work in TRUSWAP, starting with an intuitive analogy for beginners, followed by exact technical specifications, script opcodes, and smart contract interfaces for developers.\n\n   \n\n   1. How Atomic Swaps Work (The Lockbox Analogy)\n\n    What does \"Atomic\" mean?\nIn computer science, an operation is   atomic   if it is \"all or nothing.\" Either the entire trade succeeds for both participants, or it fails and both participants keep their original funds. There is no intermediate state where one person gets the money and the other is left empty handed.\n\n    The Two Lockboxes with One Key:\nImagine Alice wants to trade 100 TRU for 50 USDC with Bob:\n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" HTLC PROTOCOL</span \n    <span class=\"diagram heading\" The Two Lockboxes with One Key</span \n  </div \n\n  <div class=\"diagram grid 2\" \n    <div class=\"diagram node node tru\" \n      <div class=\"node badge\" \ud83d\udfe1 TRU LOCKBOX (TRU NETWORK)</div \n      <div class=\"lockbox content badge\" Contains: 100 TRU (Deposited by Alice)</div \n      <div class=\"lockbox rules title\" Unlocks if:</div \n      <ul class=\"node list\" \n        <li <strong Bob</strong  provides the SECRET PREIMAGE, OR</li \n        <li <strong 48 hours</strong  pass (Alice claims full refund)</li \n      </ul \n    </div \n\n    <div class=\"diagram node node base\" \n      <div class=\"node badge\" \ud83d\udd35 BASE LOCKBOX (BASE NETWORK)</div \n      <div class=\"lockbox content badge\" Contains: 50 USDC (Deposited by Bob)</div \n      <div class=\"lockbox rules title\" Unlocks if:</div \n      <ul class=\"node list\" \n        <li <strong Alice</strong  provides the SECRET PREIMAGE, OR</li \n        <li <strong 24 hours</strong  pass (Bob claims full refund)</li \n      </ul \n    </div \n  </div \n\n  <div class=\"diagram connector\" \n    <div class=\"connector line\" </div \n    <div class=\"connector arrow\" \u25b2 &nbsp; Coupled by a Single Secret Preimage &nbsp; \u25b2</div \n  </div \n\n  <div class=\"diagram node node app text center\" \n    <div class=\"node badge\" \ud83d\udd11 THE SAME SECRET KEY (PREIMAGE)</div \n    <div class=\"node desc\" Generated and held securely by Alice. Revealed publicly on Base when claiming USDC, automatically allowing Bob to claim TRU.</div \n  </div \n</div \n\n1.   Creating the Lock  :\n     Alice generates a secret password (called a   preimage  ).\n     She hashes this password using a one way mathematical function to create a digital lock (called   HASH160  ). Anyone can see the lock, but nobody can guess the password.\n2.   Locking Assets  :\n     Alice locks 100 TRU into a smart script on the TRU network.\n     Bob locks 50 USDC into a smart contract on the Base network using the   exact same digital lock  .\n3.   The Swap  :\n     Alice unlocks Bob's USDC on Base by providing her secret password.\n     The moment she does this, the password is permanently recorded on the public Base blockchain.\n     Bob's TRUSWAP client sees the password on the Base blockchain, copies it, and submits it to unlock Alice's 100 TRU on the TRU network.\n4.   Safety Timers (Refunds)  :\n     What if Bob never deposits his USDC? Alice waits for her timer to expire and takes her 100 TRU back.\n     What if Alice disappears after Bob deposits? Bob waits for his timer to expire and takes his 50 USDC back.\n\n   \n\n   2. Cryptographic Fundamentals (HASH160)\n\nThe digital lock is created using   HASH160  :\n$$\\text{HASH160}(S) = \\text{RIPEMD 160}(\\text{SHA 256}(S))$$\n\nWhere:\n  $S$ is a 32 byte secret preimage generated from a cryptographically secure random number generator (CSPRNG).\n  $\\text{HASH160}(S)$ produces a 20 byte digest.\n\n  Why HASH160 instead of SHA 256?  \n1. Standard SHA 256 digests are 32 bytes. HASH160 is 20 bytes.\n2. The 12 byte reduction saves space in TRU transaction outputs and reduces calldata gas costs on the Base network, while maintaining equivalent collision resistance against known attacks.\n\n   \n\n   3. Canonical 103 Byte TRU HTLC Script\n\nOn the TRU Proof of Work blockchain, the swap is locked in a Pay to Script Hash (P2SH) script implemented in [ src/core/script.rs ](file:///home/user/git test/projects/tru/repos/truswap/src/core/script.rs L23 L52):\n\n   text\nOP IF\n    OP HASH160 <20 byte hash160  OP EQUALVERIFY\n    <33 byte claim pubkey  OP CHECKSIG\nOP ELSE\n    <4 byte timelock  OP CHECKLOCKTIMEVERIFY OP DROP\n    <33 byte refund pubkey  OP CHECKSIG\nOP ENDIF\n   \n\n    Exact Byte Layout (103 Bytes Total):\n\n  Opcode / Field   Hex Byte   Size   Function  \n                 \n   OP IF     0x63    1 byte   Begin conditional branch  \n   OP HASH160     0xa9    1 byte   Hash the input with SHA 256 followed by RIPEMD 160  \n   PUSH 20     0x14    1 byte   Push 20 bytes of hash digest to the stack  \n   <hash160      20 bytes    20 bytes   Target HASH160 digest  \n   OP EQUALVERIFY     0x88    1 byte   Verify input hash matches target, abort if unequal  \n   PUSH 33     0x21    1 byte   Push 33 bytes of claim public key  \n   <claim pubkey      33 bytes    33 bytes   Recipient's SECP256k1 compressed public key  \n   OP CHECKSIG     0xac    1 byte   Verify recipient's ECDSA signature  \n   OP ELSE     0x67    1 byte   Begin alternate refund branch  \n   PUSH 4     0x04    1 byte   Push 4 byte little endian Unix timelock  \n   <timelock      4 bytes    4 bytes   Unix timestamp after which refund is valid  \n   OP CHECKLOCKTIMEVERIFY     0xb1    1 byte   Verify transaction  nLockTime  = timelock   \n   OP DROP     0x75    1 byte   Discard timelock value from the stack  \n   PUSH 33     0x21    1 byte   Push 33 bytes of refund public key  \n   <refund pubkey      33 bytes    33 bytes   Depositor's SECP256k1 compressed public key  \n   OP CHECKSIG     0xac    1 byte   Verify depositor's ECDSA signature  \n   OP ENDIF     0x68    1 byte   End conditional branch  \n\n    Spending Paths (Witness Stack / ScriptSig):\n    To Claim  :  [<claim signature , <secret preimage , 1, <redeem script ] \n    To Refund  :  [<refund signature , 0, <redeem script ]  (requiring  tx.lock time  = timelock )\n\n   \n\n   4. Base Layer 2 Smart Contract ( BaseHTLC.sol )\n\nOn Base, the swap is governed by the deployed  BaseHTLC  contract:\n\n   solidity\n// SPDX License Identifier: MIT\npragma solidity ^0.8.20;\n\ninterface IBaseHTLC {\n    // Selector: 0xefafa23f\n    function createSwap(\n        address beneficiary,\n        address token,\n        uint256 amount,\n        bytes20 hash160,\n        uint256 timelock,\n        bytes32 salt\n    ) external returns (bytes32 swapId);\n\n    // Selector: 0xf0331024\n    function claimSwap(bytes32 swapId, bytes calldata secret) external;\n\n    // Selector: 0x7249fbb6\n    function refundSwap(bytes32 swapId) external;\n}\n   \n\n    Verification Logic:\n1.   Claiming  :\n   When  claimSwap(swapId, secret)  is called, the contract verifies:\n   $$\\text{ripemd160}(\\text{abi.encodePacked}(\\text{sha256}(secret))) == \\text{hash160}$$\n   If the check passes, the contract transfers the tokens to the beneficiary.\n2.   Deterministic Swap ID  :\n   $$\\text{swapId} = \\text{keccak256}(\\text{sender}, \\text{beneficiary}, \\text{token}, \\text{amount}, \\text{hash160}, \\text{timelock}, \\text{block.chainid}, \\text{salt})$$\n3.   Public Secret Extraction  :\n   When funds are claimed on Base, the contract emits an event:\n      solidity\n   event SwapClaimed(bytes32 indexed swapId, bytes secret, address claimer);\n      \n   Topic 0:  0xd14278a0c2b5ef6c1c6418dba05a4ebd99536912416835fde879006db64b8d06   \n   The counterparty's client monitors this event, extracts  secret , and uses it to claim the TRU on the Proof of Work network.\n\n   \n\n   5. Timelock Asymmetry ($T 1   T 2$)\n\nTo prevent a race condition where one party claims their funds while simultaneously refunding their own deposit, the timelocks must have a staggered expiration window:\n\n    Maker Timelock ($T 1$)  : E.g.,   48 Hours  \n    Taker Timelock ($T 2$)  : E.g.,   24 Hours  \n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" SECURITY TIMELINE</span \n    <span class=\"diagram heading\" Timelock Asymmetry Window (T1   T2)</span \n  </div \n  <div class=\"flow steps\" \n    <div class=\"flow step\" \n      <div class=\"flow step num\" 0h</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Both Locks Created (Assets Escrowed)</div \n        <div class=\"flow step desc\" Alice escrows 100 TRU (48h lock), Bob escrows 50 USDC (24h lock) with identical hash lock H.</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc 24 Hour Safety Buffer</div \n    <div class=\"flow step node base\" \n      <div class=\"flow step num\" 24h</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Taker Timelock Expires (T2)</div \n        <div class=\"flow step desc\" If Alice never claimed USDC, Bob can safely refund his USDC. Alice cannot claim after T2.</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc Additional 24 Hour Window for Bob to Claim</div \n    <div class=\"flow step node tru\" \n      <div class=\"flow step num\" 48h</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Maker Timelock Expires (T1)</div \n        <div class=\"flow step desc\" If Bob never claimed TRU after Alice revealed S, Alice can refund her TRU.</div \n      </div \n    </div \n  </div \n</div \n\nBecause $T 1$ expires 24 hours after $T 2$, the Maker must claim before $T 2$ expires. The moment the Maker claims, the secret is revealed, giving the Taker a full 24 hour safety window to claim on the other chain before $T 1$ expires.\n\n   \n\n   6. End to End Execution Sequence\n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" PROTOCOL SEQUENCE</span \n    <span class=\"diagram heading\" Step by Step Atomic Swap Flow</span \n  </div \n  <div class=\"flow steps\" \n    <div class=\"flow step node tru\" \n      <div class=\"flow step num\" 1</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Alice Generates Secret Preimage (S)</div \n        <div class=\"flow step desc\" Calculates cryptographic lock <code H = HASH160(S)</code  locally on device. S remains secret.</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc Broadcast to TRU PoW Chain</div \n    <div class=\"flow step node tru\" \n      <div class=\"flow step num\" 2</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Alice Locks TRU in 103 Byte HTLC</div \n        <div class=\"flow step desc\" Locks native TRU coins under hash lock H with 48 hour expiration ($T 1$).</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc 6 Block Confirmations (~15 min)</div \n    <div class=\"flow step\" \n      <div class=\"flow step num\" 3</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Confirmation Guard Verification</div \n        <div class=\"flow step desc\" Both Alice and Bob verify 6 consecutive block confirmations to guarantee zero reorg risk.</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc EVM Transaction on Base L2</div \n    <div class=\"flow step node base\" \n      <div class=\"flow step num\" 4</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Bob Locks USDC in BaseHTLC</div \n        <div class=\"flow step desc\" Calls <code createSwap(H, 24h)</code  on Base smart contract escrowing USDC ($T 2$).</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc Alice Reveals Secret Preimage</div \n    <div class=\"flow step node base\" \n      <div class=\"flow step num\" 5</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Alice Claims USDC on Base</div \n        <div class=\"flow step desc\" Calls <code claimSwap(swapId, S)</code  submitting secret S on chain. USDC transfers to Alice; S becomes public on Base!</div \n      </div \n    </div \n    <div class=\"flow connector\" \u25bc Bob Reads S from Base Blockchain</div \n    <div class=\"flow step node tru\" \n      <div class=\"flow step num\" 6</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Bob Claims TRU on PoW Chain</div \n        <div class=\"flow step desc\" Extracts preimage S from Base event logs and unlocks Alice's TRU coins into his wallet. Both sides complete 100%!</div \n      </div \n    </div \n  </div \n</div \n\n   \n\n   7. Safety Guards and Automatic Refunds\n\n1.   Confirmation Guard (Reorg Protection)  :\n     On the TRU network, the client waits for   6 block confirmations   before Bob locks funds on Base. This ensures an orphaned block or Proof of Work reorg cannot reverse the TRU deposit.\n     On Base, the client monitors confirmed/finalized RPC receipts.\n2.   Automatic Background Refund  :\n     If the counterparty disconnects, loses internet, or refuses to complete the swap, TRUSWAP's background daemon automatically monitors block timestamps.\n     As soon as the timelock expires, TRUSWAP signs and broadcasts the refund transaction. Your full deposit returns to your wallet automatically.\n\n   \n\n   8. What You See in the TRUSWAP Interface During a Swap\n\nThe cryptographic protocol translates into intuitive visual steps in the TRUSWAP trading terminal:\n\n1.   Take Order Modal  :\n   When you click   [Swap]   on any open offer in the Orderbook, this modal displays:\n       YOU SEND   and   YOU RECEIVE  : The exact amounts of TRU and USDC being traded.\n       Maker Beneficiary  : The counterparty's receiving address.\n       Your Receiving Vault  : Your local address where coins will arrive.\n       Cryptographic Hashlock  : The 20 byte HASH160 digest that ties both blockchain contracts together.\n       Estimated Rate  : The price per 1 TRU.\n     Clicking   Confirm Swap   initiates the atomic protocol.\n\n2.   The In Progress Tab ( \ud83d\udd04 In Progress )  :\n   Once accepted, the swap moves to the In Progress tab in the right panel. It shows a live status badge:\n      \u23f3 Awaiting USDC Deposit : TRU is locked; waiting for the buyer's BaseHTLC transaction.\n      \u23f3 Confirming (X/6 Blocks) : The TRU deposit is waiting for network depth to eliminate reorg risk.\n      \u26a1 Claiming : Secret preimage revealed; claiming funds on the destination chain.\n      \u2705 Completed : Trade successfully settled on both chains.\n\n3.   Automation Audit Modal  :\n   Clicking on any active swap row opens the   Autonomous Engine Process Audit Modal  . This provides real time transparency into the background state machine:\n     Displays real time console log telemetry.\n     Shows active HASH160 digest and trade direction.\n     Shows live confirmation counters and on chain transaction hashes.\n     Includes   Copy Log   and   Auto Scroll   controls for auditing.\n\n4.   The History Tab ( \ud83d\udcdc History )  :\n   When a swap completes, it is recorded under the History tab. You can click on any TRU transaction ID to inspect the raw inputs, outputs, and HTLC scripts in the   TRU Transaction Details Modal  , or click the Base link to verify settlement on BaseScan.\n"}, {"id": "06_tru_blockchain_engine", "num": "06", "file": "06_tru_blockchain_engine.md", "title": "6. TRU Blockchain Engine", "icon": "\u26cf\ufe0f", "words": 1249, "read_time": "6 min read", "html": "<h1 id=\"chapter-6-tru-blockchain-engine-spv-synchronization\" class=\"doc-heading doc-h1\">Chapter 6: TRU Blockchain Engine &amp; SPV Synchronization<a class=\"anchor-link\" href=\"#chapter-6-tru-blockchain-engine-spv-synchronization\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how TRUSWAP connects to the Tokenized Real Utility ($TRU) blockchain, synchronizes transactions, and verifies Proof-of-Work without relying on third-party block explorers.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-blockchain-fundamentals-for-beginners\" class=\"doc-heading doc-h2\">1. Blockchain Fundamentals (For Beginners)<a class=\"anchor-link\" href=\"#1-blockchain-fundamentals-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"what-is-a-light-client-spv\" class=\"doc-heading doc-h3\">What is a Light Client (SPV)?<a class=\"anchor-link\" href=\"#what-is-a-light-client-spv\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Traditional blockchain nodes require downloading hundreds of gigabytes of historical data, which can take days and fill up your hard drive.</p>\n<p class=\"doc-para\">TRUSWAP embeds a <strong>Simplified Payment Verification (SPV) client</strong> directly into its core:</p>\n<ul class=\"doc-list\">\n<li><strong>Direct Peer-to-Peer</strong>: Connects directly to TRU network nodes over standard TCP.</li>\n<li><strong>Header-First Verification</strong>: Downloads only block headers and recent blocks, verifying the mathematical Proof-of-Work locally on your device.</li>\n<li><strong>No Third-Party Trust</strong>: It does not ask a centralized server or website what your balance is. It checks the cryptographic proofs directly.</li>\n<li><strong>Fast Startup</strong>: Synchronizes within seconds and stores recent blocks in a compact cache file (<code>tru.dat</code>).</li>\n</ul>\n<h3 id=\"what-is-a-utxo\" class=\"doc-heading doc-h3\">What is a UTXO?<a class=\"anchor-link\" href=\"#what-is-a-utxo\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Unlike traditional bank accounts or Ethereum where your balance is a single number in a ledger, TRU uses the <strong>UTXO (Unspent Transaction Output)</strong> model (the same model used by Bitcoin):</p>\n<ul class=\"doc-list\">\n<li>Think of UTXOs like physical paper bills in your wallet.</li>\n<li>If your total balance is 100 TRU, you might hold two &quot;bills&quot;: one 60 TRU bill and one 40 TRU bill.</li>\n<li>When you spend 25 TRU, TRUSWAP takes the 40 TRU bill, sends 25 TRU to the recipient, and sends 15 TRU back to your wallet as &quot;change&quot; (minus a tiny mining fee).</li>\n<li>TRUSWAP automatically tracks your bills, selects the right inputs, and manages change outputs automatically.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-p2p-network-architecture\" class=\"doc-heading doc-h2\">2. P2P Network Architecture<a class=\"anchor-link\" href=\"#2-p2p-network-architecture\" title=\"Direct Link\">#</a></h2>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">P2P ARCHITECTURE</span>\n    <span class=\"diagram-heading\">TRU SPV Engine & Sync Pipeline</span>\n  </div>\n  <div class=\"flow-steps\">\n    <div class=\"flow-step node-tru\">\n      <div class=\"flow-step-num\">1</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">TRU P2P Network (Distributed Nodes)</div>\n        <div class=\"flow-step-desc\">Peer nodes listening on TCP Port 21833 (Magic: <code>0xEC7C8FB9</code>)</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc TCP Port 21833 (tru-mainnet)</div>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">2</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Native Rust P2P Client</div>\n        <div class=\"flow-step-desc\">44-Byte Binary framing, Protobuf payloads, Version/VerAck handshake, Block/Tx/Inv synchronization</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Raw Headers & Transactions</div>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">3</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Consensus & UTXO Validation</div>\n        <div class=\"flow-step-desc\">SHA256d + 21E8 Target verification, in-memory UTXO tracking, HTLC lock output scanning</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Validated Chain State</div>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">4</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Gzip-Compressed Block Cache (tru.dat)</div>\n        <div class=\"flow-step-desc\">Fast local persistent storage for instant resume across restarts</div>\n      </div>\n    </div>\n  </div>\n</div>\n<hr class=\"doc-divider\">\n<h2 id=\"3-binary-wire-protocol-framing-src-tru-p2p-wire-rs\" class=\"doc-heading doc-h2\">3. Binary Wire Protocol Framing (<code>src/tru_p2p/wire.rs</code>)<a class=\"anchor-link\" href=\"#3-binary-wire-protocol-framing-src-tru-p2p-wire-rs\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Communications with TRU network nodes use a compact 44-byte binary frame header followed by a Protocol Buffers serialized payload:</p>\n<h3 id=\"header-layout-44-bytes-fixed\" class=\"doc-heading doc-h3\">Header Layout (44 Bytes Fixed):<a class=\"anchor-link\" href=\"#header-layout-44-bytes-fixed\" title=\"Direct Link\">#</a></h3>\n<div class=\"table-responsive\"><table class=\"doc-table\">\n<thead><tr>\n<th>Offset</th>\n<th>Field Name</th>\n<th>Data Type</th>\n<th>Value / Description</th>\n</tr></thead>\n<tbody>\n<tr>\n<td><code>0..4</code></td>\n<td><code>magic</code></td>\n<td><code>[u8; 4]</code></td>\n<td>Network magic bytes: <code>0xec, 0x7c, 0x8f, 0xb9</code> (<code>MAINNET_P2P_MAGIC</code>)</td>\n</tr>\n<tr>\n<td><code>4..8</code></td>\n<td><code>type</code></td>\n<td><code>i32</code> (LE)</td>\n<td>Little-endian signed integer identifying message opcode</td>\n</tr>\n<tr>\n<td><code>8..12</code></td>\n<td><code>length</code></td>\n<td><code>u32</code> (LE)</td>\n<td>Little-endian payload size in bytes (up to 64 MB maximum)</td>\n</tr>\n<tr>\n<td><code>12..44</code></td>\n<td><code>checksum</code></td>\n<td><code>[u8; 32]</code></td>\n<td>Full <code>SHA-256</code> hash of the Protobuf payload</td>\n</tr>\n<tr>\n<td><code>44..N</code></td>\n<td><code>payload</code></td>\n<td>Bytes</td>\n<td>Serialized Protocol Buffers message</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"message-types\" class=\"doc-heading doc-h3\">Message Types:<a class=\"anchor-link\" href=\"#message-types\" title=\"Direct Link\">#</a></h3>\n<div class=\"table-responsive\"><table class=\"doc-table\">\n<thead><tr>\n<th>Type ID</th>\n<th>Message Name</th>\n<th>Protobuf Structure</th>\n<th>Purpose</th>\n</tr></thead>\n<tbody>\n<tr>\n<td><code>0</code></td>\n<td><code>Version</code></td>\n<td><code>Version</code></td>\n<td>Handshake greeting: protocol version, services, timestamp, start_height</td>\n</tr>\n<tr>\n<td><code>1</code></td>\n<td><code>VerAck</code></td>\n<td><code>VerAck</code></td>\n<td>Handshake acknowledgment confirming connection parameters</td>\n</tr>\n<tr>\n<td><code>2</code></td>\n<td><code>Addr</code></td>\n<td><code>Addr</code></td>\n<td>Peer exchange sharing IP addresses of active nodes</td>\n</tr>\n<tr>\n<td><code>3</code></td>\n<td><code>Inv</code></td>\n<td><code>Inv</code></td>\n<td>Inventory announcement (hashes of newly mined blocks or transactions)</td>\n</tr>\n<tr>\n<td><code>4</code></td>\n<td><code>GetData</code></td>\n<td><code>GetData</code></td>\n<td>Request to download specific block or transaction data by hash</td>\n</tr>\n<tr>\n<td><code>5</code></td>\n<td><code>Block</code></td>\n<td><code>BlockProto</code></td>\n<td>Serialized block: hash, header, transactions, chain work, height</td>\n</tr>\n<tr>\n<td><code>6</code></td>\n<td><code>Tx</code></td>\n<td><code>TxProto</code></td>\n<td>Raw transaction broadcast (transaction ID + serialized bytes)</td>\n</tr>\n<tr>\n<td><code>7</code></td>\n<td><code>Ping</code></td>\n<td><code>Ping</code></td>\n<td>Liveness check containing a 64-bit random nonce</td>\n</tr>\n<tr>\n<td><code>8</code></td>\n<td><code>Pong</code></td>\n<td><code>Pong</code></td>\n<td>Liveness reply echoing the ping nonce</td>\n</tr>\n<tr>\n<td><code>9</code></td>\n<td><code>Chat</code></td>\n<td><code>ChatMessage</code></td>\n<td>Optional peer communication message</td>\n</tr>\n<tr>\n<td><code>10</code></td>\n<td><code>Height</code></td>\n<td><code>HeightMessage</code></td>\n<td>Announcement of the node&#x27;s current tip height</td>\n</tr>\n<tr>\n<td><code>11</code></td>\n<td><code>GetBlock</code></td>\n<td><code>GetBlockRequest</code></td>\n<td>Request for a specific block by height</td>\n</tr>\n<tr>\n<td><code>12</code></td>\n<td><code>GetHeight</code></td>\n<td><code>GetHeightRequest</code></td>\n<td>Query for the remote peer&#x27;s highest block</td>\n</tr>\n<tr>\n<td><code>13</code></td>\n<td><code>BlockNotFound</code></td>\n<td><code>BlockNotFound</code></td>\n<td>Returned when a requested block is unavailable</td>\n</tr>\n</tbody>\n</table></div>\n<hr class=\"doc-divider\">\n<h2 id=\"4-consensus-proof-of-work-verification\" class=\"doc-heading doc-h2\">4. Consensus &amp; Proof-of-Work Verification<a class=\"anchor-link\" href=\"#4-consensus-proof-of-work-verification\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP validates incoming blocks to protect users from forged transactions:</p>\n<ol class=\"doc-list\">\n<li><strong>Header Hash Validation</strong>:</li>\n</ol>\n<p class=\"doc-para\">Computes double-SHA256 (<code>SHA256d</code>) over the block header.</p>\n<ol class=\"doc-list\">\n<li><strong>Target Difficulty Verification</strong>:</li>\n</ol>\n<p class=\"doc-para\">Validates that the block hash satisfies the network target difficulty, checking for the canonical <code>21E8</code> pattern.</p>\n<ol class=\"doc-list\">\n<li><strong>Tail-100 Sliding Window</strong>:</li>\n</ol>\n<p class=\"doc-para\">TRUSWAP maintains continuous validation across the latest 100 blocks, detecting chain reorganizations and orphan blocks in real-time.</p>\n<ol class=\"doc-list\">\n<li><strong>Compressed Block Storage (<code>tru.dat</code>)</strong>:</li>\n</ol>\n<p class=\"doc-para\">Blocks relevant to the wallet are saved in a Gzip-compressed binary file (<code>tru.dat</code>), preserving network synchronization state across application restarts.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"5-utxo-memory-tracker-transaction-builder\" class=\"doc-heading doc-h2\">5. UTXO Memory Tracker &amp; Transaction Builder<a class=\"anchor-link\" href=\"#5-utxo-memory-tracker-transaction-builder\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"utxo-scanner\" class=\"doc-heading doc-h3\">UTXO Scanner:<a class=\"anchor-link\" href=\"#utxo-scanner\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li>Matches incoming transaction outputs against the user&#x27;s P2PKH script (<code>OP_DUP OP_HASH160 &lt;pkh&gt; OP_EQUALVERIFY OP_CHECKSIG</code>).</li>\n<li>Tracks confirmation depth from 0-confirmation mempool status up to confirmed blocks.</li>\n<li>Identifies and watches 103-byte HTLC script outputs for active swaps.</li>\n<li><strong>UtxoGuard</strong>: Feeds verified unspent output balances to the orderbook relay, preventing users from creating sell orders without actual coins.</li>\n</ul>\n<h3 id=\"transaction-construction\" class=\"doc-heading doc-h3\">Transaction Construction:<a class=\"anchor-link\" href=\"#transaction-construction\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li><strong>Coin Selection</strong>: Selects optimal unspent outputs to cover the required transfer amount plus mining fee.</li>\n<li><strong>Change Output</strong>: Calculates remainder and sends it back to the user&#x27;s change address.</li>\n<li><strong>ECDSA Signing</strong>: Signs each input hash over SECP256k1 using the vault&#x27;s private key.</li>\n<li><strong>Broadcast</strong>: Encapsulates the signed raw transaction in a <code>TxProto</code> message and broadcasts it across connected P2P peers.</li>\n</ol>\n<hr class=\"doc-divider\">\n<h2 id=\"6-how-the-tru-engine-appears-in-the-user-interface\" class=\"doc-heading doc-h2\">6. How the TRU Engine Appears in the User Interface<a class=\"anchor-link\" href=\"#6-how-the-tru-engine-appears-in-the-user-interface\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The underlying P2P network, consensus verification, and UTXO engine are exposed directly in the interface:</p>\n<ol class=\"doc-list\">\n<li><strong>Header Badges &amp; Shortcuts</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><strong><code>\u25cf Online (N peers)</code></strong>: Updates in real time as peer connections are maintained over TCP port 21833.</li>\n<li><strong><code>\ud83d\udd0d TRU #&lt;Height&gt;</code></strong>: Shows the current verified block height. Clicking this badge opens the <strong>TRU Block Explorer</strong> (<code>/explorer</code>).</li>\n<li><strong><code>Mempool: N txs</code></strong>: Shows zero-confirmation transactions observed in the P2P broadcast stream. Clicking filters the explorer to show pending mempool items.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>UTXO Ledger Modal</strong>:</li>\n</ol>\n<p class=\"doc-para\">Clicking <strong>UTXO Ledger</strong> on the TRU Vault Card opens a dedicated ledger table:</p>\n<ul class=\"doc-list\">\n<li><strong>TXID &amp; Vout</strong>: Identifies each discrete unspent coin.</li>\n<li><strong>Value</strong>: Formatted in both standard TRU and 8-decimal raw atoms.</li>\n<li><strong>Confirmations</strong>: Real-time confirmation depth from 0-conf (in mempool) to confirmed blocks.</li>\n<li><strong>Lock Status</strong>: Highlights outputs locked in active HTLC scripts, preventing accidental double-spending.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Built-in TRU Block Explorer (<code>/explorer</code>)</strong>:</li>\n</ol>\n<p class=\"doc-para\">TRUSWAP bundles a self-hosted block explorer that queries your local SPV daemon without calling third-party websites:</p>\n<ul class=\"doc-list\">\n<li><strong>Search Bar</strong>: Search directly by block height (e.g., <code>#46936</code>), block hash, TXID, or wallet address (<code>T...</code>).</li>\n<li><strong>Network Cards</strong>: Block Height Tip, Last Block Time, Mempool Volume, and Connected Peers.</li>\n<li><strong>Latest Blocks</strong>: Table of mined blocks with hashes, timestamps, transaction counts, and block rewards.</li>\n<li><strong>Latest Transactions</strong>: Real-time transaction feed with status badges (<code>MEMPOOL</code> or confirmed block height).</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>TRU Transaction Details Modal</strong>:</li>\n</ol>\n<p class=\"doc-para\">Clicking any transaction ID in the explorer or trade history opens a dialog displaying input outpoints, destination scripts, satoshis, and HTLC opcodes.</p>", "raw_text": "  Chapter 6: TRU Blockchain Engine & SPV Synchronization\n\nThis chapter explains how TRUSWAP connects to the Tokenized Real Utility ($TRU) blockchain, synchronizes transactions, and verifies Proof of Work without relying on third party block explorers.\n\n   \n\n   1. Blockchain Fundamentals (For Beginners)\n\n    What is a Light Client (SPV)?\nTraditional blockchain nodes require downloading hundreds of gigabytes of historical data, which can take days and fill up your hard drive.\n\nTRUSWAP embeds a   Simplified Payment Verification (SPV) client   directly into its core:\n    Direct Peer to Peer  : Connects directly to TRU network nodes over standard TCP.\n    Header First Verification  : Downloads only block headers and recent blocks, verifying the mathematical Proof of Work locally on your device.\n    No Third Party Trust  : It does not ask a centralized server or website what your balance is. It checks the cryptographic proofs directly.\n    Fast Startup  : Synchronizes within seconds and stores recent blocks in a compact cache file ( tru.dat ).\n\n    What is a UTXO?\nUnlike traditional bank accounts or Ethereum where your balance is a single number in a ledger, TRU uses the   UTXO (Unspent Transaction Output)   model (the same model used by Bitcoin):\n\n  Think of UTXOs like physical paper bills in your wallet.\n  If your total balance is 100 TRU, you might hold two \"bills\": one 60 TRU bill and one 40 TRU bill.\n  When you spend 25 TRU, TRUSWAP takes the 40 TRU bill, sends 25 TRU to the recipient, and sends 15 TRU back to your wallet as \"change\" (minus a tiny mining fee).\n  TRUSWAP automatically tracks your bills, selects the right inputs, and manages change outputs automatically.\n\n   \n\n   2. P2P Network Architecture\n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" P2P ARCHITECTURE</span \n    <span class=\"diagram heading\" TRU SPV Engine & Sync Pipeline</span \n  </div \n\n  <div class=\"flow steps\" \n    <div class=\"flow step node tru\" \n      <div class=\"flow step num\" 1</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" TRU P2P Network (Distributed Nodes)</div \n        <div class=\"flow step desc\" Peer nodes listening on TCP Port 21833 (Magic: <code 0xEC7C8FB9</code )</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc TCP Port 21833 (tru mainnet)</div \n\n    <div class=\"flow step\" \n      <div class=\"flow step num\" 2</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Native Rust P2P Client</div \n        <div class=\"flow step desc\" 44 Byte Binary framing, Protobuf payloads, Version/VerAck handshake, Block/Tx/Inv synchronization</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc Raw Headers & Transactions</div \n\n    <div class=\"flow step\" \n      <div class=\"flow step num\" 3</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Consensus & UTXO Validation</div \n        <div class=\"flow step desc\" SHA256d + 21E8 Target verification, in memory UTXO tracking, HTLC lock output scanning</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc Validated Chain State</div \n\n    <div class=\"flow step\" \n      <div class=\"flow step num\" 4</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Gzip Compressed Block Cache (tru.dat)</div \n        <div class=\"flow step desc\" Fast local persistent storage for instant resume across restarts</div \n      </div \n    </div \n  </div \n</div \n\n   \n\n   3. Binary Wire Protocol Framing ( src/tru p2p/wire.rs )\n\nCommunications with TRU network nodes use a compact 44 byte binary frame header followed by a Protocol Buffers serialized payload:\n\n    Header Layout (44 Bytes Fixed):\n\n  Offset   Field Name   Data Type   Value / Description  \n                 \n   0..4     magic     [u8; 4]    Network magic bytes:  0xec, 0x7c, 0x8f, 0xb9  ( MAINNET P2P MAGIC )  \n   4..8     type     i32  (LE)   Little endian signed integer identifying message opcode  \n   8..12     length     u32  (LE)   Little endian payload size in bytes (up to 64 MB maximum)  \n   12..44     checksum     [u8; 32]    Full  SHA 256  hash of the Protobuf payload  \n   44..N     payload    Bytes   Serialized Protocol Buffers message  \n\n    Message Types:\n\n  Type ID   Message Name   Protobuf Structure   Purpose  \n                 \n   0     Version     Version    Handshake greeting: protocol version, services, timestamp, start height  \n   1     VerAck     VerAck    Handshake acknowledgment confirming connection parameters  \n   2     Addr     Addr    Peer exchange sharing IP addresses of active nodes  \n   3     Inv     Inv    Inventory announcement (hashes of newly mined blocks or transactions)  \n   4     GetData     GetData    Request to download specific block or transaction data by hash  \n   5     Block     BlockProto    Serialized block: hash, header, transactions, chain work, height  \n   6     Tx     TxProto    Raw transaction broadcast (transaction ID + serialized bytes)  \n   7     Ping     Ping    Liveness check containing a 64 bit random nonce  \n   8     Pong     Pong    Liveness reply echoing the ping nonce  \n   9     Chat     ChatMessage    Optional peer communication message  \n   10     Height     HeightMessage    Announcement of the node's current tip height  \n   11     GetBlock     GetBlockRequest    Request for a specific block by height  \n   12     GetHeight     GetHeightRequest    Query for the remote peer's highest block  \n   13     BlockNotFound     BlockNotFound    Returned when a requested block is unavailable  \n\n   \n\n   4. Consensus & Proof of Work Verification\n\nTRUSWAP validates incoming blocks to protect users from forged transactions:\n1.   Header Hash Validation  :\n   Computes double SHA256 ( SHA256d ) over the block header.\n2.   Target Difficulty Verification  :\n   Validates that the block hash satisfies the network target difficulty, checking for the canonical  21E8  pattern.\n3.   Tail 100 Sliding Window  :\n   TRUSWAP maintains continuous validation across the latest 100 blocks, detecting chain reorganizations and orphan blocks in real time.\n4.   Compressed Block Storage ( tru.dat )  :\n   Blocks relevant to the wallet are saved in a Gzip compressed binary file ( tru.dat ), preserving network synchronization state across application restarts.\n\n   \n\n   5. UTXO Memory Tracker & Transaction Builder\n\n    UTXO Scanner:\n  Matches incoming transaction outputs against the user's P2PKH script ( OP DUP OP HASH160 <pkh  OP EQUALVERIFY OP CHECKSIG ).\n  Tracks confirmation depth from 0 confirmation mempool status up to confirmed blocks.\n  Identifies and watches 103 byte HTLC script outputs for active swaps.\n    UtxoGuard  : Feeds verified unspent output balances to the orderbook relay, preventing users from creating sell orders without actual coins.\n\n    Transaction Construction:\n1.   Coin Selection  : Selects optimal unspent outputs to cover the required transfer amount plus mining fee.\n2.   Change Output  : Calculates remainder and sends it back to the user's change address.\n3.   ECDSA Signing  : Signs each input hash over SECP256k1 using the vault's private key.\n4.   Broadcast  : Encapsulates the signed raw transaction in a  TxProto  message and broadcasts it across connected P2P peers.\n\n   \n\n   6. How the TRU Engine Appears in the User Interface\n\nThe underlying P2P network, consensus verification, and UTXO engine are exposed directly in the interface:\n\n1.   Header Badges & Shortcuts  :\n        \u25cf Online (N peers)   : Updates in real time as peer connections are maintained over TCP port 21833.\n        \ud83d\udd0d TRU  <Height    : Shows the current verified block height. Clicking this badge opens the   TRU Block Explorer   ( /explorer ).\n        Mempool: N txs   : Shows zero confirmation transactions observed in the P2P broadcast stream. Clicking filters the explorer to show pending mempool items.\n\n2.   UTXO Ledger Modal  :\n   Clicking   UTXO Ledger   on the TRU Vault Card opens a dedicated ledger table:\n       TXID & Vout  : Identifies each discrete unspent coin.\n       Value  : Formatted in both standard TRU and 8 decimal raw atoms.\n       Confirmations  : Real time confirmation depth from 0 conf (in mempool) to confirmed blocks.\n       Lock Status  : Highlights outputs locked in active HTLC scripts, preventing accidental double spending.\n\n3.   Built in TRU Block Explorer ( /explorer )  :\n   TRUSWAP bundles a self hosted block explorer that queries your local SPV daemon without calling third party websites:\n       Search Bar  : Search directly by block height (e.g.,   46936 ), block hash, TXID, or wallet address ( T... ).\n       Network Cards  : Block Height Tip, Last Block Time, Mempool Volume, and Connected Peers.\n       Latest Blocks  : Table of mined blocks with hashes, timestamps, transaction counts, and block rewards.\n       Latest Transactions  : Real time transaction feed with status badges ( MEMPOOL  or confirmed block height).\n\n4.   TRU Transaction Details Modal  :\n   Clicking any transaction ID in the explorer or trade history opens a dialog displaying input outpoints, destination scripts, satoshis, and HTLC opcodes.\n"}, {"id": "07_base_layer2_engine", "num": "07", "file": "07_base_layer2_engine.md", "title": "7. Base Layer-2 Engine", "icon": "\ud83d\udd37", "words": 1130, "read_time": "6 min read", "html": "<h1 id=\"chapter-7-base-layer-2-integration-smart-contracts\" class=\"doc-heading doc-h1\">Chapter 7: Base Layer-2 Integration &amp; Smart Contracts<a class=\"anchor-link\" href=\"#chapter-7-base-layer-2-integration-smart-contracts\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how TRUSWAP interacts with Ethereum&#x27;s Base Layer-2 network to settle stablecoin swaps, covering both everyday user requirements and technical smart contract interfaces.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-base-network-fundamentals-for-beginners\" class=\"doc-heading doc-h2\">1. Base Network Fundamentals (For Beginners)<a class=\"anchor-link\" href=\"#1-base-network-fundamentals-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"what-is-base\" class=\"doc-heading doc-h3\">What is Base?<a class=\"anchor-link\" href=\"#what-is-base\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Base is an Ethereum Layer-2 (L2) network developed by Coinbase:</p>\n<ul class=\"doc-list\">\n<li><strong>Fast Settlements</strong>: Blocks confirm in approximately <strong>2 seconds</strong>.</li>\n<li><strong>Low Fees</strong>: Network transaction fees (called <strong>gas</strong>) typically cost less than <strong>$0.01</strong> per transaction.</li>\n<li><strong>Ethereum Security</strong>: Base settles its transaction proofs directly to the main Ethereum blockchain.</li>\n</ul>\n<h3 id=\"what-is-usdc\" class=\"doc-heading doc-h3\">What is USDC?<a class=\"anchor-link\" href=\"#what-is-usdc\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">USD Coin (USDC) is a digital dollar issued by Circle. 1 USDC is pegged to 1 US Dollar. When trading on TRUSWAP, USDC provides price stability against market volatility.</p>\n<h3 id=\"what-assets-do-you-need-in-your-base-wallet\" class=\"doc-heading doc-h3\">What Assets Do You Need in Your Base Wallet?<a class=\"anchor-link\" href=\"#what-assets-do-you-need-in-your-base-wallet\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">To execute a trade on Base, your Base address (starts with <code>0x</code>) needs:</p>\n<ol class=\"doc-list\">\n<li><strong>A Small Amount of ETH (for Gas)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Every transaction on Base (approving tokens, locking deposits, or claiming funds) requires a tiny fraction of ETH to pay the network.</li>\n<li>Having <strong>$1 to $2 worth of ETH</strong> in your wallet is typically enough for dozens of swaps.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>USDC (if Buying TRU)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>If you want to buy TRU, you need Circle USDC on Base in your wallet.</li>\n<li>If you are selling TRU, you do not need USDC upfront; you will receive USDC when the swap completes.</li>\n</ul>\n<h3 id=\"why-are-browser-extensions-metamask-not-needed\" class=\"doc-heading doc-h3\">Why Are Browser Extensions (MetaMask) Not Needed?<a class=\"anchor-link\" href=\"#why-are-browser-extensions-metamask-not-needed\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Most decentralized exchange websites force you to install a browser extension (like MetaMask or Coinbase Wallet) and click &quot;Confirm&quot; on multiple popups for every step of a trade.</p>\n<p class=\"doc-para\">TRUSWAP eliminates this complexity:</p>\n<ul class=\"doc-list\">\n<li>It includes a <strong>built-in EVM signer</strong> written in native Rust.</li>\n<li>Transactions are constructed and signed locally on your machine.</li>\n<li>Token approvals and claim executions are processed automatically in the background.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-built-in-headless-evm-signer-src-chains-evm-signer-rs\" class=\"doc-heading doc-h2\">2. Built-in Headless EVM Signer (<code>src/chains/evm/signer.rs</code>)<a class=\"anchor-link\" href=\"#2-built-in-headless-evm-signer-src-chains-evm-signer-rs\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP interfaces directly with public Base JSON-RPC endpoints:</p>\n<h3 id=\"key-features\" class=\"doc-heading doc-h3\">Key Features:<a class=\"anchor-link\" href=\"#key-features\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>No Third-Party Extension Dependency</strong>: Directly generates, signs, and broadcasts raw transactions via JSON-RPC.</li>\n<li><strong>Automatic RPC Failover</strong>: Rotates between public Base RPC endpoints (<code>https://mainnet.base.org</code>, <code>base-rpc.publicnode.com</code>, <code>1rpc.io/base</code>, <code>base.llamarpc.com</code>).</li>\n<li><strong>Sequential Nonce Tracker</strong>: Protects against nonce collisions when multiple transactions are staged in succession.</li>\n</ul>\n<h3 id=\"core-json-rpc-methods\" class=\"doc-heading doc-h3\">Core JSON-RPC Methods:<a class=\"anchor-link\" href=\"#core-json-rpc-methods\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><code>eth_blockNumber</code>: Checks the latest block height.</li>\n<li><code>eth_getBalance</code>: Retrieves the account&#x27;s ETH balance (for gas).</li>\n<li><code>eth_call</code>: Executes read-only contract calls (checking USDC balance, allowances, swap states).</li>\n<li><code>eth_getTransactionCount</code>: Queries account nonce (<code>pending</code> and <code>latest</code>).</li>\n<li><code>eth_gasPrice</code>: Queries the current network base fee and priority fee.</li>\n<li><code>eth_sendRawTransaction</code>: Broadcasts locally signed RLP-encoded transaction envelopes.</li>\n<li><code>eth_getTransactionReceipt</code>: Polls for confirmation receipts and event logs.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"3-eip-155-transaction-signing-pipeline\" class=\"doc-heading doc-h2\">3. EIP-155 Transaction Signing Pipeline<a class=\"anchor-link\" href=\"#3-eip-155-transaction-signing-pipeline\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Every transaction submitted to Base is signed locally using EIP-155 replay protection:</p>\n<ol class=\"doc-list\">\n<li><strong>Construct Unsigned Payload</strong>:</li>\n</ol>\n<p class=\"doc-para\">$$\\text{SigningPayload} = \\text{RLP}([nonce, gasPrice, gasLimit, to, value, data, chainId, 0, 0])$$</p>\n<ol class=\"doc-list\">\n<li><strong>Keccak-256 Hashing</strong>:</li>\n</ol>\n<p class=\"doc-para\">$$\\text{TxHash} = \\text{Keccak-256}(\\text{SigningPayload})$$</p>\n<ol class=\"doc-list\">\n<li><strong>ECDSA Signature (<code>secp256k1</code>)</strong>:</li>\n</ol>\n<p class=\"doc-para\">Produces signature parameters $(r, s)$ and recovery identifier $rec\\_id \\in \\{0, 1\\}$.</p>\n<ol class=\"doc-list\">\n<li><strong>EIP-155 Recovery ID ($v$)</strong>:</li>\n</ol>\n<p class=\"doc-para\">$$v = \\text{chainId} \\times 2 + 35 + rec\\_id$$</p>\n<ul class=\"doc-list\">\n<li><strong>Base Mainnet</strong> (<code>chainId = 8453</code>): $v \\in \\{16941, 16942\\}$</li>\n<li><strong>Base Sepolia</strong> (<code>chainId = 84532</code>): $v \\in \\{169099, 169100\\}$</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>RLP-Encode Final Envelope</strong>:</li>\n</ol>\n<p class=\"doc-para\">$$\\text{RawTx} = \\text{RLP}([nonce, gasPrice, gasLimit, to, value, data, v, r, s])$$</p>\n<hr class=\"doc-divider\">\n<h2 id=\"4-erc-20-token-engine-usdc\" class=\"doc-heading doc-h2\">4. ERC-20 Token Engine (USDC)<a class=\"anchor-link\" href=\"#4-erc-20-token-engine-usdc\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">For stablecoin swaps, TRUSWAP interfaces with the official Circle USDC contract:</p>\n<ol class=\"doc-list\">\n<li><strong>Decimals Normalization</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>USDC uses <strong>6 decimal places</strong> ($1.00 = 1,000,000$ units).</li>\n<li>TRU uses <strong>8 decimal places</strong> ($1.00000000 = 100,000,000$ atoms).</li>\n<li>Integer fixed-point math is used exclusively to prevent floating-point rounding errors.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Two-Step ERC-20 Allowance &amp; Approval</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Before locking tokens in an HTLC, the client calls <code>allowance(owner, htlcAddress)</code> (selector <code>0xdd62ed3e</code>).</li>\n<li>If current allowance is less than the required swap amount, TRUSWAP automatically constructs and broadcasts an <code>approve(htlcAddress, amount)</code> transaction (selector <code>0x095ea7b3</code>) before creating the swap.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"5-basehtlc-smart-contract\" class=\"doc-heading doc-h2\">5. BaseHTLC Smart Contract<a class=\"anchor-link\" href=\"#5-basehtlc-smart-contract\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"deployed-contract-addresses\" class=\"doc-heading doc-h3\">Deployed Contract Addresses:<a class=\"anchor-link\" href=\"#deployed-contract-addresses\" title=\"Direct Link\">#</a></h3>\n<div class=\"table-responsive\"><table class=\"doc-table\">\n<thead><tr>\n<th>Network</th>\n<th>Contract</th>\n<th>Address</th>\n<th>Explorer Link</th>\n</tr></thead>\n<tbody>\n<tr>\n<td><strong>Base Mainnet</strong> (<code>8453</code>)</td>\n<td><code>BaseHTLC</code></td>\n<td><code>0x812b611208297eb7A2b153BECA8b2AF47C7614DF</code></td>\n<td><a href=\"https://basescan.org/address/0x812b611208297eb7A2b153BECA8b2AF47C7614DF\" target=\"_blank\" rel=\"noopener\">View on BaseScan</a></td>\n</tr>\n<tr>\n<td><strong>Base Mainnet</strong> (<code>8453</code>)</td>\n<td>Official Circle <code>USDC</code></td>\n<td><code>0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</code></td>\n<td><a href=\"https://basescan.org/token/0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\" target=\"_blank\" rel=\"noopener\">View on BaseScan</a></td>\n</tr>\n<tr>\n<td><strong>Base Sepolia</strong> (<code>84532</code>)</td>\n<td><code>BaseHTLC</code> (Testnet)</td>\n<td><code>0xF2e70fbd7Da79d188f805e61e8587AACD49772a5</code></td>\n<td><a href=\"https://sepolia.basescan.org/address/0xF2e70fbd7Da79d188f805e61e8587AACD49772a5\" target=\"_blank\" rel=\"noopener\">View on Sepolia BaseScan</a></td>\n</tr>\n<tr>\n<td><strong>Base Sepolia</strong> (<code>84532</code>)</td>\n<td>Test <code>USDC</code></td>\n<td><code>0x036CbD53842c5426634e7929541eC2318f3dCF7e</code></td>\n<td><a href=\"https://sepolia.basescan.org/token/0x036CbD53842c5426634e7929541eC2318f3dCF7e\" target=\"_blank\" rel=\"noopener\">View on Sepolia BaseScan</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"solidity-interface-ibasehtlc\" class=\"doc-heading doc-h3\">Solidity Interface (<code>IBaseHTLC</code>):<a class=\"anchor-link\" href=\"#solidity-interface-ibasehtlc\" title=\"Direct Link\">#</a></h3>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">SOLIDITY</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\npragma solidity ^0.8.20;\n\ninterface IBaseHTLC {\n    // 1. Lock funds for a swap\n    // Selector: 0xefafa23f\n    function createSwap(\n        address beneficiary,\n        address token,\n        uint256 amount,\n        bytes20 hash160Digest,\n        uint256 timelock,\n        bytes32 salt\n    ) external returns (bytes32 swapId);\n\n    // 2. Claim funds with the 32-byte secret preimage\n    // Selector: 0xf0331024\n    function claimSwap(bytes32 swapId, bytes calldata secret) external;\n\n    // 3. Refund deposit if the timelock has elapsed\n    // Selector: 0x7249fbb6\n    function refundSwap(bytes32 swapId) external;\n\n    // Event emitted when a swap is created\n    event SwapCreated(\n        bytes32 indexed swapId,\n        address indexed sender,\n        address indexed beneficiary,\n        address token,\n        uint256 amount,\n        bytes20 hash160,\n        uint256 timelock\n    );\n\n    // Event emitted when funds are claimed (revealing the secret)\n    event SwapClaimed(\n        bytes32 indexed swapId,\n        bytes secret,\n        address claimer\n    );\n}</code></pre></div>\n<h3 id=\"event-log-monitoring\" class=\"doc-heading doc-h3\">Event Log Monitoring:<a class=\"anchor-link\" href=\"#event-log-monitoring\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><code>SwapCreated</code> Topic 0: <code>0x6095347ebb4084720e12a89ad2c70fc169534308159a6884c677a6ec9a30742c</code></li>\n<li><code>SwapClaimed</code> Topic 0: <code>0xd14278a0c2b5ef6c1c6418dba05a4ebd99536912416835fde879006db64b8d06</code></li>\n</ul>\n<p class=\"doc-para\">When a participant claims their USDC on Base, the <code>SwapClaimed</code> event publishes the secret on-chain. TRUSWAP&#x27;s background watcher (<code>src/chains/evm/mod.rs</code>) reads this transaction receipt, extracts the secret bytes, and automatically claims the TRU deposit on the Proof-of-Work blockchain.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"6-how-base-layer-2-is-managed-in-the-truswap-interface\" class=\"doc-heading doc-h2\">6. How Base Layer-2 Is Managed in the TRUSWAP Interface<a class=\"anchor-link\" href=\"#6-how-base-layer-2-is-managed-in-the-truswap-interface\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The Base EVM engine is integrated into the user interface through dedicated controls:</p>\n<ol class=\"doc-list\">\n<li><strong>The Base Vault Card</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><strong>USDC Balance</strong>: Displays available stablecoin funds ready to buy TRU.</li>\n<li><strong>Gas Balance (<code>\u26fd Gas: X.XXXX ETH</code>)</strong>: Highlights your native ETH balance directly on the card. This ensures you always know if you have sufficient gas to execute contracts before starting a trade.</li>\n<li><strong>Address (<code>0x...</code>)</strong>: Displays your local EVM address with one-click clipboard copying.</li>\n<li><strong>Base Explorer \u2197 Link</strong>: Opens your account directly on BaseScan or Sepolia BaseScan to check on-chain token transfers.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Base Modal Dialogs</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><strong>Deposit</strong>: Displays your Base address and QR code.</li>\n<li><strong>Withdraw</strong>: Allows withdrawing either <strong>USDC</strong> or native <strong>ETH</strong> to any external Ethereum address. Includes a <strong>Max</strong> button and calculates estimated network gas fees automatically.</li>\n<li><strong>Export Keys</strong>: Reveals your <strong>12-word recovery mnemonic</strong> and raw private key behind visibility toggles (<code>\ud83d\udc41 Show</code>).</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Autonomous Gas and Token Handling</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>During swaps, you do not need to manually calculate gas prices or approve contract allowances.</li>\n<li>TRUSWAP checks the current ERC-20 <code>allowance</code>. If an allowance is required, it signs the <code>approve()</code> transaction automatically and proceeds to <code>createSwap()</code>.</li>\n<li>If your ETH gas balance is insufficient, the UI warns you before attempting the transaction, preventing lost gas or stuck orders.</li>\n</ul>", "raw_text": "  Chapter 7: Base Layer 2 Integration & Smart Contracts\n\nThis chapter explains how TRUSWAP interacts with Ethereum's Base Layer 2 network to settle stablecoin swaps, covering both everyday user requirements and technical smart contract interfaces.\n\n   \n\n   1. Base Network Fundamentals (For Beginners)\n\n    What is Base?\nBase is an Ethereum Layer 2 (L2) network developed by Coinbase:\n    Fast Settlements  : Blocks confirm in approximately   2 seconds  .\n    Low Fees  : Network transaction fees (called   gas  ) typically cost less than   $0.01   per transaction.\n    Ethereum Security  : Base settles its transaction proofs directly to the main Ethereum blockchain.\n\n    What is USDC?\nUSD Coin (USDC) is a digital dollar issued by Circle. 1 USDC is pegged to 1 US Dollar. When trading on TRUSWAP, USDC provides price stability against market volatility.\n\n    What Assets Do You Need in Your Base Wallet?\nTo execute a trade on Base, your Base address (starts with  0x ) needs:\n1.   A Small Amount of ETH (for Gas)  :\n     Every transaction on Base (approving tokens, locking deposits, or claiming funds) requires a tiny fraction of ETH to pay the network.\n     Having   $1 to $2 worth of ETH   in your wallet is typically enough for dozens of swaps.\n2.   USDC (if Buying TRU)  :\n     If you want to buy TRU, you need Circle USDC on Base in your wallet.\n     If you are selling TRU, you do not need USDC upfront; you will receive USDC when the swap completes.\n\n    Why Are Browser Extensions (MetaMask) Not Needed?\nMost decentralized exchange websites force you to install a browser extension (like MetaMask or Coinbase Wallet) and click \"Confirm\" on multiple popups for every step of a trade.\n\nTRUSWAP eliminates this complexity:\n  It includes a   built in EVM signer   written in native Rust.\n  Transactions are constructed and signed locally on your machine.\n  Token approvals and claim executions are processed automatically in the background.\n\n   \n\n   2. Built in Headless EVM Signer ( src/chains/evm/signer.rs )\n\nTRUSWAP interfaces directly with public Base JSON RPC endpoints:\n\n    Key Features:\n    No Third Party Extension Dependency  : Directly generates, signs, and broadcasts raw transactions via JSON RPC.\n    Automatic RPC Failover  : Rotates between public Base RPC endpoints ( https://mainnet.base.org ,  base rpc.publicnode.com ,  1rpc.io/base ,  base.llamarpc.com ).\n    Sequential Nonce Tracker  : Protects against nonce collisions when multiple transactions are staged in succession.\n\n    Core JSON RPC Methods:\n   eth blockNumber : Checks the latest block height.\n   eth getBalance : Retrieves the account's ETH balance (for gas).\n   eth call : Executes read only contract calls (checking USDC balance, allowances, swap states).\n   eth getTransactionCount : Queries account nonce ( pending  and  latest ).\n   eth gasPrice : Queries the current network base fee and priority fee.\n   eth sendRawTransaction : Broadcasts locally signed RLP encoded transaction envelopes.\n   eth getTransactionReceipt : Polls for confirmation receipts and event logs.\n\n   \n\n   3. EIP 155 Transaction Signing Pipeline\n\nEvery transaction submitted to Base is signed locally using EIP 155 replay protection:\n\n1.   Construct Unsigned Payload  :\n   $$\\text{SigningPayload} = \\text{RLP}([nonce, gasPrice, gasLimit, to, value, data, chainId, 0, 0])$$\n2.   Keccak 256 Hashing  :\n   $$\\text{TxHash} = \\text{Keccak 256}(\\text{SigningPayload})$$\n3.   ECDSA Signature ( secp256k1 )  :\n   Produces signature parameters $(r, s)$ and recovery identifier $rec\\ id \\in \\{0, 1\\}$.\n4.   EIP 155 Recovery ID ($v$)  :\n   $$v = \\text{chainId} \\times 2 + 35 + rec\\ id$$\n       Base Mainnet   ( chainId = 8453 ): $v \\in \\{16941, 16942\\}$\n       Base Sepolia   ( chainId = 84532 ): $v \\in \\{169099, 169100\\}$\n5.   RLP Encode Final Envelope  :\n   $$\\text{RawTx} = \\text{RLP}([nonce, gasPrice, gasLimit, to, value, data, v, r, s])$$\n\n   \n\n   4. ERC 20 Token Engine (USDC)\n\nFor stablecoin swaps, TRUSWAP interfaces with the official Circle USDC contract:\n\n1.   Decimals Normalization  :\n     USDC uses   6 decimal places   ($1.00 = 1,000,000$ units).\n     TRU uses   8 decimal places   ($1.00000000 = 100,000,000$ atoms).\n     Integer fixed point math is used exclusively to prevent floating point rounding errors.\n2.   Two Step ERC 20 Allowance & Approval  :\n     Before locking tokens in an HTLC, the client calls  allowance(owner, htlcAddress)  (selector  0xdd62ed3e ).\n     If current allowance is less than the required swap amount, TRUSWAP automatically constructs and broadcasts an  approve(htlcAddress, amount)  transaction (selector  0x095ea7b3 ) before creating the swap.\n\n   \n\n   5. BaseHTLC Smart Contract\n\n    Deployed Contract Addresses:\n\n  Network   Contract   Address   Explorer Link  \n                 \n    Base Mainnet   ( 8453 )    BaseHTLC     0x812b611208297eb7A2b153BECA8b2AF47C7614DF    [View on BaseScan](https://basescan.org/address/0x812b611208297eb7A2b153BECA8b2AF47C7614DF)  \n    Base Mainnet   ( 8453 )   Official Circle  USDC     0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913    [View on BaseScan](https://basescan.org/token/0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913)  \n    Base Sepolia   ( 84532 )    BaseHTLC  (Testnet)    0xF2e70fbd7Da79d188f805e61e8587AACD49772a5    [View on Sepolia BaseScan](https://sepolia.basescan.org/address/0xF2e70fbd7Da79d188f805e61e8587AACD49772a5)  \n    Base Sepolia   ( 84532 )   Test  USDC     0x036CbD53842c5426634e7929541eC2318f3dCF7e    [View on Sepolia BaseScan](https://sepolia.basescan.org/token/0x036CbD53842c5426634e7929541eC2318f3dCF7e)  \n\n    Solidity Interface ( IBaseHTLC ):\n\n   solidity\n// SPDX License Identifier: MIT\npragma solidity ^0.8.20;\n\ninterface IBaseHTLC {\n    // 1. Lock funds for a swap\n    // Selector: 0xefafa23f\n    function createSwap(\n        address beneficiary,\n        address token,\n        uint256 amount,\n        bytes20 hash160Digest,\n        uint256 timelock,\n        bytes32 salt\n    ) external returns (bytes32 swapId);\n\n    // 2. Claim funds with the 32 byte secret preimage\n    // Selector: 0xf0331024\n    function claimSwap(bytes32 swapId, bytes calldata secret) external;\n\n    // 3. Refund deposit if the timelock has elapsed\n    // Selector: 0x7249fbb6\n    function refundSwap(bytes32 swapId) external;\n\n    // Event emitted when a swap is created\n    event SwapCreated(\n        bytes32 indexed swapId,\n        address indexed sender,\n        address indexed beneficiary,\n        address token,\n        uint256 amount,\n        bytes20 hash160,\n        uint256 timelock\n    );\n\n    // Event emitted when funds are claimed (revealing the secret)\n    event SwapClaimed(\n        bytes32 indexed swapId,\n        bytes secret,\n        address claimer\n    );\n}\n   \n\n    Event Log Monitoring:\n   SwapCreated  Topic 0:  0x6095347ebb4084720e12a89ad2c70fc169534308159a6884c677a6ec9a30742c \n   SwapClaimed  Topic 0:  0xd14278a0c2b5ef6c1c6418dba05a4ebd99536912416835fde879006db64b8d06 \n\nWhen a participant claims their USDC on Base, the  SwapClaimed  event publishes the secret on chain. TRUSWAP's background watcher ( src/chains/evm/mod.rs ) reads this transaction receipt, extracts the secret bytes, and automatically claims the TRU deposit on the Proof of Work blockchain.\n\n   \n\n   6. How Base Layer 2 Is Managed in the TRUSWAP Interface\n\nThe Base EVM engine is integrated into the user interface through dedicated controls:\n\n1.   The Base Vault Card  :\n       USDC Balance  : Displays available stablecoin funds ready to buy TRU.\n       Gas Balance ( \u26fd Gas: X.XXXX ETH )  : Highlights your native ETH balance directly on the card. This ensures you always know if you have sufficient gas to execute contracts before starting a trade.\n       Address ( 0x... )  : Displays your local EVM address with one click clipboard copying.\n       Base Explorer \u2197 Link  : Opens your account directly on BaseScan or Sepolia BaseScan to check on chain token transfers.\n\n2.   Base Modal Dialogs  :\n       Deposit  : Displays your Base address and QR code.\n       Withdraw  : Allows withdrawing either   USDC   or native   ETH   to any external Ethereum address. Includes a   Max   button and calculates estimated network gas fees automatically.\n       Export Keys  : Reveals your   12 word recovery mnemonic   and raw private key behind visibility toggles ( \ud83d\udc41 Show ).\n\n3.   Autonomous Gas and Token Handling  :\n     During swaps, you do not need to manually calculate gas prices or approve contract allowances.\n     TRUSWAP checks the current ERC 20  allowance . If an allowance is required, it signs the  approve()  transaction automatically and proceeds to  createSwap() .\n     If your ETH gas balance is insufficient, the UI warns you before attempting the transaction, preventing lost gas or stuck orders.\n"}, {"id": "08_p2p_orderbook_mesh", "num": "08", "file": "08_p2p_orderbook_mesh.md", "title": "8. P2P Orderbook Mesh", "icon": "\ud83d\udd78\ufe0f", "words": 1321, "read_time": "7 min read", "html": "<h1 id=\"chapter-8-p2p-orderbook-mesh-websocket-relay\" class=\"doc-heading doc-h1\">Chapter 8: P2P Orderbook Mesh &amp; WebSocket Relay<a class=\"anchor-link\" href=\"#chapter-8-p2p-orderbook-mesh-websocket-relay\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how trade orders are shared across the network without central matchmaking servers, written for both general users and network engineers.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-how-the-orderbook-works-for-beginners\" class=\"doc-heading doc-h2\">1. How the Orderbook Works (For Beginners)<a class=\"anchor-link\" href=\"#1-how-the-orderbook-works-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"what-is-an-orderbook\" class=\"doc-heading doc-h3\">What is an Orderbook?<a class=\"anchor-link\" href=\"#what-is-an-orderbook\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">An <strong>orderbook</strong> is an open board displaying active trade offers:</p>\n<ul class=\"doc-list\">\n<li><em>&quot;Alice wants to sell 500 TRU at $0.05 each ($25.00 USDC total).&quot;</em></li>\n<li><em>&quot;Bob wants to buy 1,000 TRU at $0.05 each ($50.00 USDC total).&quot;</em></li>\n</ul>\n<p class=\"doc-para\">When you use TRUSWAP, you can either pick an existing offer from the list to trade immediately (<strong>Taker</strong>), or publish your own offer for others to accept (<strong>Maker</strong>).</p>\n<h3 id=\"what-is-an-orderbook-relay\" class=\"doc-heading doc-h3\">What is an Orderbook Relay?<a class=\"anchor-link\" href=\"#what-is-an-orderbook-relay\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Because users trade from home Wi-Fi or mobile phones where incoming connections are often blocked by routers or firewalls:</p>\n<ul class=\"doc-list\">\n<li><strong>Relays act like public message boards</strong>: You connect to a relay over a standard outbound web connection (WebSocket), the same way you load any website.</li>\n<li>When you create an order, you sign it on your device and send it to the relay.</li>\n<li>The relay broadcasts your order to every connected user in real time.</li>\n</ul>\n<h3 id=\"can-a-relay-steal-your-money\" class=\"doc-heading doc-h3\">Can a Relay Steal Your Money?<a class=\"anchor-link\" href=\"#can-a-relay-steal-your-money\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\"><strong>No. A relay never has custody of any funds or private keys.</strong></p>\n<ul class=\"doc-list\">\n<li>The relay only transmits text messages containing signed order parameters in JSON format.</li>\n<li>When another user clicks your order to trade, the actual swap happens directly between your two devices and the respective blockchain smart contracts/scripts.</li>\n<li>Even if a relay is hacked or goes offline, your funds remain secure in your local wallet.</li>\n</ul>\n<h3 id=\"how-does-the-relay-prevent-spam-and-fake-orders\" class=\"doc-heading doc-h3\">How Does the Relay Prevent Spam and Fake Orders?<a class=\"anchor-link\" href=\"#how-does-the-relay-prevent-spam-and-fake-orders\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Anyone could try to spam a message board with fake orders like <em>&quot;I want to sell 10,000,000 TRU.&quot;</em> TRUSWAP relays prevent this through two automated checks:</p>\n<ol class=\"doc-list\">\n<li><strong>UtxoGuard</strong>: If you post an order to sell TRU, the relay checks the TRU blockchain. If your wallet address does not actually own those unspent coins, the order is rejected.</li>\n<li><strong>BaseWatcher</strong>: If you post an order to buy TRU with USDC, the relay checks Base to confirm you hold the required USDC balance and have approved the HTLC contract.</li>\n</ol>\n<h3 id=\"what-protocol-is-used\" class=\"doc-heading doc-h3\">What Protocol is Used?<a class=\"anchor-link\" href=\"#what-protocol-is-used\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Between the UI and the Local App</strong>: Communication is <strong>100% standard JSON</strong> over local WebSocket (<code>ws://127.0.0.1:8899/ws</code>). The frontend sends readable JSON action commands and receives JSON event updates.</li>\n<li><strong>Between the App and the Public Relay</strong>: Communication is also <strong>100% standard JSON over WebSockets</strong> (<code>wss://.../orderbook</code>). Orders, cancellations, and orderbook snapshots are transmitted as UTF-8 JSON text messages.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-relay-architecture\" class=\"doc-heading doc-h2\">2. Relay Architecture<a class=\"anchor-link\" href=\"#2-relay-architecture\" title=\"Direct Link\">#</a></h2>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">ORDERBOOK RELAY</span>\n    <span class=\"diagram-heading\">Maker-Taker WebSocket Architecture</span>\n  </div>\n  <div class=\"flow-steps\">\n    <div class=\"flow-step node-tru\">\n      <div class=\"flow-step-num\">1</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">MAKER (Alice: Desktop)</div>\n        <div class=\"flow-step-desc\">Submits Signed <code>SELL_TRU</code> Order with UTXO ownership proof via WebSocket</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc WebSocket (JSON Text Frames)</div>\n    <div class=\"diagram-node node-app\">\n      <div class=\"node-badge\">\u26a1 TRUSWAP ORDERBOOK RELAY SERVICE</div>\n      <div class=\"node-title\">Verification & In-Memory Matching</div>\n      <div class=\"node-tags-grid\">\n        <div class=\"feature-tag\">ConnectionGuard (Per-IP limits)</div>\n        <div class=\"feature-tag\">UtxoGuard (Live PoW UTXO check)</div>\n        <div class=\"feature-tag\">BaseWatcher (Base USDC check)</div>\n        <div class=\"feature-tag\">In-Memory Book (Instant match)</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Real-time JSON Broadcast Event Stream</div>\n    <div class=\"flow-step node-base\">\n      <div class=\"flow-step-num\">2</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">TAKER (Bob: Android)</div>\n        <div class=\"flow-step-desc\">Receives instant orderbook update, clicks Swap, and locks Base USDC in BaseHTLC</div>\n      </div>\n    </div>\n  </div>\n</div>\n<h3 id=\"relay-capacity-profiles\" class=\"doc-heading doc-h3\">Relay Capacity Profiles:<a class=\"anchor-link\" href=\"#relay-capacity-profiles\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Relay operators can select an operating profile based on intended server scale:</p>\n<ul class=\"doc-list\">\n<li><strong>Standard Profile</strong> (<code>--blazing</code>): Default setting for personal nodes and smaller networks (supports up to 5,000 concurrent client streams).</li>\n<li><strong>High-Capacity Server Profile</strong> (<code>--ultrablazing</code>): Setting for public relay infrastructure. Automatically configures Linux operating system limits (<code>tune_kernel_limits()</code>) to 1,048,576 file descriptors to handle high connection volume.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"3-cryptographic-order-structure-src-relay-protocol-rs\" class=\"doc-heading doc-h2\">3. Cryptographic Order Structure (<code>src/relay/protocol.rs</code>)<a class=\"anchor-link\" href=\"#3-cryptographic-order-structure-src-relay-protocol-rs\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">Orders submitted to a relay are cryptographically signed by the creator using standard JSON payloads:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">JSON</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-json\">{\n  &quot;order_id&quot;: &quot;8a3f91c2...64hex&quot;,\n  &quot;side&quot;: &quot;SELL_TRU&quot;,\n  &quot;amount_tru&quot;: 500.0,\n  &quot;amount_usdc&quot;: 25.0,\n  &quot;price&quot;: 0.05,\n  &quot;hash160_hex&quot;: &quot;3f91c28a...40hex&quot;,\n  &quot;timelock&quot;: 1790900000,\n  &quot;maker_tru_address&quot;: &quot;T...&quot;,\n  &quot;maker_tru_pubkey&quot;: &quot;03a1b2...&quot;,\n  &quot;maker_base_address&quot;: &quot;0x1111111111111111111111111111111111111111&quot;,\n  &quot;signature_base&quot;: &quot;0x4b2c...&quot;,\n  &quot;signature_tru&quot;: null,\n  &quot;created_at&quot;: 1790800000,\n  &quot;is_matched&quot;: false\n}</code></pre></div>\n<h3 id=\"order-verification-rules\" class=\"doc-heading doc-h3\">Order Verification Rules:<a class=\"anchor-link\" href=\"#order-verification-rules\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li><strong>Base Signature Verification</strong>: The relay runs ECDSA <code>ecrecover</code> on <code>signature_base</code> using the EIP-191 personal sign standard. The recovered address must match <code>maker_base_address</code>.</li>\n<li><strong>TRU Signature Verification</strong>: If <code>signature_tru</code> is provided, the relay verifies the SECP256k1 signature against <code>maker_tru_address</code>.</li>\n<li><strong>Payload Immutability</strong>: <code>order_id</code> is computed from the order fields. Modifying amounts, prices, addresses, or timelocks breaks the signature and causes the order to be rejected.</li>\n</ol>\n<hr class=\"doc-divider\">\n<h2 id=\"4-relay-messaging-protocol-json-over-websockets\" class=\"doc-heading doc-h2\">4. Relay Messaging Protocol (JSON over WebSockets)<a class=\"anchor-link\" href=\"#4-relay-messaging-protocol-json-over-websockets\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">All communication between clients and the relay mesh uses human-readable, UTF-8 JSON text messages:</p>\n<h3 id=\"client-commands-clientmessage\" class=\"doc-heading doc-h3\">Client Commands (<code>ClientMessage</code>):<a class=\"anchor-link\" href=\"#client-commands-clientmessage\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Submit Order</strong>:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">JSON</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-json\">  {\n    &quot;action&quot;: &quot;SubmitOrder&quot;,\n    &quot;payload&quot;: {\n      &quot;order_id&quot;: &quot;8a3f...&quot;,\n      &quot;side&quot;: &quot;SELL_TRU&quot;,\n      &quot;amount_tru&quot;: 500.0,\n      &quot;amount_usdc&quot;: 25.0,\n      &quot;hash160_hex&quot;: &quot;3f91...&quot;,\n      &quot;timelock&quot;: 1790900000,\n      &quot;maker_tru_address&quot;: &quot;T...&quot;,\n      &quot;maker_base_address&quot;: &quot;0x...&quot;,\n      &quot;signature_base&quot;: &quot;0x...&quot;\n    }\n  }</code></pre></div>\n<ul class=\"doc-list\">\n<li><strong>Cancel Order</strong>:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">JSON</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-json\">  {\n    &quot;action&quot;: &quot;CancelOrder&quot;,\n    &quot;payload&quot;: {\n      &quot;order_id&quot;: &quot;8a3f...&quot;,\n      &quot;maker_base_address&quot;: &quot;0x...&quot;,\n      &quot;signature_base&quot;: &quot;0x...&quot;\n    }\n  }</code></pre></div>\n<ul class=\"doc-list\">\n<li><strong>Take Order</strong>:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">JSON</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-json\">  {\n    &quot;action&quot;: &quot;TakeOrder&quot;,\n    &quot;payload&quot;: {\n      &quot;order_id&quot;: &quot;8a3f...&quot;,\n      &quot;taker_base_address&quot;: &quot;0x...&quot;,\n      &quot;taker_tru_address&quot;: &quot;T...&quot;,\n      &quot;signature_base&quot;: &quot;0x...&quot;\n    }\n  }</code></pre></div>\n<ul class=\"doc-list\">\n<li><strong>Ping / Liveness</strong>:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">JSON</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-json\">  {\n    &quot;action&quot;: &quot;Ping&quot;\n  }</code></pre></div>\n<h3 id=\"relay-broadcast-events-relaybroadcastevent\" class=\"doc-heading doc-h3\">Relay Broadcast Events (<code>RelayBroadcastEvent</code>):<a class=\"anchor-link\" href=\"#relay-broadcast-events-relaybroadcastevent\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Orderbook Snapshot</strong>: Pushed immediately when a client connects, containing all currently active orders, server timestamp, and operational mode.</li>\n<li><strong>Order Added</strong>: Broadcast when a verified order is submitted to the book.</li>\n<li><strong>Order Removed</strong>: Broadcast when an order is cancelled by its maker or taken by a counterparty.</li>\n<li><strong>Order Matched</strong>: Broadcast to notify participants that a taker has initiated the atomic swap escrow.</li>\n<li><strong>Pong</strong>: Heartbeat reply confirming connection health.</li>\n<li><strong>Error</strong>: Returned when an invalid payload or unauthorized action occurs:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">JSON</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-json\">  {\n    &quot;event&quot;: &quot;Error&quot;,\n    &quot;data&quot;: {\n      &quot;code&quot;: &quot;INVALID_SIGNATURE&quot;,\n      &quot;message&quot;: &quot;Recovered address does not match maker_base_address&quot;\n    }\n  }</code></pre></div>\n<hr class=\"doc-divider\">\n<h2 id=\"5-network-connectivity-firewall-traversal\" class=\"doc-heading doc-h2\">5. Network Connectivity &amp; Firewall Traversal<a class=\"anchor-link\" href=\"#5-network-connectivity-firewall-traversal\" title=\"Direct Link\">#</a></h2>\n<ul class=\"doc-list\">\n<li><strong>Standard Outbound Ports</strong>: Clients connect over outbound TCP ports <code>80</code> (<code>ws://</code>) or <code>443</code> (<code>wss://</code>), allowing the app to function on standard home broadband, office networks, and mobile data (4G/5G).</li>\n<li><strong>No Port Forwarding</strong>: Users do not need to configure router settings, UPnP, or dynamic DNS to t
