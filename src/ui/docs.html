rade.</li>\n<li><strong>Auto-Reconnect</strong>: The client automatically reconnects with exponential backoff if a connection drops during network changes.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"6-how-the-orderbook-appears-in-the-user-interface\" class=\"doc-heading doc-h2\">6. How the Orderbook Appears in the User Interface<a class=\"anchor-link\" href=\"#6-how-the-orderbook-appears-in-the-user-interface\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The P2P orderbook relay mesh feeds directly into the interactive Exchange Trading Cockpit on <code>http://127.0.0.1:8899</code>:</p>\n<ol class=\"doc-list\">\n<li><strong>Spot Limit Order (Top Card)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><strong><code>[Buy TRU]</code> / <code>[Sell TRU]</code> Direction Switcher</strong>: Toggle your trade intent with a single click.</li>\n<li><strong>Available Balance</strong>: Reflects spendable funds in your local vault (Base USDC for buying, TRU for selling).</li>\n<li><strong>Price per 1 TRU</strong>: Set your limit price in USDC. Click the <strong>Best Price</strong> hint to automatically fill the lowest current ask or highest bid.</li>\n<li><strong>Interactive Percentage Sliders (<code>25%</code>, <code>50%</code>, <code>75%</code>, <code>100%</code>)</strong>: Smooth sliders with snap marks allow precise allocation of your available vault balance without typing numbers manually.</li>\n<li><strong>Dynamic Action Button</strong>: Reads <code>Enter Amount &amp; Price</code> when inputs are empty, updating automatically to <code>Buy TRU</code> or <code>Sell TRU</code> once amounts are specified. Clicking signs the order with your local private key and pushes it to the relay via WebSocket.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>TRU / USDC Spot (Bottom Orderbook Terminal)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><strong><code>\ud83d\udcca Book</code> Tab</strong>: Unified orderbook view showing market spread and depth.</li>\n<li><strong><code>\ud83d\udd34 Asks</code> Tab</strong>: Lists open sell offers. To buy TRU immediately, click <strong>[Swap]</strong> on any row to open the Take Order Modal.</li>\n<li><strong><code>\ud83d\udfe2 Bids</code> Tab</strong>: Lists open buy offers. To sell TRU immediately, click <strong>[Swap]</strong> to accept the offer.</li>\n<li><strong><code>\ud83d\udd04 In-Progress</code> Tab</strong>: Real-time tracker for executing atomic swaps. Active trades display step badges (e.g. <code>Locking TRU</code>, <code>Confirming</code>, <code>Claiming</code>). Clicking any trade opens the <strong>Automation Audit Modal</strong> with live terminal telemetry.</li>\n<li><strong><code>\ud83d\udcdc History</code> Tab</strong>: Log of settled swaps and verified on-chain HTLC contracts.</li>\n<li><strong>Order Cancellation</strong>: If you posted an active order, it shows a red <strong>[Cancel]</strong> button in the table so you can withdraw it from the relay at any time. All updates sync instantly across clients via JSON WebSockets without page reloads.</li>\n</ul>", "raw_text": "  Chapter 8: P2P Orderbook Mesh & WebSocket Relay\n\nThis chapter explains how trade orders are shared across the network without central matchmaking servers, written for both general users and network engineers.\n\n   \n\n   1. How the Orderbook Works (For Beginners)\n\n    What is an Orderbook?\nAn   orderbook   is an open board displaying active trade offers:\n   \"Alice wants to sell 500 TRU at $0.05 each ($25.00 USDC total).\" \n   \"Bob wants to buy 1,000 TRU at $0.05 each ($50.00 USDC total).\" \n\nWhen you use TRUSWAP, you can either pick an existing offer from the list to trade immediately (  Taker  ), or publish your own offer for others to accept (  Maker  ).\n\n    What is an Orderbook Relay?\nBecause users trade from home Wi Fi or mobile phones where incoming connections are often blocked by routers or firewalls:\n    Relays act like public message boards  : You connect to a relay over a standard outbound web connection (WebSocket), the same way you load any website.\n  When you create an order, you sign it on your device and send it to the relay.\n  The relay broadcasts your order to every connected user in real time.\n\n    Can a Relay Steal Your Money?\n  No. A relay never has custody of any funds or private keys.  \n  The relay only transmits text messages containing signed order parameters in JSON format.\n  When another user clicks your order to trade, the actual swap happens directly between your two devices and the respective blockchain smart contracts/scripts.\n  Even if a relay is hacked or goes offline, your funds remain secure in your local wallet.\n\n    How Does the Relay Prevent Spam and Fake Orders?\nAnyone could try to spam a message board with fake orders like  \"I want to sell 10,000,000 TRU.\"  TRUSWAP relays prevent this through two automated checks:\n1.   UtxoGuard  : If you post an order to sell TRU, the relay checks the TRU blockchain. If your wallet address does not actually own those unspent coins, the order is rejected.\n2.   BaseWatcher  : If you post an order to buy TRU with USDC, the relay checks Base to confirm you hold the required USDC balance and have approved the HTLC contract.\n\n    What Protocol is Used?\n    Between the UI and the Local App  : Communication is   100% standard JSON   over local WebSocket ( ws://127.0.0.1:8899/ws ). The frontend sends readable JSON action commands and receives JSON event updates.\n    Between the App and the Public Relay  : Communication is also   100% standard JSON over WebSockets   ( wss://.../orderbook ). Orders, cancellations, and orderbook snapshots are transmitted as UTF 8 JSON text messages.\n\n   \n\n   2. Relay Architecture\n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" ORDERBOOK RELAY</span \n    <span class=\"diagram heading\" Maker Taker WebSocket Architecture</span \n  </div \n\n  <div class=\"flow steps\" \n    <div class=\"flow step node tru\" \n      <div class=\"flow step num\" 1</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" MAKER (Alice: Desktop)</div \n        <div class=\"flow step desc\" Submits Signed <code SELL TRU</code  Order with UTXO ownership proof via WebSocket</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc WebSocket (JSON Text Frames)</div \n\n    <div class=\"diagram node node app\" \n      <div class=\"node badge\" \u26a1 TRUSWAP ORDERBOOK RELAY SERVICE</div \n      <div class=\"node title\" Verification & In Memory Matching</div \n      <div class=\"node tags grid\" \n        <div class=\"feature tag\" ConnectionGuard (Per IP limits)</div \n        <div class=\"feature tag\" UtxoGuard (Live PoW UTXO check)</div \n        <div class=\"feature tag\" BaseWatcher (Base USDC check)</div \n        <div class=\"feature tag\" In Memory Book (Instant match)</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc Real time JSON Broadcast Event Stream</div \n\n    <div class=\"flow step node base\" \n      <div class=\"flow step num\" 2</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" TAKER (Bob: Android)</div \n        <div class=\"flow step desc\" Receives instant orderbook update, clicks Swap, and locks Base USDC in BaseHTLC</div \n      </div \n    </div \n  </div \n</div \n\n    Relay Capacity Profiles:\nRelay operators can select an operating profile based on intended server scale:\n    Standard Profile   (   blazing ): Default setting for personal nodes and smaller networks (supports up to 5,000 concurrent client streams).\n    High Capacity Server Profile   (   ultrablazing ): Setting for public relay infrastructure. Automatically configures Linux operating system limits ( tune kernel limits() ) to 1,048,576 file descriptors to handle high connection volume.\n\n   \n\n   3. Cryptographic Order Structure ( src/relay/protocol.rs )\n\nOrders submitted to a relay are cryptographically signed by the creator using standard JSON payloads:\n\n   json\n{\n  \"order id\": \"8a3f91c2...64hex\",\n  \"side\": \"SELL TRU\",\n  \"amount tru\": 500.0,\n  \"amount usdc\": 25.0,\n  \"price\": 0.05,\n  \"hash160 hex\": \"3f91c28a...40hex\",\n  \"timelock\": 1790900000,\n  \"maker tru address\": \"T...\",\n  \"maker tru pubkey\": \"03a1b2...\",\n  \"maker base address\": \"0x1111111111111111111111111111111111111111\",\n  \"signature base\": \"0x4b2c...\",\n  \"signature tru\": null,\n  \"created at\": 1790800000,\n  \"is matched\": false\n}\n   \n\n    Order Verification Rules:\n1.   Base Signature Verification  : The relay runs ECDSA  ecrecover  on  signature base  using the EIP 191 personal sign standard. The recovered address must match  maker base address .\n2.   TRU Signature Verification  : If  signature tru  is provided, the relay verifies the SECP256k1 signature against  maker tru address .\n3.   Payload Immutability  :  order id  is computed from the order fields. Modifying amounts, prices, addresses, or timelocks breaks the signature and causes the order to be rejected.\n\n   \n\n   4. Relay Messaging Protocol (JSON over WebSockets)\n\nAll communication between clients and the relay mesh uses human readable, UTF 8 JSON text messages:\n\n    Client Commands ( ClientMessage ):\n    Submit Order  :\n     json\n  {\n    \"action\": \"SubmitOrder\",\n    \"payload\": {\n      \"order id\": \"8a3f...\",\n      \"side\": \"SELL TRU\",\n      \"amount tru\": 500.0,\n      \"amount usdc\": 25.0,\n      \"hash160 hex\": \"3f91...\",\n      \"timelock\": 1790900000,\n      \"maker tru address\": \"T...\",\n      \"maker base address\": \"0x...\",\n      \"signature base\": \"0x...\"\n    }\n  }\n     \n    Cancel Order  :\n     json\n  {\n    \"action\": \"CancelOrder\",\n    \"payload\": {\n      \"order id\": \"8a3f...\",\n      \"maker base address\": \"0x...\",\n      \"signature base\": \"0x...\"\n    }\n  }\n     \n    Take Order  :\n     json\n  {\n    \"action\": \"TakeOrder\",\n    \"payload\": {\n      \"order id\": \"8a3f...\",\n      \"taker base address\": \"0x...\",\n      \"taker tru address\": \"T...\",\n      \"signature base\": \"0x...\"\n    }\n  }\n     \n    Ping / Liveness  :\n     json\n  {\n    \"action\": \"Ping\"\n  }\n     \n\n    Relay Broadcast Events ( RelayBroadcastEvent ):\n    Orderbook Snapshot  : Pushed immediately when a client connects, containing all currently active orders, server timestamp, and operational mode.\n    Order Added  : Broadcast when a verified order is submitted to the book.\n    Order Removed  : Broadcast when an order is cancelled by its maker or taken by a counterparty.\n    Order Matched  : Broadcast to notify participants that a taker has initiated the atomic swap escrow.\n    Pong  : Heartbeat reply confirming connection health.\n    Error  : Returned when an invalid payload or unauthorized action occurs:\n     json\n  {\n    \"event\": \"Error\",\n    \"data\": {\n      \"code\": \"INVALID SIGNATURE\",\n      \"message\": \"Recovered address does not match maker base address\"\n    }\n  }\n     \n\n   \n\n   5. Network Connectivity & Firewall Traversal\n\n    Standard Outbound Ports  : Clients connect over outbound TCP ports  80  ( ws:// ) or  443  ( wss:// ), allowing the app to function on standard home broadband, office networks, and mobile data (4G/5G).\n    No Port Forwarding  : Users do not need to configure router settings, UPnP, or dynamic DNS to trade.\n    Auto Reconnect  : The client automatically reconnects with exponential backoff if a connection drops during network changes.\n\n   \n\n   6. How the Orderbook Appears in the User Interface\n\nThe P2P orderbook relay mesh feeds directly into the interactive Exchange Trading Cockpit on  http://127.0.0.1:8899 :\n\n1.   Spot Limit Order (Top Card)  :\n        [Buy TRU]  /  [Sell TRU]  Direction Switcher  : Toggle your trade intent with a single click.\n       Available Balance  : Reflects spendable funds in your local vault (Base USDC for buying, TRU for selling).\n       Price per 1 TRU  : Set your limit price in USDC. Click the   Best Price   hint to automatically fill the lowest current ask or highest bid.\n       Interactive Percentage Sliders ( 25% ,  50% ,  75% ,  100% )  : Smooth sliders with snap marks allow precise allocation of your available vault balance without typing numbers manually.\n       Dynamic Action Button  : Reads  Enter Amount & Price  when inputs are empty, updating automatically to  Buy TRU  or  Sell TRU  once amounts are specified. Clicking signs the order with your local private key and pushes it to the relay via WebSocket.\n\n2.   TRU / USDC Spot (Bottom Orderbook Terminal)  :\n        \ud83d\udcca Book  Tab  : Unified orderbook view showing market spread and depth.\n        \ud83d\udd34 Asks  Tab  : Lists open sell offers. To buy TRU immediately, click   [Swap]   on any row to open the Take Order Modal.\n        \ud83d\udfe2 Bids  Tab  : Lists open buy offers. To sell TRU immediately, click   [Swap]   to accept the offer.\n        \ud83d\udd04 In Progress  Tab  : Real time tracker for executing atomic swaps. Active trades display step badges (e.g.  Locking TRU ,  Confirming ,  Claiming ). Clicking any trade opens the   Automation Audit Modal   with live terminal telemetry.\n        \ud83d\udcdc History  Tab  : Log of settled swaps and verified on chain HTLC contracts.\n       Order Cancellation  : If you posted an active order, it shows a red   [Cancel]   button in the table so you can withdraw it from the relay at any time. All updates sync instantly across clients via JSON WebSockets without page reloads.\n"}, {"id": "09_mobile_ndk_hardware", "num": "09", "file": "09_mobile_ndk_hardware.md", "title": "9. NDK Camera & Hardware", "icon": "\ud83d\udcf7", "words": 757, "read_time": "4 min read", "html": "<h1 id=\"chapter-9-native-mobile-engine-ndk-camera-scanner\" class=\"doc-heading doc-h1\">Chapter 9: Native Mobile Engine &amp; NDK Camera Scanner<a class=\"anchor-link\" href=\"#chapter-9-native-mobile-engine-ndk-camera-scanner\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter explains how TRUSWAP interacts directly with mobile device hardware on Android, focusing on the native camera QR scanner and performance optimizations.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-mobile-hardware-fundamentals-for-beginners\" class=\"doc-heading doc-h2\">1. Mobile Hardware Fundamentals (For Beginners)<a class=\"anchor-link\" href=\"#1-mobile-hardware-fundamentals-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"why-qr-scanning-matters\" class=\"doc-heading doc-h3\">Why QR Scanning Matters<a class=\"anchor-link\" href=\"#why-qr-scanning-matters\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Cryptocurrency addresses (like <code>0x526A...</code> on Base or <code>TFtW...</code> on TRU) are long strings of letters and numbers. Typing them manually on a smartphone touchscreen is slow and mistakes can result in permanently lost funds. Scanning a QR code provides instant, error-free address entry.</p>\n<h3 id=\"why-truswap-s-camera-engine-is-different\" class=\"doc-heading doc-h3\">Why TRUSWAP&#x27;s Camera Engine is Different<a class=\"anchor-link\" href=\"#why-truswap-s-camera-engine-is-different\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Most cryptocurrency mobile apps rely on large third-party libraries (such as Google Play Services ML Kit or Java ZXing). These libraries add tens of megabytes of overhead, often introduce tracking telemetry, and can cause noticeable camera startup lag.</p>\n<p class=\"doc-para\">TRUSWAP takes a native approach:</p>\n<ul class=\"doc-list\">\n<li><strong>Direct System Access</strong>: Uses Android&#x27;s Native Development Kit (NDK) to talk directly to the camera hardware in native Rust.</li>\n<li><strong>Fast Detection</strong>: Analyzes raw camera sensor frames in memory, detecting addresses in under 5 milliseconds.</li>\n<li><strong>Battery Friendly</strong>: The moment a QR code is recognized, the camera sensor is powered down immediately.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"2-hardware-architecture-data-flow\" class=\"doc-heading doc-h2\">2. Hardware Architecture &amp; Data Flow<a class=\"anchor-link\" href=\"#2-hardware-architecture-data-flow\" title=\"Direct Link\">#</a></h2>\n<div class=\"cyber-diagram-box\">\n  <div class=\"diagram-title-bar\">\n    <span class=\"diagram-tag\">NDK PIPELINE</span>\n    <span class=\"diagram-heading\">Android Hardware Camera & Native QR Flow</span>\n  </div>\n  <div class=\"flow-steps\">\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">1</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">Android Hardware Camera Sensor</div>\n        <div class=\"flow-step-desc\">Physical back-facing camera opened directly via NDK Camera2 API with continuous auto-focus enabled</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Raw YUV_420_888 Frame Stream</div>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">2</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">AImageReader (Native C / NDK)</div>\n        <div class=\"flow-step-desc\">Captures 640 x 480 @ 30 FPS with zero-copy direct access to Plane 0 (Y / Luminance grayscale buffer)</div>\n      </div>\n    </div>\n    <div class=\"diagram-grid-2\" style=\"margin: 8px 0;\">\n      <div class=\"diagram-node node-tru\">\n        <div class=\"node-badge\">\u26a1 RUST QR DECODER (RQRR)</div>\n        <div class=\"node-title\">Full 30 FPS Processing</div>\n        <div class=\"node-desc\">0\u00b0 and 90\u00b0 portrait scans on raw Y buffer. Fires address match immediately upon detection.</div>\n      </div>\n      <div class=\"diagram-node node-base\">\n        <div class=\"node-badge\">\ud83d\uddbc\ufe0f JPEG ENCODER (NATIVE)</div>\n        <div class=\"node-title\">3-5 FPS Preview Throttling</div>\n        <div class=\"node-desc\">Compresses preview frames to base64 data URIs for smooth, battery-efficient viewfinder rendering.</div>\n      </div>\n    </div>\n    <div class=\"flow-connector\">\u25bc Local WebSocket Broadcast (ws://127.0.0.1:port)</div>\n    <div class=\"flow-step node-app\">\n      <div class=\"flow-step-num\">3</div>\n      <div class=\"flow-step-content\">\n        <div class=\"flow-step-title\">WebView Frontend (HTML5 UI)</div>\n        <div class=\"flow-step-desc\">Displays live preview; on match event: plays audio tone, vibrates device, closes modal, and auto-fills address.</div>\n      </div>\n    </div>\n  </div>\n</div>\n<hr class=\"doc-divider\">\n<h2 id=\"3-ndk-camera2-technical-implementation-src-ndk-camera-rs\" class=\"doc-heading doc-h2\">3. NDK Camera2 Technical Implementation (<code>src/ndk_camera.rs</code>)<a class=\"anchor-link\" href=\"#3-ndk-camera2-technical-implementation-src-ndk-camera-rs\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The camera scanner runs in an isolated OS background thread using Android&#x27;s native C headers:</p>\n<ul class=\"doc-list\">\n<li><code>&lt;camera/NdkCameraManager.h&gt;</code></li>\n<li><code>&lt;camera/NdkCameraDevice.h&gt;</code></li>\n<li><code>&lt;camera/NdkCaptureRequest.h&gt;</code></li>\n<li><code>&lt;media/NdkImageReader.h&gt;</code></li>\n<li><code>&lt;media/NdkImage.h&gt;</code></li>\n</ul>\n<h3 id=\"technical-design\" class=\"doc-heading doc-h3\">Technical Design:<a class=\"anchor-link\" href=\"#technical-design\" title=\"Direct Link\">#</a></h3>\n<ol class=\"doc-list\">\n<li><strong>Zero-Copy Luminance Extraction</strong>:</li>\n</ol>\n<p class=\"doc-para\">QR code decoding requires only brightness (luminance) data, not color. TRUSWAP extracts Plane 0 (the Y plane) directly from <code>AImage_getPlaneData</code>, avoiding the CPU overhead of converting YUV to RGB color spaces.</p>\n<ol class=\"doc-list\">\n<li><strong>Sensor Rotation Handling</strong>:</li>\n</ol>\n<p class=\"doc-para\">Mobile camera sensors are mounted in landscape orientation (a 90\u00b0 clockwise offset relative to normal portrait phone use). The pure-Rust <code>rqrr</code> engine scans both standard and 90\u00b0-rotated coordinate spaces:</p>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">RUST</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-rust\">   // Rotate 90 degrees clockwise to decode portrait-oriented QR codes\n   let mut prep_rot = rqrr::PreparedImage::prepare_from_greyscale(h, w, |rx, ry| {\n       luma[(w - 1 - ry) * w + rx]\n   });</code></pre></div>\n<ol class=\"doc-list\">\n<li><strong>Continuous Auto-Focus</strong>:</li>\n</ol>\n<p class=\"doc-para\">The capture request configures <code>ACAMERA_CONTROL_AF_MODE_CONTINUOUS_PICTURE</code> so QR codes at varying distances resolve clearly without requiring manual tap-to-focus.</p>\n<ol class=\"doc-list\">\n<li><strong>Immediate Sensor Release</strong>:</li>\n</ol>\n<p class=\"doc-para\">As soon as a valid address is parsed:</p>\n<ul class=\"doc-list\">\n<li><code>ACaptureSession_stopRepeating</code> is called immediately.</li>\n<li><code>ACameraDevice_close</code> releases the camera hardware back to the operating system.</li>\n<li>The address string is populated into the active input field.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"4-how-the-camera-scanner-works-in-the-user-interface\" class=\"doc-heading doc-h2\">4. How the Camera Scanner Works in the User Interface<a class=\"anchor-link\" href=\"#4-how-the-camera-scanner-works-in-the-user-interface\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">The NDK camera engine is connected directly to the user interface:</p>\n<ol class=\"doc-list\">\n<li><strong>Address Input Camera Buttons</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Next to destination address fields (such as in the <strong>TRU Withdraw Modal</strong>), a camera icon button allows one-tap scanning.</li>\n<li>Tapping the icon calls <code>openQrScanner()</code>, which awakens the native camera pipeline.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>The Scanner Viewfinder Overlay (<code>#qr-scanner-modal</code>)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>A modal dialog appears showing the live camera feed with an alignment guide.</li>\n<li><strong>Flip Camera Button (<code>\ud83d\udcf7</code>)</strong>: Switches between rear and front camera sensors.</li>\n<li><strong>Flashlight / Torch Toggle (<code>\ud83d\udca1</code>)</strong>: Turns on the phone&#x27;s LED flashlight to scan QR codes in low-light environments.</li>\n<li><strong>Close Button (<code>\u2715</code>)</strong>: Closes the overlay and releases the camera hardware.</li>\n</ul>\n<ol class=\"doc-list\">\n<li><strong>Instant Recognition &amp; Audio Feedback</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>The moment a valid TRU (<code>T...</code>) or Base (<code>0x...</code>) address is recognized, TRUSWAP plays a short acoustic confirmation chime.</li>\n<li>The decoded address is automatically entered into the destination input field, the camera powers off, and the scanner modal closes smoothly without requiring additional taps.</li>\n</ul>", "raw_text": "  Chapter 9: Native Mobile Engine & NDK Camera Scanner\n\nThis chapter explains how TRUSWAP interacts directly with mobile device hardware on Android, focusing on the native camera QR scanner and performance optimizations.\n\n   \n\n   1. Mobile Hardware Fundamentals (For Beginners)\n\n    Why QR Scanning Matters\nCryptocurrency addresses (like  0x526A...  on Base or  TFtW...  on TRU) are long strings of letters and numbers. Typing them manually on a smartphone touchscreen is slow and mistakes can result in permanently lost funds. Scanning a QR code provides instant, error free address entry.\n\n    Why TRUSWAP's Camera Engine is Different\nMost cryptocurrency mobile apps rely on large third party libraries (such as Google Play Services ML Kit or Java ZXing). These libraries add tens of megabytes of overhead, often introduce tracking telemetry, and can cause noticeable camera startup lag.\n\nTRUSWAP takes a native approach:\n    Direct System Access  : Uses Android's Native Development Kit (NDK) to talk directly to the camera hardware in native Rust.\n    Fast Detection  : Analyzes raw camera sensor frames in memory, detecting addresses in under 5 milliseconds.\n    Battery Friendly  : The moment a QR code is recognized, the camera sensor is powered down immediately.\n\n   \n\n   2. Hardware Architecture & Data Flow\n\n<div class=\"cyber diagram box\" \n  <div class=\"diagram title bar\" \n    <span class=\"diagram tag\" NDK PIPELINE</span \n    <span class=\"diagram heading\" Android Hardware Camera & Native QR Flow</span \n  </div \n\n  <div class=\"flow steps\" \n    <div class=\"flow step\" \n      <div class=\"flow step num\" 1</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" Android Hardware Camera Sensor</div \n        <div class=\"flow step desc\" Physical back facing camera opened directly via NDK Camera2 API with continuous auto focus enabled</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc Raw YUV 420 888 Frame Stream</div \n\n    <div class=\"flow step\" \n      <div class=\"flow step num\" 2</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" AImageReader (Native C / NDK)</div \n        <div class=\"flow step desc\" Captures 640 x 480 @ 30 FPS with zero copy direct access to Plane 0 (Y / Luminance grayscale buffer)</div \n      </div \n    </div \n\n    <div class=\"diagram grid 2\" style=\"margin: 8px 0;\" \n      <div class=\"diagram node node tru\" \n        <div class=\"node badge\" \u26a1 RUST QR DECODER (RQRR)</div \n        <div class=\"node title\" Full 30 FPS Processing</div \n        <div class=\"node desc\" 0\u00b0 and 90\u00b0 portrait scans on raw Y buffer. Fires address match immediately upon detection.</div \n      </div \n\n      <div class=\"diagram node node base\" \n        <div class=\"node badge\" \ud83d\uddbc\ufe0f JPEG ENCODER (NATIVE)</div \n        <div class=\"node title\" 3 5 FPS Preview Throttling</div \n        <div class=\"node desc\" Compresses preview frames to base64 data URIs for smooth, battery efficient viewfinder rendering.</div \n      </div \n    </div \n\n    <div class=\"flow connector\" \u25bc Local WebSocket Broadcast (ws://127.0.0.1:port)</div \n\n    <div class=\"flow step node app\" \n      <div class=\"flow step num\" 3</div \n      <div class=\"flow step content\" \n        <div class=\"flow step title\" WebView Frontend (HTML5 UI)</div \n        <div class=\"flow step desc\" Displays live preview; on match event: plays audio tone, vibrates device, closes modal, and auto fills address.</div \n      </div \n    </div \n  </div \n</div \n\n   \n\n   3. NDK Camera2 Technical Implementation ( src/ndk camera.rs )\n\nThe camera scanner runs in an isolated OS background thread using Android's native C headers:\n   <camera/NdkCameraManager.h  \n   <camera/NdkCameraDevice.h  \n   <camera/NdkCaptureRequest.h  \n   <media/NdkImageReader.h  \n   <media/NdkImage.h  \n\n    Technical Design:\n\n1.   Zero Copy Luminance Extraction  :\n   QR code decoding requires only brightness (luminance) data, not color. TRUSWAP extracts Plane 0 (the Y plane) directly from  AImage getPlaneData , avoiding the CPU overhead of converting YUV to RGB color spaces.\n2.   Sensor Rotation Handling  :\n   Mobile camera sensors are mounted in landscape orientation (a 90\u00b0 clockwise offset relative to normal portrait phone use). The pure Rust  rqrr  engine scans both standard and 90\u00b0 rotated coordinate spaces:\n      rust\n   // Rotate 90 degrees clockwise to decode portrait oriented QR codes\n   let mut prep rot = rqrr::PreparedImage::prepare from greyscale(h, w,  rx, ry  {\n       luma[(w   1   ry)   w + rx]\n   });\n      \n3.   Continuous Auto Focus  :\n   The capture request configures  ACAMERA CONTROL AF MODE CONTINUOUS PICTURE  so QR codes at varying distances resolve clearly without requiring manual tap to focus.\n4.   Immediate Sensor Release  :\n   As soon as a valid address is parsed:\n      ACaptureSession stopRepeating  is called immediately.\n      ACameraDevice close  releases the camera hardware back to the operating system.\n     The address string is populated into the active input field.\n\n   \n\n   4. How the Camera Scanner Works in the User Interface\n\nThe NDK camera engine is connected directly to the user interface:\n\n1.   Address Input Camera Buttons  :\n     Next to destination address fields (such as in the   TRU Withdraw Modal  ), a camera icon button allows one tap scanning.\n     Tapping the icon calls  openQrScanner() , which awakens the native camera pipeline.\n\n2.   The Scanner Viewfinder Overlay (  qr scanner modal )  :\n     A modal dialog appears showing the live camera feed with an alignment guide.\n       Flip Camera Button ( \ud83d\udcf7 )  : Switches between rear and front camera sensors.\n       Flashlight / Torch Toggle ( \ud83d\udca1 )  : Turns on the phone's LED flashlight to scan QR codes in low light environments.\n       Close Button ( \u2715 )  : Closes the overlay and releases the camera hardware.\n\n3.   Instant Recognition & Audio Feedback  :\n     The moment a valid TRU ( T... ) or Base ( 0x... ) address is recognized, TRUSWAP plays a short acoustic confirmation chime.\n     The decoded address is automatically entered into the destination input field, the camera powers off, and the scanner modal closes smoothly without requiring additional taps.\n"}, {"id": "10_security_model_and_threat_analysis", "num": "10", "file": "10_security_model_and_threat_analysis.md", "title": "10. Security & Threat Model", "icon": "\ud83d\udee1\ufe0f", "words": 884, "read_time": "4 min read", "html": "<h1 id=\"chapter-10-security-model-threat-analysis\" class=\"doc-heading doc-h1\">Chapter 10: Security Model &amp; Threat Analysis<a class=\"anchor-link\" href=\"#chapter-10-security-model-threat-analysis\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter outlines the security assumptions, potential threat vectors, and cryptographic protections implemented in TRUSWAP, explained for everyday users and security researchers.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-security-overview-for-beginners\" class=\"doc-heading doc-h2\">1. Security Overview (For Beginners)<a class=\"anchor-link\" href=\"#1-security-overview-for-beginners\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"can-i-lose-my-money-if-the-other-person-cheats-or-disconnects\" class=\"doc-heading doc-h3\">Can I lose my money if the other person cheats or disconnects?<a class=\"anchor-link\" href=\"#can-i-lose-my-money-if-the-other-person-cheats-or-disconnects\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\"><strong>No.</strong> The atomic swap protocol relies on mathematics rather than trust:</p>\n<ul class=\"doc-list\">\n<li>Either the complete swap finishes and both people receive their new coins, OR</li>\n<li>The trade cancels and both people receive their original deposits back.</li>\n<li>There is no scenario where the other person can take your money without revealing the secret that allows you to take theirs.</li>\n</ul>\n<h3 id=\"what-happens-if-my-device-loses-power-or-internet-during-a-trade\" class=\"doc-heading doc-h3\">What happens if my device loses power or internet during a trade?<a class=\"anchor-link\" href=\"#what-happens-if-my-device-loses-power-or-internet-during-a-trade\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">All active trade states, cryptographic keys, and secret preimages are saved to your local disk in <code>vault.dat</code>:</p>\n<ul class=\"doc-list\">\n<li>When you reconnect your internet and reopen TRUSWAP, the app automatically inspects the blockchains.</li>\n<li>If the other person completed their side of the trade, TRUSWAP claims your coins.</li>\n<li>If the trade was abandoned and the timer has expired, TRUSWAP presents the refund button to retrieve your deposit.</li>\n</ul>\n<h3 id=\"can-someone-change-the-price-while-the-trade-is-happening\" class=\"doc-heading doc-h3\">Can someone change the price while the trade is happening?<a class=\"anchor-link\" href=\"#can-someone-change-the-price-while-the-trade-is-happening\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\"><strong>No.</strong> The trade amount and exchange price are permanently locked into the smart contract and transaction scripts at the start of the trade. Neither party can alter the terms once the contracts are created.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"2-core-security-invariants-for-developers\" class=\"doc-heading doc-h2\">2. Core Security Invariants (For Developers)<a class=\"anchor-link\" href=\"#2-core-security-invariants-for-developers\" title=\"Direct Link\">#</a></h2>\n<ol class=\"doc-list\">\n<li><strong>Solvency Invariant</strong>: An honest participant never loses their deposited principal without receiving the agreed counterparty asset, provided they broadcast their claim or refund transaction before the respective timelock window expires.</li>\n<li><strong>Key Exclusivity</strong>: Private keys are generated locally via CSPRNG, never leave process memory, and are never transmitted over network sockets or written to logs.</li>\n<li><strong>Decentralized Operation</strong>: The system does not depend on any central operator or matching engine; users can interact directly or deploy private relays.</li>\n</ol>\n<hr class=\"doc-divider\">\n<h2 id=\"3-threat-vectors-and-protocol-mitigations\" class=\"doc-heading doc-h2\">3. Threat Vectors and Protocol Mitigations<a class=\"anchor-link\" href=\"#3-threat-vectors-and-protocol-mitigations\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"vector-a-the-free-option-problem-preimage-extortion\" class=\"doc-heading doc-h3\">Vector A: The &quot;Free Option&quot; Problem &amp; Preimage Extortion<a class=\"anchor-link\" href=\"#vector-a-the-free-option-problem-preimage-extortion\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>The Threat</strong>: A taker waits until the final minutes of a lock period to see if market prices fluctuate. If the price moves favorably, they claim; if the price drops, they let the trade expire, treating the lock as a free financial option.</li>\n<li><strong>Protocol Mitigation</strong>:</li>\n<li><strong>Timelock Asymmetry</strong>: The Taker&#x27;s timelock ($T_2$) expires substantially earlier than the Maker&#x27;s timelock ($T_1$):</li>\n</ul>\n<p class=\"doc-para\">$$T_1 - T_2 \\ge \\Delta_{\\text{safety}} \\quad (\\text{typically } 24 \\text{ hours})$$</p>\n<ul class=\"doc-list\">\n<li>The Maker is motivated to claim their funds before $T_2$ expires. The moment the Maker claims, the secret is published on-chain, giving the Taker a guaranteed 24-hour window to claim their TRU deposit on the Proof-of-Work chain before $T_1$ expires.</li>\n</ul>\n<h3 id=\"vector-b-blockchain-reorganizations-51-attacks\" class=\"doc-heading doc-h3\">Vector B: Blockchain Reorganizations (51% Attacks)<a class=\"anchor-link\" href=\"#vector-b-blockchain-reorganizations-51-attacks\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>The Threat</strong>: An attacker deposits funds into an HTLC, waits for the counterparty to lock funds on the other chain, and then mines a private chain reorganization to erase their initial deposit transaction.</li>\n<li><strong>Protocol Mitigation</strong>:</li>\n<li><strong>TRU PoW Depth</strong>: The client enforces a <strong>6-block confirmation threshold</strong> via <code>ConfirmationGuard</code> before the counterparty contract is deployed on Base.</li>\n<li><strong>Base Finality</strong>: The client verifies RPC block receipts and L1 settlement before treating EVM transactions as finalized.</li>\n</ul>\n<h3 id=\"vector-c-timelock-griefing-fake-liquidity\" class=\"doc-heading doc-h3\">Vector C: Timelock Griefing &amp; Fake Liquidity<a class=\"anchor-link\" href=\"#vector-c-timelock-griefing-fake-liquidity\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>The Threat</strong>: A malicious user floods the orderbook with fictitious buy or sell offers to lock up honest traders&#x27; liquidity in expired contracts.</li>\n<li><strong>Protocol Mitigation</strong>:</li>\n<li><strong>UtxoGuard</strong>: The relay validates that makers creating <code>SELL_TRU</code> orders provably own confirmed unspent outputs on the TRU blockchain.</li>\n<li><strong>BaseWatcher</strong>: The relay verifies that makers creating <code>BUY_TRU</code> orders hold adequate USDC balance and contract allowance on Base.</li>\n<li><strong>ConnectionGuard</strong>: Enforces connection quotas and order submission rate limits per IP address.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"4-cryptographic-system-security\" class=\"doc-heading doc-h2\">4. Cryptographic &amp; System Security<a class=\"anchor-link\" href=\"#4-cryptographic-system-security\" title=\"Direct Link\">#</a></h2>\n<ul class=\"doc-list\">\n<li><strong>Constant-Time Verification</strong>: Preimage comparisons ($\\text{ripemd160}(\\text{sha256}(S)) == \\text{hash160}$) are executed using constant-time equality checks to mitigate timing side-channel attacks.</li>\n<li><strong>Short Memory Lifetimes</strong>: Private keys are instantiated only during signature production and dropped immediately afterward.</li>\n<li><strong>Strict POSIX Permissions (<code>0o600</code>)</strong>: On Unix, Linux, and Android systems, the master key (<code>.vault.key</code>) and vault database (<code>vault.dat</code>) are created with <code>0o600</code> permissions (read/write access restricted to the process owner).</li>\n<li><strong>Local Loopback API Binding</strong>: The embedded daemon binds exclusively to <code>127.0.0.1</code> to prevent unauthorized local network access, with incoming WebSocket handshake validation against Cross-Site WebSocket Hijacking (CSWSH).</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"5-security-transparency-in-the-user-interface\" class=\"doc-heading doc-h2\">5. Security Transparency in the User Interface<a class=\"anchor-link\" href=\"#5-security-transparency-in-the-user-interface\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP gives users direct visual tools to verify security invariants:</p>\n<ol class=\"doc-list\">\n<li><strong>Automation Audit Modal</strong>:</li>\n</ol>\n<p class=\"doc-para\">Clicking any active swap in the <strong>\ud83d\udd04 In-Progress</strong> tab opens the audit dialog. Users can inspect the exact HASH160 digest, watch the confirmation counter increment toward 6 blocks, and see raw blockchain transaction hashes.</p>\n<ol class=\"doc-list\">\n<li><strong>Explicit Timelock Countdown &amp; Refund Button</strong>:</li>\n</ol>\n<p class=\"doc-para\">Every in-progress swap tracks the elapsed blockchain time. If a counterparty disconnects or fails to claim before their deadline, the UI status switches to <code>Expired</code> and displays an active <strong>[Refund]</strong> button to immediately reclaim locked funds.</p>\n<ol class=\"doc-list\">\n<li><strong>UTXO Ledger Isolation</strong>:</li>\n</ol>\n<p class=\"doc-para\">In the <strong>UTXO Ledger</strong> modal, outputs locked in active HTLC scripts are visually tagged and deducted from spendable balances, ensuring funds in flight cannot be accidentally spent elsewhere.</p>\n<ol class=\"doc-list\">\n<li><strong>Independent On-Chain Verification</strong>:</li>\n</ol>\n<p class=\"doc-para\">All contract interactions provide direct links to the built-in <strong>TRU Block Explorer</strong> (<code>/explorer</code>) and <strong>BaseScan</strong>, allowing traders to verify state on public ledgers independently.</p>", "raw_text": "  Chapter 10: Security Model & Threat Analysis\n\nThis chapter outlines the security assumptions, potential threat vectors, and cryptographic protections implemented in TRUSWAP, explained for everyday users and security researchers.\n\n   \n\n   1. Security Overview (For Beginners)\n\n    Can I lose my money if the other person cheats or disconnects?\n  No.   The atomic swap protocol relies on mathematics rather than trust:\n  Either the complete swap finishes and both people receive their new coins, OR\n  The trade cancels and both people receive their original deposits back.\n  There is no scenario where the other person can take your money without revealing the secret that allows you to take theirs.\n\n    What happens if my device loses power or internet during a trade?\nAll active trade states, cryptographic keys, and secret preimages are saved to your local disk in  vault.dat :\n  When you reconnect your internet and reopen TRUSWAP, the app automatically inspects the blockchains.\n  If the other person completed their side of the trade, TRUSWAP claims your coins.\n  If the trade was abandoned and the timer has expired, TRUSWAP presents the refund button to retrieve your deposit.\n\n    Can someone change the price while the trade is happening?\n  No.   The trade amount and exchange price are permanently locked into the smart contract and transaction scripts at the start of the trade. Neither party can alter the terms once the contracts are created.\n\n   \n\n   2. Core Security Invariants (For Developers)\n\n1.   Solvency Invariant  : An honest participant never loses their deposited principal without receiving the agreed counterparty asset, provided they broadcast their claim or refund transaction before the respective timelock window expires.\n2.   Key Exclusivity  : Private keys are generated locally via CSPRNG, never leave process memory, and are never transmitted over network sockets or written to logs.\n3.   Decentralized Operation  : The system does not depend on any central operator or matching engine; users can interact directly or deploy private relays.\n\n   \n\n   3. Threat Vectors and Protocol Mitigations\n\n    Vector A: The \"Free Option\" Problem & Preimage Extortion\n    The Threat  : A taker waits until the final minutes of a lock period to see if market prices fluctuate. If the price moves favorably, they claim; if the price drops, they let the trade expire, treating the lock as a free financial option.\n    Protocol Mitigation  :\n      Timelock Asymmetry  : The Taker's timelock ($T 2$) expires substantially earlier than the Maker's timelock ($T 1$):\n    $$T 1   T 2 \\ge \\Delta {\\text{safety}} \\quad (\\text{typically } 24 \\text{ hours})$$\n    The Maker is motivated to claim their funds before $T 2$ expires. The moment the Maker claims, the secret is published on chain, giving the Taker a guaranteed 24 hour window to claim their TRU deposit on the Proof of Work chain before $T 1$ expires.\n\n    Vector B: Blockchain Reorganizations (51% Attacks)\n    The Threat  : An attacker deposits funds into an HTLC, waits for the counterparty to lock funds on the other chain, and then mines a private chain reorganization to erase their initial deposit transaction.\n    Protocol Mitigation  :\n      TRU PoW Depth  : The client enforces a   6 block confirmation threshold   via  ConfirmationGuard  before the counterparty contract is deployed on Base.\n      Base Finality  : The client verifies RPC block receipts and L1 settlement before treating EVM transactions as finalized.\n\n    Vector C: Timelock Griefing & Fake Liquidity\n    The Threat  : A malicious user floods the orderbook with fictitious buy or sell offers to lock up honest traders' liquidity in expired contracts.\n    Protocol Mitigation  :\n      UtxoGuard  : The relay validates that makers creating  SELL TRU  orders provably own confirmed unspent outputs on the TRU blockchain.\n      BaseWatcher  : The relay verifies that makers creating  BUY TRU  orders hold adequate USDC balance and contract allowance on Base.\n      ConnectionGuard  : Enforces connection quotas and order submission rate limits per IP address.\n\n   \n\n   4. Cryptographic & System Security\n\n    Constant Time Verification  : Preimage comparisons ($\\text{ripemd160}(\\text{sha256}(S)) == \\text{hash160}$) are executed using constant time equality checks to mitigate timing side channel attacks.\n    Short Memory Lifetimes  : Private keys are instantiated only during signature production and dropped immediately afterward.\n    Strict POSIX Permissions ( 0o600 )  : On Unix, Linux, and Android systems, the master key ( .vault.key ) and vault database ( vault.dat ) are created with  0o600  permissions (read/write access restricted to the process owner).\n    Local Loopback API Binding  : The embedded daemon binds exclusively to  127.0.0.1  to prevent unauthorized local network access, with incoming WebSocket handshake validation against Cross Site WebSocket Hijacking (CSWSH).\n\n   \n\n   5. Security Transparency in the User Interface\n\nTRUSWAP gives users direct visual tools to verify security invariants:\n\n1.   Automation Audit Modal  :\n   Clicking any active swap in the   \ud83d\udd04 In Progress   tab opens the audit dialog. Users can inspect the exact HASH160 digest, watch the confirmation counter increment toward 6 blocks, and see raw blockchain transaction hashes.\n2.   Explicit Timelock Countdown & Refund Button  :\n   Every in progress swap tracks the elapsed blockchain time. If a counterparty disconnects or fails to claim before their deadline, the UI status switches to  Expired  and displays an active   [Refund]   button to immediately reclaim locked funds.\n3.   UTXO Ledger Isolation  :\n   In the   UTXO Ledger   modal, outputs locked in active HTLC scripts are visually tagged and deducted from spendable balances, ensuring funds in flight cannot be accidentally spent elsewhere.\n4.   Independent On Chain Verification  :\n   All contract interactions provide direct links to the built in   TRU Block Explorer   ( /explorer ) and   BaseScan  , allowing traders to verify state on public ledgers independently.\n"}, {"id": "11_troubleshooting_and_faq", "num": "11", "file": "11_troubleshooting_and_faq.md", "title": "11. Troubleshooting & FAQ", "icon": "\u2753", "words": 892, "read_time": "4 min read", "html": "<h1 id=\"chapter-11-troubleshooting-faq-configuration\" class=\"doc-heading doc-h1\">Chapter 11: Troubleshooting, FAQ &amp; Configuration<a class=\"anchor-link\" href=\"#chapter-11-troubleshooting-faq-configuration\" title=\"Direct Link\">#</a></h1>\n<p class=\"doc-para\">This chapter provides answers to common user questions, solutions to error messages, and a complete command-line reference for operators.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"1-frequently-asked-questions-faq\" class=\"doc-heading doc-h2\">1. Frequently Asked Questions (FAQ)<a class=\"anchor-link\" href=\"#1-frequently-asked-questions-faq\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"how-much-does-it-cost-to-use-truswap\" class=\"doc-heading doc-h3\">How much does it cost to use TRUSWAP?<a class=\"anchor-link\" href=\"#how-much-does-it-cost-to-use-truswap\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\"><strong>TRUSWAP charges 0.00% protocol fees.</strong></p>\n<p class=\"doc-para\">There are no exchange commissions, registration costs, or deposit/withdrawal fees. You only pay standard on-chain blockchain transaction fees:</p>\n<ul class=\"doc-list\">\n<li><strong>On TRU</strong>: A standard mining transaction fee (typically around 0.001 TRU).</li>\n<li><strong>On Base</strong>: A fraction of a cent in native ETH (typically $0.001 to $0.01).</li>\n</ul>\n<h3 id=\"do-i-need-to-create-an-account-or-verify-my-identity-kyc\" class=\"doc-heading doc-h3\">Do I need to create an account or verify my identity (KYC)?<a class=\"anchor-link\" href=\"#do-i-need-to-create-an-account-or-verify-my-identity-kyc\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\"><strong>No.</strong> TRUSWAP is open-source software running directly on your computer or phone. There are no accounts, email addresses, phone numbers, passwords, or central servers.</p>\n<h3 id=\"why-does-the-app-say-insufficient-gas-when-i-have-enough-usdc\" class=\"doc-heading doc-h3\">Why does the app say &quot;Insufficient Gas&quot; when I have enough USDC?<a class=\"anchor-link\" href=\"#why-does-the-app-say-insufficient-gas-when-i-have-enough-usdc\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">On the Base network, token transfers and smart contract calls require native <strong>ETH</strong> to pay for network processing (&quot;gas&quot;). Even if you have 1,000 USDC, you cannot execute transactions without a tiny amount of ETH. Sending <strong>$1.00 to $2.00 worth of ETH on Base</strong> to your wallet is sufficient for dozens of swaps.</p>\n<h3 id=\"why-is-my-swap-waiting-for-block-confirmations\" class=\"doc-heading doc-h3\">Why is my swap waiting for block confirmations?<a class=\"anchor-link\" href=\"#why-is-my-swap-waiting-for-block-confirmations\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Proof-of-Work blockchains like TRU can occasionally experience orphaned blocks or short chain reorganizations. To ensure a deposit is irreversible before the buyer locks their USDC on Base, TRUSWAP requires <strong>6 confirmed blocks</strong> on the TRU network. This process takes a few minutes.</p>\n<h3 id=\"what-happens-if-the-other-trader-disappears-or-closes-their-app\" class=\"doc-heading doc-h3\">What happens if the other trader disappears or closes their app?<a class=\"anchor-link\" href=\"#what-happens-if-the-other-trader-disappears-or-closes-their-app\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">If the counterparty abandons the swap, your funds are safe:</p>\n<ul class=\"doc-list\">\n<li>When the timelock window expires (24 or 48 hours depending on your role), TRUSWAP will display a <strong>Refund</strong> button.</li>\n<li>Clicking <strong>Refund</strong> executes the refund path in the contract/script, returning 100% of your principal to your wallet.</li>\n</ul>\n<h3 id=\"can-i-use-the-same-wallet-on-both-my-phone-and-computer\" class=\"doc-heading doc-h3\">Can I use the same wallet on both my phone and computer?<a class=\"anchor-link\" href=\"#can-i-use-the-same-wallet-on-both-my-phone-and-computer\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Yes. Click <strong>Export</strong> on the TRU Vault Card and Base Vault Card on your primary device to view your backup phrases (24 words for TRU and 12 words for Base). On desktop devices, you can also copy your <code>data/vault.dat</code> and <code>data/.vault.key</code> files directly to the other computer&#x27;s <code>data/</code> folder.</p>\n<h3 id=\"how-do-i-inspect-my-individual-utxos-and-unspent-coin-outputs\" class=\"doc-heading doc-h3\">How do I inspect my individual UTXOs and unspent coin outputs?<a class=\"anchor-link\" href=\"#how-do-i-inspect-my-individual-utxos-and-unspent-coin-outputs\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">On the <strong>TRU Vault Card</strong> at the top left of the dashboard, click the <strong>UTXO Ledger</strong> link. A modal opens listing all unspent outputs with their TXID, output index (<code>vout</code>), value in TRU and raw atoms, confirmation count, and lock status.</p>\n<h3 id=\"how-do-i-view-live-blockchain-blocks-and-transactions\" class=\"doc-heading doc-h3\">How do I view live blockchain blocks and transactions?<a class=\"anchor-link\" href=\"#how-do-i-view-live-blockchain-blocks-and-transactions\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Click the <strong><code>\ud83d\udd0d TRU #&lt;Height&gt;</code></strong> badge in the top header bar, or navigate directly to <code>http://127.0.0.1:8899/explorer</code>. The built-in explorer lets you search by block height, hash, TXID, or address.</p>\n<h3 id=\"where-can-i-read-the-full-documentation-inside-the-app\" class=\"doc-heading doc-h3\">Where can I read the full documentation inside the app?<a class=\"anchor-link\" href=\"#where-can-i-read-the-full-documentation-inside-the-app\" title=\"Direct Link\">#</a></h3>\n<p class=\"doc-para\">Scroll to the footer at the bottom of the page and click <strong>\ud83d\udcd6 The TRUSWAP Book</strong>, or navigate directly to <code>http://127.0.0.1:8899/docs</code>.</p>\n<hr class=\"doc-divider\">\n<h2 id=\"2-common-errors-how-to-fix-them\" class=\"doc-heading doc-h2\">2. Common Errors &amp; How to Fix Them<a class=\"anchor-link\" href=\"#2-common-errors-how-to-fix-them\" title=\"Direct Link\">#</a></h2>\n<h3 id=\"1-camera-permission-denied-on-android\" class=\"doc-heading doc-h3\">1. &quot;Camera permission denied&quot; on Android<a class=\"anchor-link\" href=\"#1-camera-permission-denied-on-android\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Cause</strong>: Android blocked access to the camera hardware.</li>\n<li><strong>Solution</strong>: Open your phone&#x27;s <strong>Settings</strong> $\\rightarrow$ <strong>Apps</strong> $\\rightarrow$ <strong>TRUSWAP</strong> $\\rightarrow$ <strong>Permissions</strong> $\\rightarrow$ <strong>Camera</strong> $\\rightarrow$ Select <strong>&quot;Allow only while using the app&quot;</strong>.</li>\n</ul>\n<h3 id=\"2-base-rpc-timeout-or-429-too-many-requests\" class=\"doc-heading doc-h3\">2. &quot;Base RPC timeout or 429 Too Many Requests&quot;<a class=\"anchor-link\" href=\"#2-base-rpc-timeout-or-429-too-many-requests\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Cause</strong>: The default public Base RPC endpoint (<code>https://mainnet.base.org</code>) is experiencing rate-limiting during high traffic.</li>\n<li><strong>Solution</strong>: Launch TRUSWAP with an alternate public or private RPC endpoint:</li>\n</ul>\n<div class=\"code-block-wrapper\"><div class=\"code-header\"><span class=\"code-lang\">BASH</span><button class=\"copy-btn\" onclick=\"copyCode(this)\" title=\"Copy code to clipboard\">\ud83d\udccb Copy</button></div><pre><code class=\"language-bash\">  ./truswap --base-rpc https://base-rpc.publicnode.com</code></pre></div>\n<h3 id=\"3-no-peers-connected-on-tru-network\" class=\"doc-heading doc-h3\">3. &quot;No peers connected on TRU network&quot;<a class=\"anchor-link\" href=\"#3-no-peers-connected-on-tru-network\" title=\"Direct Link\">#</a></h3>\n<ul class=\"doc-list\">\n<li><strong>Cause</strong>: Outbound TCP port <code>21833</code> may be blocked by your local network or firewall.</li>\n<li><strong>Solution</strong>: Ensure your firewall allows outbound TCP traffic on port <code>21833</code>, or supply alternative peer addresses using <code>--tru-seeds</code>.</li>\n</ul>\n<hr class=\"doc-divider\">\n<h2 id=\"3-command-line-reference-configuration\" class=\"doc-heading doc-h2\">3. Command-Line Reference &amp; Configuration<a class=\"anchor-link\" href=\"#3-command-line-reference-configuration\" title=\"Direct Link\">#</a></h2>\n<p class=\"doc-para\">TRUSWAP can be customized via command-line flags or environment variables:</p>\n<div class=\"table-responsive\"><table class=\"doc-table\">\n<thead><tr>\n<th>Flag</th>\n<th>Default</th>\n<th>Environment Variable</th>\n<th>Description</th>\n</tr></thead>\n<tbody>\n<tr>\n<td><code>--bind &lt;IP:PORT&gt;</code></td>\n<td><code>127.0.0.1:8899</code></td>\n<td><code>BIND_ADDR</code></td>\n<td>Local web dashboard and API server address</td>\n</tr>\n<tr>\n<td><code>--dev</code></td>\n<td><code>false</code></td>\n<td><code>TRUSWAP_DEV=1</code></td>\n<td>Binds to <code>0.0.0.0:8899</code> to allow access from local network</td>\n</tr>\n<tr>\n<td><code>--mainnet</code></td>\n<td><code>true</code></td>\n<td><code>TRUSWAP_TESTNET=0</code></td>\n<td>Run on Base Mainnet (<code>8453</code>)</td>\n</tr>\n<tr>\n<td><code>--testnet</code></td>\n<td><code>false</code></td>\n<td><code>TRUSWAP_TESTNET=1</code></td>\n<td>Run on Base Sepolia testnet (<code>84532</code>)</td>\n</tr>\n<tr>\n<td><code>--data-dir &lt;PATH&gt;</code></td>\n<td><code>./data</code></td>\n<td><code>DATA_DIR</code></td>\n<td>Directory storing <code>vault.dat</code>, <code>tru.dat</code>, and <code>.vault.key</code></td>\n</tr>\n<tr>\n<td><code>--tru-seeds &lt;LIST&gt;</code></td>\n<td>Hardcoded list</td>\n<td><code>TRU_SEEDS</code></td>\n<td>Comma-separated list of TRU Proof-of-Work seed nodes (<code>IP:21833</code>)</td>\n</tr>\n<tr>\n<td><code>--base-rpc &lt;URL&gt;</code></td>\n<td><code>https://mainnet.base.org</code></td>\n<td><code>BASE_RPC_URL</code></td>\n<td>Base Layer-2 JSON-RPC endpoint</td>\n</tr>\n<tr>\n<td><code>--base-wss &lt;URL&gt;</code></td>\n<td><code>wss://mainnet.base.org</code></td>\n<td><code>BASE_WSS_URL</code></td>\n<td>Base WebSocket endpoint for event monitoring</td>\n</tr>\n<tr>\n<td><code>--htlc &lt;ADDRESS&gt;</code></td>\n<td><code>0x812b...4DF</code></td>\n<td><code>BASE_HTLC_CONTRACT</code></td>\n<td>Address of deployed <code>BaseHTLC</code> smart contract</td>\n</tr>\n<tr>\n<td><code>--usdc &lt;ADDRESS&gt;</code></td>\n<td><code>0x8335...913</code></td>\n<td><code>BASE_USDC_CONTRACT</code></td>\n<td>Address of Circle USDC token contract</td>\n</tr>\n<tr>\n<td><code>--relay</code></td>\n<td><code>false</code></td>\n<td><code>TRUSWAP_RELAY=1</code></td>\n<td>Run node as an orderbook relay message router</td>\n</tr>\n<tr>\n<td><code>--relay-node &lt;URL&gt;</code></td>\n<td><code>wss://tru.powgrid.xyz/orderbook</code></td>\n<td><code>TRUSWAP_RELAY_NODE</code></td>\n<td>Orderbook relay node WebSocket endpoint to connect to</td>\n</tr>\n<tr>\n<td><code>--blazing</code></td>\n<td><code>true</code> (if relay)</td>\n<td><code>RELAY_MODE=blazing</code></td>\n<td>Standard relay capacity profile (handles up to 5,000 concurrent client streams)</td>\n</tr>\n<tr>\n<td><code>--ultrablazing</code></td>\n<td><code>false</code></td>\n<td><code>RELAY_MODE=ultrablazing</code></td>\n<td>High-capacity relay profile (tunes Linux limits to 1,000,000 file descriptors)</td>\n</tr>\n<tr>\n<td><code>--resync</code></td>\n<td><code>false</code></td>\n<td><code>RESYNC=1</code></td>\n<td>Clear local block cache and re-download headers from genesis</td>\n</tr>\n</tbody>\n</table></div>", "raw_text": "  Chapter 11: Troubleshooting, FAQ & Configuration\n\nThis chapter provides answers to common user questions, solutions to error messages, and a complete command line reference for operators.\n\n   \n\n   1. Frequently Asked Questions (FAQ)\n\n    How much does it cost to use TRUSWAP?\n  TRUSWAP charges 0.00% protocol fees.    \nThere are no exchange commissions, registration costs, or deposit/withdrawal fees. You only pay standard on chain blockchain transaction fees:\n    On TRU  : A standard mining transaction fee (typically around 0.001 TRU).\n    On Base  : A fraction of a cent in native ETH (typically $0.001 to $0.01).\n\n    Do I need to create an account or verify my identity (KYC)?\n  No.   TRUSWAP is open source software running directly on your computer or phone. There are no accounts, email addresses, phone numbers, passwords, or central servers.\n\n    Why does the app say \"Insufficient Gas\" when I have enough USDC?\nOn the Base network, token transfers and smart contract calls require native   ETH   to pay for network processing (\"gas\"). Even if you have 1,000 USDC, you cannot execute transactions without a tiny amount of ETH. Sending   $1.00 to $2.00 worth of ETH on Base   to your wallet is sufficient for dozens of swaps.\n\n    Why is my swap waiting for block confirmations?\nProof of Work blockchains like TRU can occasionally experience orphaned blocks or short chain reorganizations. To ensure a deposit is irreversible before the buyer locks their USDC on Base, TRUSWAP requires   6 confirmed blocks   on the TRU network. This process takes a few minutes.\n\n    What happens if the other trader disappears or closes their app?\nIf the counterparty abandons the swap, your funds are safe:\n  When the timelock window expires (24 or 48 hours depending on your role), TRUSWAP will display a   Refund   button.\n  Clicking   Refund   executes the refund path in the contract/script, returning 100% of your principal to your wallet.\n\n    Can I use the same wallet on both my phone and computer?\nYes. Click   Export   on the TRU Vault Card and Base Vault Card on your primary device to view your backup phrases (24 words for TRU and 12 words for Base). On desktop devices, you can also copy your  data/vault.dat  and  data/.vault.key  files directly to the other computer's  data/  folder.\n\n    How do I inspect my individual UTXOs and unspent coin outputs?\nOn the   TRU Vault Card   at the top left of the dashboard, click the   UTXO Ledger   link. A modal opens listing all unspent outputs with their TXID, output index ( vout ), value in TRU and raw atoms, confirmation count, and lock status.\n\n    How do I view live blockchain blocks and transactions?\nClick the    \ud83d\udd0d TRU  <Height     badge in the top header bar, or navigate directly to  http://127.0.0.1:8899/explorer . The built in explorer lets you search by block height, hash, TXID, or address.\n\n    Where can I read the full documentation inside the app?\nScroll to the footer at the bottom of the page and click   \ud83d\udcd6 The TRUSWAP Book  , or navigate directly to  http://127.0.0.1:8899/docs .\n\n   \n\n   2. Common Errors & How to Fix Them\n\n    1. \"Camera permission denied\" on Android\n    Cause  : Android blocked access to the camera hardware.\n    Solution  : Open your phone's   Settings   $\\rightarrow$   Apps   $\\rightarrow$   TRUSWAP   $\\rightarrow$   Permissions   $\\rightarrow$   Camera   $\\rightarrow$ Select   \"Allow only while using the app\"  .\n\n    2. \"Base RPC timeout or 429 Too Many Requests\"\n    Cause  : The default public Base RPC endpoint ( https://mainnet.base.org ) is experiencing rate limiting during high traffic.\n    Solution  : Launch TRUSWAP with an alternate public or private RPC endpoint:\n     bash\n  ./truswap   base rpc https://base rpc.publicnode.com\n     \n\n    3. \"No peers connected on TRU network\"\n    Cause  : Outbound TCP port  21833  may be blocked by your local network or firewall.\n    Solution  : Ensure your firewall allows outbound TCP traffic on port  21833 , or supply alternative peer addresses using    tru seeds .\n\n   \n\n   3. Command Line Reference & Configuration\n\nTRUSWAP can be customized via command line flags or environment variables:\n\n  Flag   Default   Environment Variable   Description  \n                 \n     bind <IP:PORT      127.0.0.1:8899     BIND ADDR    Local web dashboard and API server address  \n     dev     false     TRUSWAP DEV=1    Binds to  0.0.0.0:8899  to allow access from local network  \n     mainnet     true     TRUSWAP TESTNET=0    Run on Base Mainnet ( 8453 )  \n     testnet     false     TRUSWAP TESTNET=1    Run on Base Sepolia testnet ( 84532 )  \n     data dir <PATH      ./data     DATA DIR    Directory storing  vault.dat ,  tru.dat , and  .vault.key   \n     tru seeds <LIST     Hardcoded list    TRU SEEDS    Comma separated list of TRU Proof of Work seed nodes ( IP:21833 )  \n     base rpc <URL      https://mainnet.base.org     BASE RPC URL    Base Layer 2 JSON RPC endpoint  \n     base wss <URL      wss://mainnet.base.org     BASE WSS URL    Base WebSocket endpoint for event monitoring  \n     htlc <ADDRESS      0x812b...4DF     BASE HTLC CONTRACT    Address of deployed  BaseHTLC  smart contract  \n     usdc <ADDRESS      0x8335...913     BASE USDC CONTRACT    Address of Circle USDC token contract  \n     relay     false     TRUSWAP RELAY=1    Run node as an orderbook relay message router  \n     relay node <URL      wss://tru.powgrid.xyz/orderbook     TRUSWAP RELAY NODE    Orderbook relay node WebSocket endpoint to connect to  \n     blazing     true  (if relay)    RELAY MODE=blazing    Standard relay capacity profile (handles up to 5,000 concurrent client streams)  \n     ultrablazing     false     RELAY MODE=ultrablazing    High capacity relay profile (tunes Linux limits to 1,000,000 file descriptors)  \n     resync     false     RESYNC=1    Clear local block cache and re download headers from genesis  \n"}];
    let currentChapterIndex = 0;

    function init() {
      renderSidebar();
      
      // Handle initial route from URL hash
      const hash = window.location.hash.replace('#', '').trim();
      let foundIdx = -1;
      if (hash) {
        foundIdx = CHAPTERS.findIndex(c => c.id === hash);
      }
      if (foundIdx === -1) {
        foundIdx = 0; // default to README
      }
      
      loadChapterByIndex(foundIdx);

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') {
          if (e.key === 'Escape') {
            e.target.blur();
            closeSearchDropdown();
            const mBar = document.getElementById('mobile-search-bar');
            if (mBar) mBar.classList.remove('open');
          }
          return;
        }
        if (e.key === '/') {
          e.preventDefault();
          if (window.innerWidth <= 768) {
            toggleMobileSearch();
          } else {
            const inp = document.getElementById('search-input');
            if (inp) inp.focus();
          }
        } else if (e.key === 'ArrowLeft') {
          navigateChapter(-1);
        } else if (e.key === 'ArrowRight') {
          navigateChapter(1);
        }
      });

      // Close search dropdown on click outside
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.header-search-wrap') && !e.target.closest('.mobile-search-bar') && !e.target.closest('.mobile-search-btn')) {
          closeSearchDropdown();
          const mBar = document.getElementById('mobile-search-bar');
          if (mBar) mBar.classList.remove('open');
        }
      });
    }

    function renderSidebar() {
      const list = document.getElementById('chapter-list');
      list.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="chapter-item">
          <a class="chapter-link ${idx === currentChapterIndex ? 'active' : ''}" 
             id="link-${ch.id}" 
             onclick="loadChapter('${ch.id}')">
            <div class="chapter-link-left">
              <span class="chapter-icon">${ch.icon}</span>
              <span class="chapter-title-text">${ch.title}</span>
            </div>
            <span class="chapter-num">${ch.num}</span>
          </a>
        </li>
      `).join('');
    }

    function loadChapter(id) {
      const idx = CHAPTERS.findIndex(c => c.id === id);
      if (idx !== -1) {
        loadChapterByIndex(idx);
      }
    }

    function loadChapterByIndex(idx) {
      if (idx < 0 || idx >= CHAPTERS.length) return;
      currentChapterIndex = idx;
      const ch = CHAPTERS[idx];

      // Update URL hash without reload
      window.history.replaceState(null, ch.title, '#' + ch.id);

      // Render content
      document.getElementById('meta-breadcrumb-title').textContent = ch.title;
      document.getElementById('meta-read-time').textContent = ch.read_time;
      document.getElementById('article-content').innerHTML = ch.html;

      // Update sidebar active state
      document.querySelectorAll('.chapter-link').forEach(el => el.classList.remove('active'));
      const activeLink = document.getElementById('link-' + ch.id);
      if (activeLink) activeLink.classList.add('active');

      // Scroll reader pane to top
      document.getElementById('content-pane').scrollTop = 0;

      // Update Prev / Next buttons
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      if (idx > 0) {
        prevBtn.style.display = 'flex';
        document.getElementById('prev-title').textContent = CHAPTERS[idx - 1].title;
      } else {
        prevBtn.style.display = 'none';
      }

      if (idx < CHAPTERS.length - 1) {
        nextBtn.style.display = 'flex';
        document.getElementById('next-title').textContent = CHAPTERS[idx + 1].title;
      } else {
        nextBtn.style.display = 'none';
      }

      // Close mobile drawer and backdrop if open
      document.getElementById('book-sidebar').classList.remove('open');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (backdrop) backdrop.classList.remove('open');
    }

    function navigateChapter(delta) {
      loadChapterByIndex(currentChapterIndex + delta);
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('book-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const isOpen = sidebar.classList.toggle('open');
      if (backdrop) {
        if (isOpen) {
          backdrop.classList.add('open');
        } else {
          backdrop.classList.remove('open');
        }
      }
    }

    function toggleMobileSearch() {
      const bar = document.getElementById('mobile-search-bar');
      if (!bar) return;
      const isOpen = bar.classList.toggle('open');
      if (isOpen) {
        const inp = document.getElementById('mobile-search-input');
        if (inp) {
          inp.value = '';
          inp.focus();
        }
      } else {
        const dd = document.getElementById('mobile-search-dropdown');
        if (dd) dd.style.display = 'none';
      }
    }

    function handleSearch(query, source = 'desktop') {
      const isMobile = source === 'mobile';
      const dropdown = document.getElementById(isMobile ? 'mobile-search-dropdown' : 'search-dropdown');
      if (!dropdown) return;

      query = query.trim().toLowerCase();
      if (!query || query.length < 2) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      const matches = [];
      CHAPTERS.forEach((ch, idx) => {
        const titleMatch = ch.title.toLowerCase().includes(query);
        const textIdx = ch.raw_text.toLowerCase().indexOf(query);
        if (titleMatch || textIdx !== -1) {
          let snippet = "";
          if (textIdx !== -1) {
            const start = Math.max(0, textIdx - 40);
            const end = Math.min(ch.raw_text.length, textIdx + 80);
            snippet = (start > 0 ? "..." : "") + ch.raw_text.substring(start, end).replace(/\s+/g, ' ') + "...";
          } else {
            snippet = ch.title;
          }
          matches.push({ chapter: ch, idx: idx, snippet: snippet });
        }
      });

      if (matches.length === 0) {
        dropdown.innerHTML = '<div style="padding: 12px 14px; font-size: 0.85rem; color: var(--text-dim);">No matches found for "' + htmlEscape(query) + '"</div>';
      } else {
        dropdown.innerHTML = matches.map(m => `
          <div class="search-result-item" onclick="selectSearchResult('${m.chapter.id}')">
            <div class="search-result-title">${m.chapter.icon} ${m.chapter.title}</div>
            <div class="search-result-snippet">${htmlEscape(m.snippet)}</div>
          </div>
        `).join('');
      }
      dropdown.style.display = 'block';
    }

    function selectSearchResult(id) {
      closeSearchDropdown();
      const dInput = document.getElementById('search-input');
      if (dInput) dInput.value = '';
      const mInput = document.getElementById('mobile-search-input');
      if (mInput) mInput.value = '';
      const mBar = document.getElementById('mobile-search-bar');
      if (mBar) mBar.classList.remove('open');
      loadChapter(id);
    }

    function closeSearchDropdown() {
      const dDropdown = document.getElementById('search-dropdown');
      if (dDropdown) dDropdown.style.display = 'none';
      const mDropdown = document.getElementById('mobile-search-dropdown');
      if (mDropdown) mDropdown.style.display = 'none';
    }

    function htmlEscape(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function copyCode(btn) {
      const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const orig = btn.innerText;
        btn.innerText = "✓ Copied!";
        btn.style.color = "var(--accent-green)";
        btn.style.borderColor = "var(--accent-green)";
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.color = "";
          btn.style.borderColor = "";
        }, 2000);
      }).catch(err => {
        console.error("Clipboard copy failed", err);
      });
    }

    function isExternalUrl(url) {
      if (!url || typeof url !== 'string') return false;
      if (!url.startsWith('http://') && !url.startsWith('https://')) return false;
      try {
        const parsed = new URL(url, window.location.href);
        const host = parsed.hostname;
        const isLocal = host === '127.0.0.1' || host === 'localhost' || host === window.location.hostname;
        return !isLocal;
      } catch (_) {
        return false;
      }
    }

    function openExternalUrl(url) {
      if (!url) return;
      try {
        fetch('/api/open_browser', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        }).catch(e => {
          console.warn("[ExternalUrl] open_browser error:", e);
        });
      } catch (_) {}

      const isAndroid = navigator.userAgent.includes('TRUSWAP_APK') || /Android/i.test(navigator.userAgent);
      if (!isAndroid) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }
    window.openExternalUrl = openExternalUrl;

    document.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (!link) return;

      const rawHref = link.getAttribute('href');
      if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('javascript:')) {
        return;
      }

      const href = link.href;
      if (isExternalUrl(href)) {
        e.preventDefault();
        e.stopPropagation();
        openExternalUrl(href);
      }
    }, true);

    window.onload = init;
  </script>
</body>
